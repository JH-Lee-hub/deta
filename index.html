<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151516">
<title>제타앱</title>
<!--
  제타앱 — 제타와 같은 화면 · 같은 결 · 거기에 **장기기억**

  회원님 지시 (260910) —
    「제타랑 똑같은 레이아웃, 기능, 동일수준의 출력 되게끔 앱 만들어놓고,
     해당 플롯들도 안에 구현해놔.」
    「제타앱이 갖지 못한 '장기기억'을 나는 갖는게 목표니까,
     제타앱에는 장기기억을 추가로 구현해놓고.」

  색과 크기는 **제타 실물에서 잰 것**이다 (07. 제타에서 받은 것/4. 화면 그림/00_결.json)
    바탕 rgb(21,21,22) · 강조 rgb(124,103,255) · 글꼴 Pretendard Variable
-->
<style>
/* ── 결 ─────────────────────────────────────────────
   제타 화면에서 실제로 잰 값. 짐작한 것이 아니다 */
:root{
  --바탕:#151516;          /* rgb(21,21,22) */
  --바탕2:#1e1e20;         /* 말풍선 · 카드 */
  --바탕3:#26262a;         /* 눌린 것 */
  --글자:#ffffff;
  --흐림:#595b63;          /* rgb(89,91,99) — 마지막 메시지 · 지문 */
  --흐림2:#8b8d95;
  --강조:#7c67ff;          /* rgb(124,103,255) */
  --강조흐림:#5a48c7;
  --빨강:#f04438;
  --선:#2a2a2e;
  --머리높이:52px;
  --발높이:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--바탕); color:var(--글자);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;
  font-size:16px}   /* 16px 밑이면 iOS 가 확대한다 */
img{display:block;max-width:100%}
.숨김{display:none!important}

/* ── 판 짜기 ───────────────────────────────────────── */
/* ★ 260910 회원님 : 「PC 브라우저에서 켠 제타앱은 높이가 높아야 아래가 나온다.
   상단/하단 바들은 필수 노출되게 하고, 세로 길이가 줄어들면 하단 필수바 위에서 축소되게 하라.」

   까닭은 **`min-height:0` 이 없어서**였다. flex 자식은 기본이 `min-height:auto` 라
   내용만큼 커지고, 그만큼 아래 바가 화면 밖으로 밀려난다.
   가운데(#몸)만 줄어들게 하면 머리와 발은 늘 남는다 */
#앱{display:flex;flex-direction:column;height:100dvh;min-height:0;
  max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#머리자리,#입력자리,#발{flex:0 0 auto}
#몸{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
#몸::-webkit-scrollbar{width:0}

/* 머리 */
.머리{
  height:var(--머리높이); flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 14px; background:var(--바탕); border-bottom:1px solid var(--선);
  position:sticky; top:0; z-index:20;
}
.머리 .제목{font-size:20px;font-weight:700;letter-spacing:-.3px}
.머리 .가운데{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.머리 .단추{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:18px}
.머리 .단추:active{background:var(--바탕3)}

/* 발 — 하단 네비 넷 */
#발{
  height:var(--발높이); flex:0 0 auto; display:flex; border-top:1px solid var(--선);
  background:var(--바탕); padding-bottom:env(safe-area-inset-bottom);
}
#발 button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--흐림); font-size:10px;
}
#발 button .꼭지{font-size:19px;line-height:1}
#발 button.켬{color:var(--글자)}

/* ── 홈(랭킹) ──────────────────────────────────────── */
.탭줄{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.탭줄::-webkit-scrollbar{height:0}
.탭{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--흐림2);
  background:var(--바탕2);white-space:nowrap}
.탭.켬{background:var(--글자);color:#111}
.탭줄.맨탭 .탭{background:none;padding:6px 4px;font-size:15px;font-weight:600}
.탭줄.맨탭 .탭.켬{background:none;color:var(--글자);border-bottom:2px solid var(--글자);border-radius:0}

.플롯줄{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--선)}
.플롯줄 .순위{width:22px;flex:0 0 auto;font-size:15px;font-weight:700;color:var(--흐림2);padding-top:2px}
.플롯줄 .그림{width:64px;height:64px;flex:0 0 auto;border-radius:10px;background:var(--바탕3);
  object-fit:cover}
.플롯줄 .속{flex:1;min-width:0}
.플롯줄 .이름{font-size:15px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .한줄{font-size:12px;color:var(--흐림2);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .태그{font-size:11px;color:var(--강조);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .셈{font-size:11px;color:var(--흐림);margin-top:3px}

/* ── 대화 목록 ─────────────────────────────────────── */
.칸제목{padding:14px 14px 8px;font-size:15px;font-weight:700;display:flex;align-items:center;
  justify-content:space-between}
/* ★ 260910 회원님 : 「대화 목록 우상단의 더보기 기능이 없다면 취소선을 그어라.」
   있는 척하는 것보다 없다고 하는 편이 낫다 */
.칸제목 .더{font-size:12px;color:var(--흐림2);font-weight:400;
  text-decoration:line-through;opacity:.55}
.스크랩줄{display:flex;gap:12px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.스크랩줄::-webkit-scrollbar{height:0}
.스크랩{flex:0 0 auto;width:62px;text-align:center}
.스크랩 img{width:62px;height:78px;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.스크랩 .이름{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.방줄{display:flex;gap:12px;padding:11px 14px;align-items:center}
.방줄:active{background:var(--바탕2)}
.방줄 img{width:46px;height:46px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.방줄 .속{flex:1;min-width:0}
.방줄 .이름{font-size:14px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.방줄 .끝말{font-size:12px;color:var(--흐림);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 방 안 ────────────────────────────────────────── */
#대화판{padding:14px 12px 8px;display:flex;flex-direction:column;gap:14px}

/* 유저 — 오른쪽 보라 */
.내말{align-self:flex-end;max-width:78%;background:var(--강조);color:#fff;
  padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}

/* 인물 — 왼쪽 회색. 이름줄이 위에 */
.남말{display:flex;gap:9px;max-width:88%}
.남말 .얼굴{width:30px;height:30px;flex:0 0 auto;border-radius:50%;object-fit:cover;
  background:var(--바탕3);margin-top:16px}
.남말 .묶음{flex:1;min-width:0}
.남말 .이름{font-size:12px;color:var(--흐림2);margin-bottom:4px}
.방울{background:var(--바탕2);padding:10px 13px;border-radius:16px;position:relative;
  font-size:14px;word-break:break-word}
.방울+.방울{margin-top:6px}
.방울 .모델딱지{position:absolute;right:8px;bottom:4px;font-size:9px;color:#3a3a40}
/* 지문과 대사가 **한 말풍선 안에서** 갈린다 — 제타 실물이 그렇다 */
.방울 .지문{color:var(--흐림2);font-style:italic;display:block}
.방울 .대사{color:var(--글자);font-weight:600;display:block}
.방울 .지문+.대사,.방울 .대사+.지문{margin-top:6px}

/* 내레이션 — 말풍선 없이 ≡ */
.나레{display:flex;gap:8px;color:var(--흐림2);font-style:italic;font-size:13px;
  padding:0 4px;line-height:1.7}
.나레::before{content:"≡";flex:0 0 auto;color:var(--흐림);font-style:normal}

/* 입력 */
#입력칸{flex:0 0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--선);background:var(--바탕)}
#입력줄{display:flex;align-items:flex-end;gap:8px;background:var(--바탕2);
  border-radius:22px;padding:6px 6px 6px 12px}
/* ★ 260911 — **16px 밑이면 iOS 사파리가 화면을 확대한다.**
   글을 치려고 누를 때마다 판이 커졌다 줄었다 해서 쓰기가 나쁘다.
   입력할 수 있는 칸은 전부 16px 로 둔다 */
#입력{flex:1;resize:none;max-height:110px;font-size:16px;padding:6px 0;line-height:1.45}
#입력::placeholder{color:var(--흐림)}
#보내기{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--강조);
  display:grid;place-items:center;font-size:15px}
#보내기[disabled]{background:var(--바탕3);color:var(--흐림)}
#연장{display:flex;gap:14px;padding:6px 16px 2px;color:var(--흐림2);font-size:16px}

/* ── 플롯 정보 ─────────────────────────────────────── */
.플롯그림{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--바탕3)}
.플롯속{padding:16px 14px 90px}
.플롯속 h1{font-size:22px;font-weight:800;margin:0 0 6px}
.플롯속 .한줄{font-size:14px;color:#d5d6da;margin-bottom:8px}
.플롯속 .태그{font-size:13px;color:var(--강조);margin-bottom:10px}
.배지줄{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.배지{font-size:11px;color:var(--흐림2);background:var(--바탕2);padding:4px 9px;border-radius:999px}
.칸{margin-top:20px}
.칸 h2{font-size:15px;font-weight:700;margin:0 0 8px}
.칸 .글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7}
.아래고정{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px
  calc(10px + env(safe-area-inset-bottom));background:var(--바탕);border-top:1px solid var(--선);
  max-width:520px;margin:0 auto}
.아래고정 .북{width:48px;flex:0 0 auto;border-radius:12px;background:var(--바탕2);
  display:grid;place-items:center;font-size:17px}
.아래고정 .큰단추{flex:1;height:48px;border-radius:12px;background:var(--강조);
  font-size:15px;font-weight:700;display:grid;place-items:center}

/* ── 만들기 ───────────────────────────────────────── */
.만들기판{padding:16px 14px}
.빈말{padding:40px 20px;text-align:center;color:var(--흐림);font-size:13px;line-height:1.9}

/* ── 바닥시트 · 덮개 ── */
#덮개{position:fixed;inset:0;background:#000a;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s}
#덮개.보임{opacity:1;pointer-events:auto}
#시트{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:520px;margin:0 auto;
  background:var(--바탕2);border-radius:18px 18px 0 0;transform:translateY(101%);
  transition:transform .22s;max-height:82dvh;display:flex;flex-direction:column}
#시트.보임{transform:none}
#시트 .손잡이{width:38px;height:4px;border-radius:2px;background:#3a3a40;margin:9px auto 4px;
  cursor:ns-resize;touch-action:none}
#시트 .손잡이:before{content:"";position:absolute;left:0;right:0;height:26px;margin-top:-11px}
#시트 .손잡이{position:relative}
#시트 .시트머리{padding:6px 18px 10px;font-size:15px;font-weight:700}
/* 속만 스크롤되고 아래 단추줄은 늘 보인다 */
#시트 .시트속{overflow-y:auto;flex:1 1 auto;min-height:0;
  padding:0 8px calc(14px + env(safe-area-inset-bottom))}
#시트 .시트단추{flex:0 0 auto}
.시트줄{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;
  font-size:14px;width:100%;text-align:left}
.시트줄:active{background:var(--바탕3)}
.시트줄 .꼭{width:22px;text-align:center;font-size:16px}
.시트줄 .밑{font-size:11px;color:var(--흐림);margin-top:2px}
.시트줄.빨강{color:var(--빨강)}
.시트줄.켬{background:var(--바탕3)}
#시트 textarea{width:100%;background:var(--바탕);border-radius:12px;padding:12px;
  font-size:14px;min-height:120px;resize:vertical;line-height:1.6}
#시트 .시트단추{display:flex;gap:8px;padding:10px 12px}
#시트 .시트단추 button{flex:1;height:44px;border-radius:12px;background:var(--바탕3);
  font-size:14px;font-weight:600}
#시트 .시트단추 button.강{background:var(--강조)}

/* 인물 정보 */
.인물머리{display:flex;gap:12px;padding:4px 12px 14px;align-items:center}
.인물머리 img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--바탕3)}
.인물머리 .이름{font-size:17px;font-weight:700}
.인물머리 .밑{font-size:12px;color:var(--흐림2)}
.인물글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7;padding:0 12px 8px}

/* 눌리는 것 */
.방울{cursor:pointer}
.남말 .얼굴{cursor:pointer}

/* 알림 */
#알림{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;
  background:#000c;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%}
#알림.보임{opacity:1}
</style>
</head>
<body>
<div id="앱">
  <div id="머리자리"></div>
  <div id="몸"></div>
  <div id="입력자리"></div>
  <div id="발"></div>
</div>
<!-- ★ 260910 회원님 : 「모든 창 좌상단에 < 로 뒤로가기 버튼 오버레이 해놔.」
     머리에 있던 ‹ 를 떼고 이 하나로 모았다. 어느 창이든 같은 자리에 있다 -->
<button id="뒤로떠" data-가="뒤로" aria-label="뒤로">‹</button>
<div id="덮개"></div>
<div id="시트"></div>
<style>
#뒤로떠{position:fixed;left:10px;top:10px;z-index:60;width:38px;height:38px;
  border-radius:50%;display:none;place-items:center;font-size:24px;line-height:1;
  padding-bottom:3px;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
#뒤로떠.보임{display:grid}
.방더{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:8px;color:var(--흐림);font-size:18px}
.방더:active{background:var(--바탕3)}
.플롯연필{position:absolute;right:10px;top:10px;z-index:30;width:38px;height:38px;
  border-radius:50%;display:grid;place-items:center;font-size:17px;
  background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
</style>
<div id="알림"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════
   제타앱

   ★ 이 파일 하나가 앱 전부다. 옛 앱과 같은 얼개다.
   ★ 화면은 제타 실물을 찍어 놓고 보고 그렸다.
     그림 — 07. 제타에서 받은 것/4. 화면 그림/
   ══════════════════════════════════════════════════════ */

const S = {              /* 지금 상태 */
  화면: '대화',           /* 홈 · 대화 · 만들기 · 나 */
  방: null,              /* 열려 있는 방 */
  플롯: null,            /* 열려 있는 플롯 */
  보낸중: false
};
const D = {              /* 담아 둔 것 */
  플롯: [], 방: [], 도막: {}, 인기: []
};

/* 줄바꿈.
   ★ 260910 — 이것이 없어서 **중계로 요청이 아예 안 나갔다.**
     `말보내기` 안에서 NL 을 쓰는데 만드는 자리가 없었다. 회원님이 폰에서 치셨는데 무응답이었다.
   ★ 소스에 역빗금을 안 쓴다 — 스크립트로 이 파일을 고칠 때 한 겹 벗겨진다 (G6) */
const NL = String.fromCharCode(10);

const $ = s => document.querySelector(s);
const 몸 = () => $('#몸');
const 알림 = 글 => {
  const e = $('#알림'); e.textContent = 글; e.classList.add('보임');
  clearTimeout(알림._t); 알림._t = setTimeout(() => e.classList.remove('보임'), 1800);
};
const 넣기 = (자리, html) => { $(자리).innerHTML = html; };
const 안전 = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ── 도막 한 조각을 지문/대사로 가른다 ──
   제타 실물 : 지문 65% · 섞임 33% · 대사만 1.9%.
   한 조각 안에 *지문* 과 대사가 섞여 있다. 별표로 가른다 */
function 조각그리기(글){
  const t = String(글 || "");
  if (!t.trim()) return "";
  /* 별표로 자른다. 홀수 자리가 지문이다.
     ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 (G6) */
  const 토막 = t.split("*");
  let 낸것 = "";
  토막.forEach((조각, i) => {
    const x = 조각.trim();
    if (!x) return;
    낸것 += (i % 2 === 1)
      ? '<span class="지문">' + 안전(x) + '</span>'
      : '<span class="대사">' + 안전(x) + '</span>';
  });
  return 낸것 || '<span class="대사">' + 안전(t) + '</span>';
}

/* ★ 260910 회원님 : 「채팅창의 연필모양 눌러 띄우는 팝업창 위에 핸들이 있는데,
   이걸 통해 입력창을 늘릴 수도 있어야 한다.」

   손잡이를 위로 끌면 시트가 커지고 그 안의 입력칸도 함께 커진다 */
function 손잡이붙이기(){
  const 시 = $("#시트");
  const 손 = 시 && 시.querySelector(".손잡이");
  if (!손) return;
  let 잡음 = null;
  const 시작 = e => {
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    잡음 = {y, 높이: 시.getBoundingClientRect().height};
    e.preventDefault();
  };
  const 움직임 = e => {
    if (!잡음) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const 새높이 = Math.max(180, Math.min(innerHeight * 0.94, 잡음.높이 + (잡음.y - y)));
    시.style.maxHeight = 새높이 + "px";
    시.style.height = 새높이 + "px";
    /* 안에 입력칸이 있으면 함께 늘린다 */
    const 칸 = 시.querySelector("textarea");
    if (칸) 칸.style.minHeight = Math.max(90, 새높이 - 170) + "px";
    e.preventDefault();
  };
  const 끝 = () => { 잡음 = null; };
  손.addEventListener("mousedown", 시작);
  손.addEventListener("touchstart", 시작, {passive: false});
  addEventListener("mousemove", 움직임, {passive: false});
  addEventListener("touchmove", 움직임, {passive: false});
  addEventListener("mouseup", 끝);
  addEventListener("touchend", 끝);
}

/* 도막 하나를 그린다.

   ★ 260910 — **`position` 으로 가른다.** 도막이 아니라 **조각마다** 다르다 —
     LEFT      인물     왼쪽 회색 말풍선
     RIGHT     유저     오른쪽 보라 말풍선
     NARRATOR  내레이션  말풍선 없이 ≡
   한 도막 안에 LEFT 와 NARRATOR 가 섞여 온다. 그래서 조각 단위로 돈다 */
/* 별표를 벗긴다.
   ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 한 겹 벗겨진다 (Ground rule G6) */
function 별표벗기기(글){
  return String(글 || '').split('*').join('').trim();
}

function 도막그리기(m, 몇){
  const 조각 = (m.contents || []).filter(c => c.type === "TEXT" && c.text);
  if (!조각.length) return "";
  const 낸것 = [];
  let 묶음 = null;              /* 이어지는 LEFT 조각을 한 묶음으로 */
  const 묶음닫기 = () => {
    if (!묶음) return;
    const 얼굴 = 얼굴찾기(묶음.이름);
    낸것.push(
      '<div class="남말">' +
        (얼굴 ? '<img class="얼굴" src="' + 안전(얼굴) + '" loading=lazy data-인물="' + 안전(묶음.이름) + '">'
            : '<div class="얼굴" data-인물="' + 안전(묶음.이름) + '"></div>') +
        '<div class="묶음">' +
          '<div class="이름">' + 안전(묶음.이름) + '</div>' +
          묶음.글.map(t => '<div class="방울" data-도막="' + 몇 + '">' + 조각그리기(t) +
            '<span class="모델딱지">' + 안전((S.방 && S.방.모델) || "zeta") + '</span></div>').join("") +
        '</div>' +
      '</div>');
    묶음 = null;
  };

  for (const c of 조각){
    const 자리 = c.position || (((m.sender && m.sender.type) === "BOT") ? "LEFT" : "RIGHT");
    if (자리 === "RIGHT"){
      묶음닫기();
      낸것.push('<div class="내말" data-도막="' + 몇 + '">' + 안전(c.text) + '</div>');
    } else if (자리 === "NARRATOR"){
      묶음닫기();
      /* 내레이션은 별표를 벗기고 ≡ 로 놓는다 */
      낸것.push('<div class="나레">' + 안전(별표벗기기(c.text)) + '</div>');
    } else {
      const 이름 = c.speakerName || "";
      if (묶음 && 묶음.이름 === 이름) 묶음.글.push(c.text);
      else { 묶음닫기(); 묶음 = {이름, 글: [c.text]}; }
    }
  }
  묶음닫기();
  return 낸것.join("");
}
/* 인물 이름으로 얼굴을 찾는다. 방의 플롯에 인물 그림이 들어 있다 */
function 얼굴찾기(이름){
  if (!S.방) return null;
  const p = D.플롯.find(x => x.id === S.방.플롯아이디);
  if (!p) return null;
  const c = (p.characters || []).find(c => c.name === 이름);
  return (c && c.imageUrl) || p.imageUrl || null;
}

const 만단위 = n => n >= 10000 ? (n / 10000).toFixed(1) + '만' : String(n);
const 칸그리기 = (제목, 글) => !글 ? '' :
  '<div class="칸"><h2>' + 제목 + '</h2><div class="글">' + 안전(글) + '</div></div>';
/* **인트로 도막을 앱 꼴로 바꾼다.**

   ★ 260910 — 플롯 서른 개가 전부 인트로가 비어 보였다. 까닭은 **꼴이 다른 것**이었다 —
     대화 도막 : {contents: [{type:"TEXT", text, speakerName, position}]}
     인트로 도막: {type:"text", content:"…", senderType:"BOT", senderId}
   앱은 contents 만 찾아서 늘 빈 값을 냈고, 새 대화도 소개 한 줄로 시작했다.

   senderId 를 characters 와 맞춰 누가 말하는지 되살린다.
   맞는 인물이 없으면 내레이터로 둔다 (제타도 그렇게 그린다) */
function 인트로도막(플롯){
  const 인 = ((플롯 && 플롯.intros) || [])[0];
  const 대화 = 인 && (인.conversation || {});
  const 목 = (대화 && (대화.messages || (Array.isArray(대화) ? 대화 : null))) || [];
  const 이름표 = {};
  for (const c of ((플롯 && 플롯.characters) || [])) if (c && c.id) 이름표[c.id] = c.name;
  const 때 = new Date().toISOString();
  const 낸것 = [];
  for (const m of 목){
    /* 이미 앱 꼴이면 그대로 쓴다 */
    if (Array.isArray(m.contents)){
      const 조각 = m.contents.filter(c => c.type === "TEXT" && c.text);
      if (조각.length) 낸것.push({sender: {type: "BOT"}, contents: 조각, messageTime: 때});
      continue;
    }
    if (m.type === "image" && m.url){
      낸것.push({sender: {type: "BOT"}, 그림: m.url, contents: [], messageTime: 때});
      continue;
    }
    const 글 = String(m.content || "").trim();
    if (!글) continue;
    const 유저 = (m.senderType === "USER");
    const 이름 = 이름표[m.senderId] || "";
    낸것.push({sender: {type: 유저 ? "USER" : "BOT"},
      contents: [{type: "TEXT",
                  position: 유저 ? "RIGHT" : (이름 ? "LEFT" : "NARRATOR"),
                  speakerName: 유저 ? "" : (이름 || "내레이터"), text: 글}],
      messageTime: 때});
  }
  return 낸것;
}

function 인트로글(p){
  return 인트로도막(p).map(m => (m.contents || [])
    .filter(x => x.type === "TEXT")
    .map(x => (x.speakerName ? x.speakerName + NL : "") + x.text).join(NL))
    .filter(x => x.trim()).join(NL + NL);
}

     열쇠와 초대 코드는 **빼고** 낸다 */
function 파일로내리기(이름, 글){
  try {
    const 덩이 = new Blob([글], {type: "application/json;charset=utf-8"});
    const 길 = URL.createObjectURL(덩이);
    const a = document.createElement("a");
    a.href = 길; a.download = 이름;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(길); a.remove(); }, 800);
    return true;
  } catch(_){ return false; }
}

  const d = new Date(); const z = n => (n < 10 ? "0" : "") + n;

         "_" + z(d.getHours()) + z(d.getMinutes());
};

  const id = "새-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);

  const 방 = {id, 제목: 플롯.name, 그림: 플롯.imageUrl, 플롯아이디: 플롯.id,
              프로필아이디: (프 && 프.id) || "",
              모델: "zeta", 끝말: "", 이어하기: [], 새것: true};

  /* 인트로를 첫 도막으로 — ★ 260910 꼴이 달라 여태 비어 있었다 */
  const 도막 = 인트로도막(플롯).filter(m => (m.contents || []).length);
  /* 인트로가 없으면 소개라도 한 줄 놓는다 — 빈 화면으로 시작하면 막막하다 */
  if (!도막.length && (플롯.longDescription || 플롯.shortDescription)){
    도막.push({sender: {type: "BOT"}, contents: [{type: "TEXT", position: "NARRATOR",
      speakerName: "내레이터", text: 플롯.longDescription || 플롯.shortDescription}],
      messageTime: new Date().toISOString()});
  }

  D.방.unshift(방);
  D.도막[id] = 도막;
  /* 이 플롯이 내 목록에 없으면 넣는다 — 인기 플롯에서 시작한 경우 */
  if (!D.플롯.some(p => p.id === 플롯.id)) D.플롯.unshift(플롯);
  새것담기();

  S.플롯 = null; S.방 = 방;
  그리기();
  /* ★ 제타와 같게 — 방에 들어간 뒤 대화 프로필을 고른다.
     제타는 새 방에 들어가면 곧바로 「선택 · 대화 프로필 추가」가 뜬다 */
  setTimeout(() => { if (프로필들().length) 프로필열기(); else 프로필쓰기(null); }, 420);
  알림("새 대화를 시작했습니다");
}

/* 새로 만든 방과 도막을 담아 둔다 — 자료.json 은 못 고치므로 브라우저에 */
function 새것담기(){
  try {
    const 새방 = D.방.filter(r => r.새것);
    const 새도막 = {};
    for (const r of 새방) 새도막[r.id] = D.도막[r.id] || [];
    /* 받아 온 방에서 이어 친 것도 담는다 */
    for (const r of D.방){
      if (r.새것) continue;
      const 처음 = (기본도막수[r.id] || 0);
      const 지금 = (D.도막[r.id] || []).length;
      if (지금 > 처음) 새도막[r.id] = D.도막[r.id];
    }
    localStorage.setItem("새방", JSON.stringify(새방));
    localStorage.setItem("새도막", JSON.stringify(새도막));
  } catch(e){ 알림("담기 실패 — 자리가 모자랍니다"); }
}

async function 자동생성(){
  const 중계 = 중계주소();

  if (S.보낸중) return;
  S.보낸중 = true;
  알림("짓는 중…");
  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/plot", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({모델: 고른모델().모델 || undefined})
    });
    const j = await r.json();
    if (j.error){ 알림((j.error && j.error.message) || "탈"); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    const p = 플롯가르기(글, j.자리);
    if (!p){ 알림("못 알아들었습니다"); S.보낸중 = false; return; }

    const 목 = 지은것읽기();
    목.unshift(p);
    try { localStorage.setItem("지은플롯", JSON.stringify(목.slice(0, 60))); } catch(_){}
    D.플롯.unshift(p);
    S.플롯 = p; S.방 = null;
    그리기();
    알림("지었습니다 — " + (j.자리 && j.자리.갈래 ? j.자리.갈래 : ""));
  } catch (e){ 알림("못 지었습니다 — " + String(e.message).slice(0, 30)); }
  S.보낸중 = false;
}

/* 지은 글을 플롯 한 벌로 가른다.
   ★ 정규식을 안 쓴다 (G6). 칸 이름은 「이름>>」 꼴이다 */
function 플롯가르기(글, 자리){
  const 줄 = String(글).split(NL);
  const 칸 = {};
  let 지금 = null;
  for (const l of 줄){
    const t = l.trim();
    const i = t.indexOf(">>");
    if (i > 0 && i <= 4){
      지금 = t.slice(0, i).trim();
      칸[지금] = t.slice(i + 2).trim();
      continue;
    }
    if (지금) 칸[지금] = (칸[지금] ? 칸[지금] + NL : "") + l;
  }
  const 이름 = (칸["이름"] || "").trim();
  if (!이름) return null;
  const 인물이름 = ((칸["캐릭터"] || "").split(NL)[0] || "")
    .split("|")[0].split("·")[0].split("(")[0].split(",")[0].trim() || 이름;
  return {
    id: "지은-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
    name: 이름,
    imageUrl: null,
    shortDescription: (칸["한줄"] || "").trim(),
    longDescription: (칸["소개"] || "").trim(),
    hashtags: (칸["태그"] || "").split(",").map(x => x.trim().split("#").join("")).filter(Boolean),
    characters: [{name: 인물이름, description: (칸["캐릭터"] || "").trim(), imageUrl: null}],
    chatProfiles: [],
    intros: [{conversation: {messages: [{contents: [{type: "TEXT", position: "LEFT",
      speakerName: 인물이름, text: (칸["인트로"] || "").trim()}]}]}}],
    lorebooks: [],
    interactionCount: 0,
    지은자리: 자리,
    지은것: true
  };
}

/* 걸린 시간을 보인다.
   회원님 : 「맨날 넌 구글키가 느리지 않다고 하는데, 내가 앱에서 쓰면 느리다.」
   그래서 **앱이 실제로 겪은 시간**을 남겨 보여 드린다 */
function 시간판그리기(){
  const 판 = $("#시간판");
  if (!판) return;
  let 목 = [];
  try { 목 = JSON.parse(localStorage.getItem("시간") || "[]"); } catch(_){}
  if (!목.length){ 판.textContent = "아직 없습니다."; return; }
  const 뒤 = 목.slice(-12).reverse();
  const 값들 = 목.map(x => x.걸림).sort((a, b) => a - b);
  /* ★ 260910 회원님 :
       「월/일 시:분  [방이름 4글자]  or google/gemini~  3.1초  368자
        형태로 출력하되, 글씨가 더 작아져도 좋으니 한줄에 로그 하나씩 찍히도록 해라.」 */
  const 두자리 = n => (n < 10 ? "0" : "") + n;
  const 때글 = t => {
    if (!t) return "  ─  ";
    const d = new Date(t);
    return 두자리(d.getMonth() + 1) + "/" + 두자리(d.getDate()) + " " +
           두자리(d.getHours()) + ":" + 두자리(d.getMinutes());
  };
  const 줄들 = 뒤.map(x =>
    안전(때글(x.때)) + "  [" + 안전(String(x.방 || "").slice(0, 4)) + "]  " +
    안전(x.업체) + " " + 안전(String(x.모델).slice(0, 22)) + "  " +
    x.걸림 + "초  " + x.자수 + "자");
  판.innerHTML =
    '가장 빠름 ' + 값들[0] + '초 · 가운데 ' + 값들[Math.floor(값들.length / 2)] +
    '초 · 가장 느림 ' + 값들[값들.length - 1] + '초  (' + 목.length + '번)' +
    '<div style="margin-top:10px;font-size:11px;line-height:1.9;' +
      'white-space:pre;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace">' +
      줄들.join("<br>") + '</div>';
}

/* ══ 뒤로 가기 ══

   ★ 260910 회원님 : 「취소 누르면 브라우저 꺼짐 말고 뒤로 가거나, 홈까지 돌아가게끔 바꿔.」

   폰에서 뒤로(취소)를 누르면 앱이 그냥 닫혔다. 앱이 자리를 안 쌓아 두었기 때문이다.
   이제 한 단계씩 물러난다 — 시트 → 방·플롯 → 홈. 홈에서 한 번 더 누르면 그때 나간다 */
function 뒤로가기(){
  if (시트열렸나()){ 시트닫기(); return true; }
  if (S.방 || S.플롯){ S.방 = null; S.플롯 = null; 그리기(); return true; }
  if (S.화면 !== "홈"){ S.화면 = "홈"; 그리기(); return true; }
  return false;                       /* 더 갈 데가 없다 */
}
function 자리쌓기(){ try { history.pushState({앱: 1}, ""); } catch(_){} }

/* ★ 260910 회원님 : 「가끔 다른 곳을 보고 돌아오면 그 페이지가 과거 데이터일 때가 있다.」

   창을 두고 다른 데를 보다 오면 브라우저가 화면을 얼려 둔 채 되살린다(bfcache).
   그 사이 다른 탭에서 담은 것도 안 보인다. 돌아올 때 **담긴 것을 다시 읽고 그린다** */
function 되살리기(){
  try {
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    for (const k of Object.keys(새도막)){
      const 담긴 = 새도막[k] || [];
      const 이미 = (D.도막[k] || []).length;
      if (담긴.length > 이미 - (기본도막수[k] || 0)) {
        D.도막[k] = (D.도막[k] || []).slice(0, 기본도막수[k] || 0).concat(담긴);
      }
    }
    for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
  } catch(_){}
  /* 방 안이면 그 방이 아직 있는지 보고 다시 그린다 */
  if (S.방){ const 있 = D.방.find(x => x.id === S.방.id); if (있) S.방 = 있; }
  그리기();
}

/* 어느 화면을 그리고 있었나 — 화면이 바뀌면 스크롤을 맨 위로 되돌린다 */
let 앞화면 = "";
function 그리기(){
  머리그리기(); 발그리기();
  /* ★ 260910 회원님 : 「돌아왔다가 또다른 곳을 보면, 스크롤이 아래로 내려간 채로
     시작되어 마치 오류인 것처럼 인지될 때가 있다.」
     #몸 은 하나를 돌려 쓰므로 앞 화면의 스크롤이 남는다. 자리가 바뀌면 되돌린다 */
  const 이번 = (S.방 ? "방:" + S.방.id : S.플롯 ? "플롯:" + S.플롯.id : "화면:" + S.화면);
  if (이번 !== 앞화면){
    앞화면 = 이번;
    const 판 = $("#몸");
    if (판 && !S.방) 판.scrollTop = 0;      /* 방은 아래(최신)로 가야 하니 건드리지 않는다 */
  }
  /* ★ 260911 회원님 : 「최상위 메뉴(홈/대화/만들기/마이페이지)는
     좌상단 < 버튼 필요없다.」
     탭 넷은 아래 바로 오가므로 뒤로 갈 데가 없다. 방·플롯에서만 띄운다 */
  const 떠 = $("#뒤로떠");
  if (떠) 떠.classList.toggle("보임", !!(S.방 || S.플롯));
  $('#입력자리').innerHTML = '';
  if (S.방) return 방그리기();
  if (S.플롯) return 플롯그리기();
  if (S.화면 === '홈') return 홈그리기();
  if (S.화면 === '대화') return 대화그리기();
  if (S.화면 === '만들기') return 만들기그리기();
  return 나그리기();
}

document.addEventListener('click', e => {
  if (시트열렸나() && !e.target.closest('#시트') && !e.target.closest('#덮개')) return;
  const 발단추 = e.target.closest('#발 button[data-화면]');
  if (발단추){ S.화면 = 발단추.dataset.화면; S.방 = null; S.플롯 = null; return 그리기(); }

  const 가 = e.target.closest('[data-가]');
  if (가){
    const 무엇 = 가.dataset.가;
    if (무엇 === '뒤로'){ 뒤로가기(); return; }
    if (무엇 === '모델'){ return 모델열기(); }
    if (무엇 === '방메뉴'){ return 방메뉴열기(); }
    /* ★ 260910 회원님 : 「신고버튼 살려서 기록 남기게 해.」 — 메모장이다 */
    if (무엇 === '신고'){ return 메모열기(); }
    if (무엇 === '편집'){ return 마지막도막(m => 편집열기(m)); }
    if (무엇 === '주문'){ return 주문열기(); }
    if (무엇 === '재실행'){ return 재실행(); }
    if (무엇 === '별표'){ return 별표넣기(); }
    if (무엇 === '시작'){ return 새대화(S.플롯); }
    if (무엇 === '자동생성'){ return 자동생성(); }
    if (무엇 === '수동생성'){ return 플롯편집(null); }
    if (무엇 === '플롯편집'){ return 플롯편집(S.플롯 || null); }
    if (무엇 === '플롯보기'){
      const p = 지금플롯();
      if (p){ S.플롯 = p; S.방 = null; 그리기(); }
      return;
    }
    /* ★ 260910 회원님 : 「각 플롯의 대화 시작하기 버튼 왼쪽이 뭔지 모르겠다.
       눌러도 아무 기능 안한다.」 — 스크랩(찜)이다. 대화 목록 맨 위에 모인다 */
    if (무엇 === '스크랩'){
      const p = S.플롯; if (!p) return;
      스크랩뒤집기(p.id);
      그리기(); 알림(스크랩인가(p.id) ? "스크랩했습니다" : "스크랩에서 뺐습니다");
      return;
    }
  }

  /* ⋯ 를 누르면 방을 열지 않고 메뉴를 띄운다 */
  const 방더 = e.target.closest("[data-방메뉴]");
  if (방더){
    const 방 = D.방.find(r => r.id === 방더.dataset.방메뉴);
    if (방) 목록방메뉴(방);
    return;
  }
  const 방줄 = e.target.closest('[data-방]');
  if (방줄){
    S.방 = D.방.find(r => r.id === 방줄.dataset.방);
    S.플롯 = null; return 그리기();
  }
  const 플롯줄 = e.target.closest('[data-플롯]');
  if (플롯줄){
    S.플롯 = [...D.플롯, ...D.인기].find(p => p.id === 플롯줄.dataset.플롯);
    S.방 = null; return 그리기();
  }
});

document.addEventListener("click", async e => {
  if (e.target.id === "덮개") return 시트닫기();
  const 줄 = e.target.closest("[data-시트]");
  if (!줄) return;
  const 가 = 줄.dataset.시트;
  const 값 = 줄.dataset.값;
  if (가 === "닫기") return 시트닫기();
  if (가 === "편집"){ 시트닫기(); return 편집열기(Number(값)); }
  if (가 === "편집저장") return 편집저장(Number(값));
  if (가 === "재실행"){ 시트닫기(); return 재실행(Number(값)); }
  if (가 === "주문"){ 시트닫기(); return 주문열기(Number(값)); }
  if (가 === "주문보내기"){
    const t = $("#주문칸"); const 주문 = t ? t.value.trim() : "";
    시트닫기(); return 재실행(값 === "" ? undefined : Number(값), 주문);
  }
  if (가 === "복사"){
    const m = (D.도막[S.방.id] || [])[Number(값)];
    if (m) 글복사(도막글꺼내기(m));
    return 시트닫기();
  }
  if (가 === "지우기") return 여기부터지우기(Number(값));
  if (가 === "새로하기") return 새로하기();
  if (가 === "이어하기"){ return 이어하기열기(); }
  if (가 === "이어열기"){ 시트닫기(); return 이어열기(값); }
  /* ★ 260910 회원님 : 「대화 프로필 누르면 나오는 것은 user 프로필 수정을
     가능케 해야된다. 해당 프로필 입력값으로 대화에 계속 적용되는 것이다.」 */
  if (가 === "대화프로필"){ return 프로필열기(); }
  if (가 === "플롯보기"){ 시트닫기(); const p = 지금플롯();
    if (p){ S.플롯 = p; S.방 = null; 그리기(); } return; }
  if (가 === "모델"){ return 모델열기(); }
  if (가 === "목록방열기"){
    시트닫기();
    const 방 = D.방.find(r => r.id === 값);
    if (방){ S.방 = 방; S.플롯 = null; 그리기(); }
    return;
  }
  if (가 === "목록방복사"){
    const 글 = (D.도막[값] || []).map(m =>
      ((m.sender && m.sender.type) === "BOT" ? "" : "> ") + 도막글꺼내기(m)).join(NL + NL);
    try { navigator.clipboard.writeText(글); } catch(_){}
    시트닫기(); 알림("복사했습니다"); return;
  }
  if (가 === "목록방지우기"){
    방지우기속(값);
    시트닫기(); 그리기(); 알림("지웠습니다");
    return;
  }
  if (가 === "방내보내기"){ return 방내보내기(); }
  if (가 === "다내보내기"){ return 다내보내기(); }
  if (가 === "메모"){ return 메모열기(값); }
  if (가 === "메모턴담기"){
    const t = $("#메모칸"); if (!t) return;
    const 붙일 = 지금턴글(값);
    t.value = (t.value.trim() ? t.value.trim() + NL + NL : "") + 붙일 + NL + "  · ";
    t.focus(); t.scrollTop = t.scrollHeight;
    return;
  }
  if (가 === "메모저장"){
    const t = $("#메모칸"); if (!t) return;
    메모담기(S.방.id, t.value);
    시트닫기(); 알림("메모를 담았습니다");
    return;
  }
  if (가 === "플롯편집"){
    return 플롯편집(S.플롯 || null);
  }
  if (가 === "플롯저장"){
    const 값칸 = 꼭 => { const t = $("#편_" + 꼭); return t ? t.value : ""; };
    const 제목 = 값칸("제목").trim();
    if (!제목) return 알림("제목을 넣으십시오");
    const 이름 = 값칸("이름").trim() || 제목;
    const 인트로 = 값칸("인트로");
    const 있 = 값 ? (D.플롯.find(x => x.id === 값) || null) : null;
    const p = Object.assign({}, 있 || {}, {
      id: 값 || ("만-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6)),
      name: 제목,
      shortDescription: 값칸("한줄").trim(),
      longDescription: 값칸("소개"),
      hashtags: 값칸("태그").split(",").map(x => x.trim()).filter(Boolean),
      characters: [Object.assign({}, ((있 && 있.characters) || [])[0] || {},
                    {name: 이름, description: 값칸("캐릭터")})],
      지은것: true
    });
    if (!p.imageUrl) p.imageUrl = (있 && 있.imageUrl) || "";
    if (!p.interactionCount) p.interactionCount = 0;
    /* 인트로는 앱 꼴(contents)로 담는다 — 그래야 새 대화에서 그대로 깔린다 */
    p.intros = 인트로.trim()
      ? [{conversation: {messages: [{contents: [{type: "TEXT", position: "LEFT",
          speakerName: 이름, text: 인트로.trim()}]}]}}]
      : (있 && 있.intros) || [];
    플롯고침담기(p);
    시트닫기();
    S.플롯 = p; S.방 = null; 그리기();
    알림(값 ? "고쳤습니다" : "만들었습니다");
    return;
  }
  if (가 === "프로필새로"){ return 프로필쓰기(null); }
  if (가 === "프로필고치기"){
    return 프로필쓰기(프로필들().find(x => x.id === 값) || null);
  }
  if (가 === "프로필고름"){
    if (S.방){ S.방.프로필아이디 = 값; 새것담기(); }
    else {
      const 목 = 프로필들();
      for (const p of 목) p.기본 = (p.id === 값);
      프로필담기(목);
    }
    시트닫기();
    const 것 = 프로필들().find(x => x.id === 값);
    알림("프로필 — " + ((것 && 것.이름) || 값));
    return;
  }
  if (가 === "프로필저장"){
    const 이 = ($("#프로필이름") || {}).value || "";
    const 설 = ($("#프로필설명") || {}).value || "";
    const 기 = !!($("#프로필기본") || {}).checked;
    if (!이.trim()) return 알림("이름을 넣으십시오");
    const 목 = 프로필들();
    let 것 = 목.find(x => x.id === 값);
    if (!것){ 것 = {id: "프-" + Date.now().toString(36)}; 목.push(것); }
    것.이름 = 이.trim(); 것.설명 = 설;
    if (기) for (const p of 목) p.기본 = (p.id === 것.id); else 것.기본 = false;
    프로필담기(목);
    if (S.방){ S.방.프로필아이디 = 것.id; 새것담기(); }
    시트닫기(); 그리기(); 알림("담았습니다");
    return;
  }
  if (가 === "모델고름"){
    try { localStorage.setItem("모델설정", 값); } catch(_){}
    const 짝 = 모델셋.find(x => x.값 === 값);
    시트닫기();
    /* ★ 곧바로 반영한다. 방 안이면 머리만 — 다시 그리면 스크롤이 튄다 */
    if (S.방) 머리그리기(); else 그리기();
    알림("모델 — " + ((짝 && 짝.이름) || 값)); return;
  }
  if (가 === "기억"){ return 기억열기(); }
  if (가 === "지금갈무리"){
    시트닫기(); 알림("갈무리 중…");
    const 기2 = 기억읽기(S.방.id);
    기2.요약한데까지 = -1;                    /* 처음부터 다시 훑는다 */
    기억쓰기(기2);
    await 요약해두기(S.방.id);
    return 기억열기();
  }
  if (가 === "기억저장"){
    const t = $("#기억칸");
    const 기 = 기억읽기(S.방.id);
    /* 손으로 고친 것을 네 칸으로 도로 가른다 — 뭉개지 않는다 */
    const 갈 = 요약가르기(t ? t.value : "");
    if (갈.여태 || 갈.사이 || 갈.열린것.length || 갈.남길것.length){
      기.여태 = 갈.여태; 기.사이 = 갈.사이 ? [갈.사이] : [];
      기.열린것 = 갈.열린것; 기.남길것 = 갈.남길것;
    } else { 기.여태 = t ? t.value : ""; }
    기억쓰기(기); 시트닫기(); 알림("기억을 담았습니다"); return;
  }
  if (가 === "다복사"){
    const 도막 = D.도막[S.방.id] || [];
    글복사(도막.map(도막글꺼내기).join(NL + NL));
    return 시트닫기();
  }
  if (가 === "방나가기"){
    방지우기속(S.방.id);
    시트닫기(); 그리기(); 알림("나갔습니다"); return;
  }
  if (가 === "방지우기"){
    D.도막[S.방.id] = [];
    새것담기(); 시트닫기(); 방그리기(); 알림("지웠습니다"); return;
  }
});

/* 잔심부름 */
function 마지막도막(하기){
  const 도막 = D.도막[S.방.id] || [];
  if (!도막.length) return 알림("아직 아무것도 없습니다");
  하기(도막.length - 1);
}
function 글복사(글){
  try {
    navigator.clipboard.writeText(글);
    알림("복사했습니다");
  } catch(_){ 알림("복사가 안 됩니다"); }
}
function 별표넣기(){
  const 입 = $("#입력");
  if (!입) return;
  const a = 입.selectionStart, b = 입.selectionEnd;
  const v = 입.value;
  입.value = v.slice(0, a) + "*" + v.slice(a, b) + "*" + v.slice(b);
  입.focus();
  입.selectionStart = 입.selectionEnd = (a === b) ? a + 1 : b + 2;
}
function 새로하기(){
  const 방 = S.방;
  /* 지금 것을 이어하기로 담고 처음부터 */
  const 담을 = (D.도막[방.id] || []).slice();
  const 새id = "저장-" + Date.now().toString(36);
  D.도막[새id] = 담을;
  방.이어하기 = 방.이어하기 || [];
  방.이어하기.unshift({id: 새id, savedAt: new Date().toISOString(), 도막수: 담을.length});
  /* 인트로만 남긴다 */
  D.도막[방.id] = 담을.length ? [담을[0]] : [];
  새것담기(); 시트닫기(); 방그리기();
  알림("저장하고 새로 시작합니다");
}
function 이어열기(id){
  const 담긴 = D.도막[id];
  if (!담긴) return 알림("그 저장본이 없습니다");
  /* 지금 것을 먼저 담고 바꿔 끼운다 */
  const 방 = S.방;
  const 지금 = (D.도막[방.id] || []).slice();
  const 새id = "저장-" + Date.now().toString(36);
  D.도막[새id] = 지금;
  방.이어하기 = (방.이어하기 || []).filter(e => e.id !== id);
  방.이어하기.unshift({id: 새id, savedAt: new Date().toISOString(), 도막수: 지금.length});
  D.도막[방.id] = 담긴;
  새것담기(); 방그리기();
  알림("이어서 갑니다");
}

function 입력붙이기(){
  const 입 = $('#입력'), 보 = $('#보내기');
  if (!입) return;
  입.addEventListener('input', () => {
    입.style.height = 'auto';
    입.style.height = Math.min(입.scrollHeight, 110) + 'px';
  });
  /* ★ 빈 채로도 보낼 수 있으므로 단추를 잠그지 않는다 */
  보.disabled = false;
  /* ★ 260910 회원님 —
       「pc 브라우저에서 … 엔터를 치면 줄바꿈이 일어난다.
        shift 엔터로 줄바꿈되게 하고, 엔터는 발송되게 하라.」
       「제타앱에서 아무것도 치지 않아도 발송이 되어야 한다.
        이 경우, 유저의 응답 없이 상황을 계속 이어서 진행시키라는 의미이다.」 */
  const 치기 = () => {
    if (S.보낸중) return;
    const 글 = 입.value.trim();
    입.value = ''; 입.style.height = 'auto';
    /* 빈 채로 보내면 **유저 없이 이어 가라**는 뜻이다.
       빈 문자열을 그대로 보내면 모델이 헛돌므로, 그 뜻을 한 줄로 적어 보낸다 */
    말보내기(글, undefined, !글);
  };
  보.addEventListener('click', 치기);
  /* 엔터로 보내고 Shift+엔터로 줄을 바꾼다. 폰에서는 자판이 제 일을 하게 둔다 */
  입.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const 폰 = matchMedia("(pointer: coarse)").matches;
    if (폰) return;
    e.preventDefault(); 치기();
  });
}

/* ══════════════════════════════════════════════════════
   중계 — 열쇠는 앱에 없다. 중계가 들고 있다
   ══════════════════════════════════════════════════════ */
/* ★ 260910 — **매번 읽는다.**
   앱이 뜰 때 한 번만 읽으면 마이페이지에서 넣어도 새로고침 전엔 안 먹는다.
   회원님이 폰에서 넣으셨는데 안 됐다 */
/* ★ 260910 — **중계 주소와 모델을 앱에 박는다.**
   회원님 : 「중개주소 아예 박아넣고, 모델명은 … 중에 고를 수 있게 해.
            일일이 타이핑하는거 불편해.」

   ★ 열쇠는 여전히 앱에 없다. 중계가 들고 있다. 주소만 박는 것이다 */
/* ★ 260910 회원님 : 「완성되어 빌드를 내보내게 된다면
   마이페이지에 빌드넘버와 일자와 시간을 적어서 내보낸다.」

const 빌드 = {번호: "v1.1.4", 때: "2026-09-11 00:17"};

const 빈기억 = id => ({방: id, 여태: "", 사이: [], 열린것: [], 남길것: [],
                       요약한데까지: -1, 고친때: 0});

function 기억읽기(방아이디){
  try {
    const j = JSON.parse(localStorage.getItem("기억_" + 방아이디) || "null");
    return j || 빈기억(방아이디);
  } catch(_){ return 빈기억(방아이디); }
}
function 기억쓰기(기억){
  기억.고친때 = Date.now();
  try { localStorage.setItem("기억_" + 기억.방, JSON.stringify(기억)); } catch(_){}
}

/* 기억을 모델이 읽을 글로. **모델이 쓴 것을 손대지 않고 잇는다** */
function 기억글(기억){
  if (!기억) return "";
  const 판 = [];
  if (기억.여태) 판.push(기억.여태);
  const 사이 = (기억.사이 || []).filter(x => String(x || "").trim());
  if (사이.length) 판.push("[사이]" + NL + 사이.join(NL + NL));
  const 열린 = (기억.열린것 || []).filter(x => String(x || "").trim());
  if (열린.length) 판.push("[아직 답이 안 난 것]" + NL + 열린.map(x => "- " + x).join(NL));
  const 남길 = (기억.남길것 || []).filter(x => String(x || "").trim());
  if (남길.length) 판.push("[꼭 남길 것]" + NL + 남길.map(x => "- " + x).join(NL));
  return 판.join(NL + NL);
}

/* 주소 끝의 빗금을 뗀다.

function 끝빗금떼기(주소){
  let t = String(주소 || '').trim();
  while (t.length && t[t.length - 1] === '/') t = t.slice(0, -1);
  return t;
}

/* 이어가기 = true 면 회원님이 아무것도 안 치고 보낸 것이다.
   유저 도막을 만들지 않고, 모델에게 **그냥 이어 가라**고만 알린다 */
async function 말보내기(친말, 주문, 이어가기){
  const 중계 = 중계주소();

  if (S.보낸중) return;
  S.보낸중 = true;

  const 방 = S.방;
  const 플롯 = D.플롯.find(x => x.id === 방.플롯아이디) || {};
  const 기억 = 기억읽기(방.id);
  const 도막 = D.도막[방.id] || [];

  /* 내가 친 말을 먼저 화면에 놓는다 — 기다리는 동안 빈 화면이면 답답하다.
     ★ 빈 채로 보냈으면(이어가기) 유저 도막을 만들지 않는다. 화면에 빈 말풍선이 뜨면 안 된다 */
  if (!이어가기){
    도막.push({sender: {type: "USER"}, contents: [{type: "TEXT", position: "RIGHT", text: 친말}],
               messageTime: new Date().toISOString()});
  }
  방그리기();

  /* 재료만 보낸다. 프롬프트는 중계가 짠다 */
  /* **이 방에서 본보기를 뽑는다.**

     ★ 260910 — 방마다 결이 크게 다르다. 제타 실측으로 한 묶음이 44자~257자,
       여섯 배까지 벌어진다. 중계에 박아 둔 본보기는 여러 방에서 뽑은 것이라
       그 방과 어긋날 수 있고, 그러면 앞 도막이 가르치는 것과 서로 부딪힌다.

     그래서 **그 방의 앞부분**에서 (친 말, 답) 쌍을 골라 보낸다.
     ★ 최근 것은 안 쓴다 — 그건 이미 도막으로 들어가므로 겹친다.
     ★ 자동생성한 새 플롯처럼 도막이 적으면 안 보낸다. 중계 것이 쓰인다 */
  function 방본보기(방, 몇){
    const 다 = 도막.slice(0, Math.max(0, 도막.length - 24));
    const 것 = [];
    for (let i = 1; i < 다.length; i++){
      const 앞 = 다[i - 1], 이 = 다[i];
      if (((앞.sender && 앞.sender.type) === "BOT")) continue;
      if (((이.sender && 이.sender.type) !== "BOT")) continue;
      const 준 = (앞.contents || []).filter(c => c.type === "TEXT")
        .map(c => c.text).join(NL).trim();
      const 답 = 보낼글(이).trim();
      /* ★ 260910 — **거르는 조건이 그 방 결을 왜곡한다.**

         심다은 방 실측 —
           그 방 전체    묶음 43자 · 40자↓ 49% · 한 턴의 묶음 7
           걸러낸 뒤     묶음 71자 · 40자↓ 27% · 한 턴의 묶음 5
           뽑은 본보기   묶음 80자 · 40자↓ 20% · 한 턴의 묶음 5

         짧은 답을 버리면 **잘게 끊는 결**이 통째로 빠진다.
         그래서 거르는 것은 **쓸 수 없는 것만** — 빈 것과 터무니없이 긴 것 */
      if (준.length < 2 || 준.length > 150) continue;
      if (답.length < 20 || 답.length > 2000) continue;
      것.push({준, 답});
    }
    if (것.length < 3) return null;
    /* 고루 퍼지게 집는다 — 앞쪽만 쓰면 그 대목 결만 배운다.

       ★ 260910 — 길이로 줄 세워 집는 것도 해 봤으나 판 흔들림에 묻혔다
         (짧은묶음 38.0% ↔ 15.2%). 회원님 —
         「세차례 수정해도 안잡히는건 그 안에서 최선의 선택을 한 뒤에 넘어가라.
          수치로만 줄이려고 하면 끝이 없다.」
         그래서 실측이 가장 좋았던 **시간 순 고루 집기**로 둔다.
         ★ 앱과 잣대(zt_여러턴.js)가 **같은 법**이어야 한다 */
    /* ★ 260910 — **이어 쓰는 자리 가까이에서 집는다.**

       방 안에서도 앞뒤가 다르다 (심다은 방 실측) —
         앞부분  묶음 71자 · 40자↓ 26% · 한 턴의 묶음 5
         뒷부분  묶음 31자 · 40자↓ 60% · 한 턴의 묶음 8

       우리는 **뒷부분에서 이어 쓰는데 본보기는 앞부분에서 뽑고** 있었다.
       그래서 뒤쪽 절반에서 고루 집는다 */
    const 뒤쪽 = 것.slice(Math.floor(것.length / 2));
    const 밑감 = 뒤쪽.length >= 몇 ? 뒤쪽 : 것;
    const 낸것 = [];
    const 걸음 = 밑감.length / 몇;
    for (let k = 0; k < 몇; k++) 낸것.push(밑감[Math.floor(k * 걸음)]);
    return 낸것;
  }

  /* 도막 하나를 이름줄이 붙은 글로. 화면에 그리는 것과 같은 얼개다 */
  function 보낼글(m){
    const 조각 = (m.contents || []).filter(c => c.type === "TEXT" && c.text);
    const 낸것 = []; let 앞 = null;
    for (const c of 조각){
      const 이름 = c.position === "NARRATOR" ? "내레이터" : (c.speakerName || "");
      if (이름 && 이름 !== 앞){ 낸것.push((낸것.length ? NL : "") + 이름); 앞 = 이름; }
      낸것.push(c.text);
    }
    return 낸것.join(NL);
  }

  const 재료 = {
    모델: 고른모델().모델 || undefined,
    인물: (플롯.characters || [])[0] || {name: 방.제목},
    /* ★ 회원님이 적으신 대화 프로필이 매 턴 「나」로 들어간다 */
    나: (() => { const p = 방프로필(방, 플롯);
                 return {name: p.이름, description: p.설명 || ""}; })(),
    소개: 플롯.longDescription || 플롯.shortDescription || "",
    설정집: (플롯.lorebooks || []).map(l => l.description).join(NL).slice(0, 4000),
    기억: 기억글(기억),
    /* 최근 것만 보낸다. 앞엣것은 **기억**이 든다 — 그것이 장기기억의 값이다 */
    /* ★ 260910 — **이름줄을 붙여 싣는다.**
       전에는 글자만 이어 붙여 보냈다. 그러면 누가 말했는지가 사라져서
       모델이 앞 대화에서 묶음도 내레이터도 못 배운다. 되먹임이 본보기를 이긴다.
       실측 — 한 묶음이 259자로 뭉쳤다. 제타는 68자다 */
    도막들: 도막.slice(-24).map(m => ({
      봇: ((m.sender && m.sender.type) === "BOT"),
      글: 보낼글(m)
    })),
    /* ★ 그 방에서 뽑은 본보기. 없으면 중계에 박힌 것이 쓰인다 */
    본보기: 방본보기(방, 14) || undefined,
    /* ★ 아무것도 안 치고 보내면 **이어 가라**는 뜻이다 (260910 회원님).
       빈 문자열을 그대로 보내면 모델이 헛도므로 그 뜻을 한 줄로 적는다.
       ★ 「무엇을 하라」고 박지 않는다 — 방향만 준다 (G2) */
    친말: 주문 ? (친말 + NL + NL + "[이렇게 다시 써라 — " + 주문 + "]")
          : (이어가기 ? "[나는 아직 아무 말도 하지 않았다. 장면을 이어 가라.]" : 친말)
  };

  const 잰것 = {보냄: Date.now()};
  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/turn", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify(재료)
    });
    잰것.첫글자 = Date.now();
    const j = await r.json();
    잰것.다받음 = Date.now();

    if (!r.ok){ 알림((j.error && j.error.message) || ("탈 " + r.status)); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    if (!글){ 알림("빈 답이 왔습니다"); S.보낸중 = false; return; }

    도막.push(답을도막으로(글, 유저이름(방)));
    D.도막[방.id] = 도막;
    새것담기();
    방그리기();

    /* 시간을 남긴다 — 나중에 회원님께 숫자로 보여 드린다 */
    const 걸림 = ((잰것.다받음 - 잰것.보냄) / 1000).toFixed(1);
    const 중계잰것 = r.headers.get("X-Ttfb");
    시간남기기({때: Date.now(), 걸림: Number(걸림), 중계: Number(중계잰것 || 0),
                업체: 어디, 모델: 재료.모델 || "(기본)", 자수: 글.length,
                방: (방 && 방.제목) || "", 때: Date.now()});
    알림(걸림 + "초");
    /* ★ 답을 받은 뒤에 조용히 돌린다. 대화를 안 막는다 */
    요약해두기(방.id);
  } catch (e){
    알림("못 보냈습니다 — " + String(e.message).slice(0, 40));
  }
  S.보낸중 = false;
}

/* ══════════════════════════════════════════════════════
   요약기 — **장기기억을 저절로 채운다. 제타에 없는 것**

   ★ 몇 턴에 한 번만 돈다. 매 턴 돌면 값이 두 배가 된다.
     옛 프로젝트 실측 — 한 바퀴에 한 번 돌면 부름이 안 는다 ($0.0007).

   ★ **어느 칸에 넣을지 · 언제 지울지는 모델이 정한다.** 앱은 나르기만 한다.
     회원님 : 「앱은 정말 0 or 1 정도의 기능밖에 못하며, 그런 용도로만 써야한다」
   ══════════════════════════════════════════════════════ */
const 요약주기 = 6;          /* 여섯 턴에 한 번 */

async function 요약해두기(방아이디){
  const 중계 = 중계주소();
  if (!중계) return;
  const 기 = 기억읽기(방아이디);
  const 도막 = D.도막[방아이디] || [];
  const 여기까지 = 도막.length;
  const 아직 = 여기까지 - (기.요약한데까지 < 0 ? 0 : 기.요약한데까지);
  if (아직 < 요약주기 * 2) return;              /* 아직 모자라다 */

  /* 요약할 토막 — 지난번 이후 것만 */
  const 밑 = 기.요약한데까지 < 0 ? 0 : 기.요약한데까지;
  const 새것 = 도막.slice(밑).map(m =>
    (m.contents || []).filter(c => c.type === "TEXT")
      .map(c => (c.speakerName ? c.speakerName + ": " : "") + c.text).join(NL)).join(NL + NL);
  if (!새것.trim()) return;

  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/summary", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({
        모델: 고른모델().모델 || undefined,
        여태: 기.여태, 사이: (기.사이 || []).join(NL),
        열린것: (기.열린것 || []).join(NL), 남길것: (기.남길것 || []).join(NL),
        새것
      })
    });
    const j = await r.json();
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    if (!글) return;
    const 갈린것 = 요약가르기(글);
    기.여태 = 갈린것.여태 || 기.여태;
    기.사이 = 갈린것.사이 ? [갈린것.사이] : 기.사이;
    기.열린것 = 갈린것.열린것;
    기.남길것 = 갈린것.남길것;
    기.요약한데까지 = 여기까지;
    기억쓰기(기);
    알림("기억을 갈무리했습니다");
  } catch(_){ /* 조용히 넘어간다 — 대화를 막으면 안 된다 */ }
}

/* 요약을 네 칸으로 가른다.
   ★ 정규식을 안 쓴다 (G6) */
function 요약가르기(글){
  const 낸것 = {여태: "", 사이: "", 열린것: [], 남길것: []};
  let 지금 = null;
  for (const 줄 of String(글).split(NL)){
    const t = 줄.trim();
    if (t === "[여태]"){ 지금 = "여태"; continue; }
    if (t === "[사이]"){ 지금 = "사이"; continue; }
    if (t === "[열린것]"){ 지금 = "열린것"; continue; }
    if (t === "[남길것]"){ 지금 = "남길것"; continue; }
    if (!지금 || !t || t === "…") continue;
    if (지금 === "여태" || 지금 === "사이")
      낸것[지금] = (낸것[지금] ? 낸것[지금] + NL : "") + t;
    else {
      const x = (t.indexOf("- ") === 0) ? t.slice(2).trim() : t;
      if (x && x !== "…") 낸것[지금].push(x);
    }
  }
  return 낸것;
}

/* 모델이 낸 글을 화면이 그릴 꼴로 바꾼다.
   제타 꼴 — 이름 한 줄 · 그 아래 지문과 대사. 빈 줄로 조각을 나눈다 */
/* 답을 도막으로 가른다.

   ★ 260910 — 전에는 **빈 줄로만** 잘랐다. 그러면 이름줄 뒤에 빈 줄이 오는 답에서
     이름이 이름으로 안 잡히고 **본문으로 그려졌다** —
       수빈
       (빈 줄)
       *남자친구. 있었냐고.*
     화면에 「수빈」이라는 말풍선이 따로 떴다.

   이제 **이름줄을 만나면** 자리를 바꾸고, 이름줄이 없는 덩이는 **앞 이름을 이어받는다.**
   제타 원본이 그렇게 생겼다 (contents 여럿 · speakerName 이 같으면 한 묶음으로 그린다) */
/* **이 방에서 회원님(유저)의 이름.**
   플롯의 대화 프로필에서, 없으면 그 방 도막의 RIGHT 조각에서 찾는다 */
function 유저이름(방){
  const 것 = [];
  const 플 = (D.플롯 || []).find(x => x && 방 && x.id === 방.플롯아이디);
  for (const p of ((플 && 플.chatProfiles) || [])) if (p && p.name) 것.push(p.name);
  for (const m of ((D.도막 || {})[(방 && 방.id)] || []))
    for (const c of (m.contents || []))
      if (c.position === "RIGHT" && c.speakerName && 것.indexOf(c.speakerName) < 0)
        것.push(c.speakerName);
  return 것.filter(x => x && x !== "나");
}

function 이름줄인가(t){
  if (!t || t.length > 14) return false;
  for (const c of [".", ",", "!", "?", "…", String.fromCharCode(34), "*", ">", "("])
    if (t.indexOf(c) >= 0) return false;
  return true;
}
function 답을도막으로(글, 유저들){
  const 조각 = [];
  let 이름 = "";
  for (const 덩이 of String(글).split(NL + NL)){
    let 줄 = 덩이.split(NL).map(x => x.trim()).filter(Boolean);
    if (!줄.length) continue;
    /* 이름줄로 시작하면 자리를 바꾼다. 그 줄만 있어도 마찬가지다 */
    while (줄.length && 이름줄인가(줄[0])){ 이름 = 줄[0]; 줄 = 줄.slice(1); }
    if (!줄.length) continue;        /* 이름만 있던 덩이 — 다음 덩이가 그 이름을 쓴다 */
    /* ★ 260910 【축 B】 — **{{user}} 이름줄은 내레이터로 받는다.**

       회원님이 당신 인물을 3인칭으로 서술하고 반응을 비워 두시면
       (「*준은 자신의 손에 묻은 액체를 보며 물음표를 띄우고 있었다.*」)
       모델이 그 빈칸을 「준」 이름줄로 채웠다. 실측 3.7%, 제타는 0.0% 다.

       제타는 같은 자리에서 **내레이터로 받는다** —
         내레이터
         *준은 자기 손바닥을 내려다보고 있었다.*
         *축축했다.*

       내용은 비슷한데 **꼴만 달랐다.** 그래서 그리는 자리에서 바로잡는다.
       회원님이 안 하신 말이 회원님 인물의 말풍선으로 뜨면 밀당이 깨진다 */
    const 유저인가 = 이름 && (유저들 || []).indexOf(이름) >= 0;
    조각.push({type: "TEXT",
               position: (이름 === "내레이터" || 유저인가) ? "NARRATOR" : "LEFT",
               speakerName: 유저인가 ? "내레이터" : 이름, text: 줄.join(NL)});
  }
  return {sender: {type: "BOT"}, contents: 조각, messageTime: new Date().toISOString()};
}

/* 시간 기록 — 회원님께 「느리다」를 숫자로 답하기 위한 것 */
function 시간남기기(한줄){
  try {
    const 목 = JSON.parse(localStorage.getItem("시간") || "[]");
    목.push(한줄);

/* ── 말풍선 메뉴 ── */

  if (!m) return;
  const 봇 = ((m.sender && m.sender.type) === "BOT");

    시트줄("⧉", "글 복사", "복사", {값: 몇}) +

/* 도막을 글로 (편집·복사에 쓴다) */

function 편집저장(몇){
  const t = $("#편집칸");
  if (!t) return;
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];

  const 봇 = ((m.sender && m.sender.type) === "BOT");
  도막[몇] = 봇 ? 답을도막으로(t.value, 유저이름(S.방))
                : {sender: {type: "USER"},
                   contents: [{type: "TEXT", position: "RIGHT", text: t.value}],
                   messageTime: m.messageTime};
  D.도막[S.방.id] = 도막;
  새것담기(); 시트닫기(); 방그리기();
  알림("고쳤습니다");
}

/* ── 다시 쓰게 하기 ── */
async function 재실행(몇, 주문){
  const 도막 = D.도막[S.방.id] || [];
  /* 마지막 봇 도막을 걷어내고, 그 앞의 내 말로 다시 친다 */
  let i = 몇 === undefined ? 도막.length - 1 : 몇;
  while (i >= 0 && ((도막[i].sender && 도막[i].sender.type) !== "BOT")) i--;
  if (i < 0) return 알림("다시 쓸 것이 없습니다");
  const 지운것 = 도막.splice(i);
  /* 그 앞의 내 말을 찾는다 */
  let j = i - 1;
  while (j >= 0 && ((도막[j].sender && 도막[j].sender.type) === "BOT")) j--;
  const 친말 = j >= 0 ? (도막[j].contents || []).filter(c => c.type === "TEXT")
    .map(c => c.text).join(NL) : "";
  if (j >= 0) 도막.splice(j);
  D.도막[S.방.id] = 도막;
  방그리기();
  await 말보내기(친말 || "…", 주문);
}

/* **방을 통째로 지운다.**
   자료.json 에서 온 방은 파일을 못 고치므로 「지운방」에 이름을 적어 두고
   앱이 뜰 때 거른다. 그래야 새로고침해도 안 돌아온다 */
function 지운방들(){
  try { return JSON.parse(localStorage.getItem("지운방") || "[]"); } catch(_){ return []; }
}
function 방지우기속(id){
  const 목 = 지운방들();
  if (목.indexOf(id) < 0) 목.push(id);
  try { localStorage.setItem("지운방", JSON.stringify(목)); } catch(_){}
  D.방 = D.방.filter(r => r.id !== id);
  delete D.도막[id];
  try {
    localStorage.removeItem("기억_" + id);
    localStorage.removeItem("메모_" + id);
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    localStorage.setItem("새방", JSON.stringify(새방.filter(r => r.id !== id)));
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    delete 새도막[id];
    localStorage.setItem("새도막", JSON.stringify(새도막));
  } catch(_){}
  if (S.방 && S.방.id === id){ S.방 = null; S.화면 = "대화"; }
}

/* ══ 자료 들이기 ══
   제타에서 받은 것을 그대로 쓴다. 꼴을 안 고친다 */
async function 들이기(){
  try {
    const r = await fetch('./자료.json', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    D.플롯 = j.플롯 || []; D.방 = j.방 || []; D.도막 = j.도막 || {}; D.인기 = j.인기 || [];
    /* 받아 온 방의 도막 수를 적어 둔다 — 이어 친 것만 담으려고 */
    for (const r of D.방) 기본도막수[r.id] = (D.도막[r.id] || []).length;
    /* 브라우저에 담아 둔 것을 얹는다 */
    try {
      const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
      const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
      for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
      for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
      /* ★ 손으로 고친 플롯을 얹는다 — 자료.json 은 못 고치므로 따로 담아 둔다 */
      /* 지운 방은 되살리지 않는다 */
      const 지운 = 지운방들();
      if (지운.length){
        D.방 = D.방.filter(r => 지운.indexOf(r.id) < 0);
        for (const id of 지운) delete D.도막[id];
      }
      const 고침 = 플롯고침들();
      for (const id of Object.keys(고침)){
        const i = D.플롯.findIndex(x => x.id === id);
        if (i >= 0) D.플롯[i] = 고침[id]; else D.플롯.unshift(고침[id]);
      }
      for (const k of Object.keys(새도막)) D.도막[k] = 새도막[k];
    } catch(_){}
    알림('방 ' + D.방.length + '개 · 플롯 ' + D.플롯.length + '개');
  } catch (e){
    /* 자료가 없어도 화면은 뜬다 */
  }
  그리기();
}

그리기();
자리쌓기();      /* ★ 첫 뒤로가 먹으려면 자리를 하나 쌓아 둬야 한다 */
들이기();
</script>
