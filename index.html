/* ★ 260911 — **구글로 직접 플롯을 짓는다.**
   물음은 중계(/plotprompt)가 짜서 돌려준다. 앱에 한 벌 더 두면 한쪽이 낡는다.
   부르는 것만 앱이 한다 — 앱은 회원님 기기에서 도니 한국에서 나간다. */
async function 구글플롯직접(){
  const 열 = 설정("구글키");
  if (!열){
    알림("마이페이지에서 구글 키를 넣어 주십시오");
    S.보낸중 = false; return;
  }
  const 중계 = 중계주소();
  try {
    const p = await fetch(중계 + "/plotprompt", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({})
    });
    if (!p.ok){ 알림("물음을 못 받았습니다 (" + p.status + ")"); S.보낸중 = false; return; }
    const {messages, 자리} = await p.json();

    const r = await fetch(구글주소, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + 열},
      body: JSON.stringify({
        model: 고른모델().모델 || "gemini-3.1-flash-lite",
        messages, temperature: 1.15, max_tokens: 1600
      })
    });
    const j = await r.json();
    if (!r.ok){ 알림((j.error && j.error.message) || ("탈 " + r.status), 8000); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    const pp = 플롯가르기(글, 자리);
    if (!pp){ 알림("못 알아들었습니다"); S.보낸중 = false; return; }

    const 목 = 지은것읽기();
    목.unshift(pp);
    try { localStorage.setItem("지은플롯", JSON.stringify(목.slice(0, 60))); } catch(_){}
    D.플롯.unshift(pp);
    S.플롯 = pp; S.방 = null;
    그리기();
    알림("지었습니다 — " + ((자리 && 자리.갈래) ? 자리.갈래 : ""));
  } catch(e){ 알림("못 지었습니다 — " + String(e.message).slice(0, 30)); }
  S.보낸중 = false;
}

/* ★ 260912 회원님 : 「자동생성할 때에는 **캐릭터의 성별을 (남성향/여성향을) 고르게** 하는게
   좋겠다.」 · 「기왕이면 **남성향 중심으로 먼저 완성**하고 싶다.」 — 그래서 기본이 남성향이다 */
function 향읽기(){ return 설정("향") || "남성향"; }
function 향열기(){
  const 지금 = 향읽기();
  시트열기("무엇을 지을까요",
    ["남성향", "여성향"].map(x =>
      시트줄(지금 === x ? "●" : "○", x, "향고름",
        {값: x, 빛: 지금 === x ? "켬" : "",
         밑: x === "남성향" ? "내가 남자 · 상대가 여자" : "내가 여자 · 상대가 남자"})).join("") +
    시트줄("✨", "이 결로 하나 짓기", "자동생성"));
}
async function 자동생성(){
  const 중계 = 중계주소();

  if (S.보낸중) return;
  S.보낸중 = true;
  알림("짓는 중…");
  try {
    const 어디 = 고른모델().업체;
    /* ★ 260911 두 번째 고침 — **여기에 대화용 분기를 잘못 붙였다.**

       처음에 `if (어디 === "gd") return await 구글직접(재료, 잰것, 방, 도막, 이어가기);`
       를 넣었는데, **이 함수에는 그런 변수가 하나도 없다.** 자동생성은 플롯을 짓는
       함수이고 구글직접은 대화 턴을 굴리는 함수다. 붙일 자리를 잘못 골랐다.
       검사가 `or` 로 돌아 그 줄을 안 타서 못 잡았다 — **회원님이 「(무)google 직접」을
       고른 채 자동생성을 누르면 ReferenceError 로 죽었을 것이다.**

       플롯 짓는 쪽은 따로 둔다. 중계의 /plotprompt 가 물음만 돌려준다 (열쇠 안 씀). */
    if (어디 === "gd") return await 구글플롯직접();
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/plot", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({모델: 고른모델().모델 || undefined, 향: 향읽기()})
    });
    const j = await r.json();
    if (j.error){ 알림((j.error && j.error.message) || "탈"); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    const p = 플롯가르기(글, j.자리);
    if (!p){ 알림("못 알아들었습니다"); S.보낸중 = false; return; }

    const 목 = 지은것읽기();
    목.unshift(p);
    try { localStorage.setItem("지은플롯", JSON.stringify(목.slice(0, 60))); } catch(_){}
    D.플롯.unshift(p);
    /* ★ 260913 — 지은 판벌을 **특징 자리에 담는다.** 그러면 매 턴 프롬프트에 실린다.
       특징을 다시 뽑으면 덮이지만, 그때는 뽑은 것이 더 자세하니 그것이 맞다 */
    try {
      if (p.지은판 && typeof 특징담기 === "function"){
        const 것 = {};
        for (const k of Object.keys(p.지은판)) if (p.지은판[k]) 것[k] = p.지은판[k];
        const pr = (p.chatProfiles || [])[0] || {};
        if (pr.name) 것.부름 = pr.name;
        if (Object.keys(것).length) 특징담기(p.id, 것);
      }
    } catch(_){}
    S.플롯 = p; S.방 = null;
    그리기();
    알림("지었습니다 — " + (j.자리 && j.자리.갈래 ? j.자리.갈래 : ""));
  } catch (e){ 알림("못 지었습니다 — " + String(e.message).slice(0, 30)); }
  S.보낸중 = false;
}

/* 지은 글을 플롯 한 벌로 가른다.
   ★ 정규식을 안 쓴다 (G6). 칸 이름은 「이름>>」 꼴이다 */
function 플롯가르기(글, 자리){
  const 줄 = String(글).split(NL);
  const 칸 = {};
  let 지금 = null;
  for (const l of 줄){
    const t = l.trim();
    const i = t.indexOf(">>");
    /* ★ 260913 — **네 자에서 여섯 자로 늘렸다.** 「안끝나는못>>」이 다섯 자라 안 걸려서
       그 칸이 앞 칸(붙잡는것) 속으로 딸려 들어갔다. 실측으로 찾았다 */
    if (i > 0 && i <= 6){
      지금 = t.slice(0, i).trim();
      칸[지금] = t.slice(i + 2).trim();
      continue;
    }
    if (지금) 칸[지금] = (칸[지금] ? 칸[지금] + NL : "") + l;
  }
  const 이름 = (칸["이름"] || "").trim();
  if (!이름) return null;
  /* ★ 260913 — 인물 이름을 **세 곳에서** 찾는다. 캐릭터 꼴을 회원님 카드 꼴로 바꾸면서
     첫 줄이 「[성장배경] …」 이 될 수 있어 첫 줄만 보던 것이 깨졌다 */
  const 인물이름 = (() => {
    const 캐 = String(칸["캐릭터"] || "");
    /* ⓐ 「이름: 심다은」 · 「이름 : 심다은」 꼴 */
    for (const l of 캐.split(NL)){
      const t = l.trim();
      if (t.indexOf("[") === 0) continue;
      const i = t.indexOf(":");
      if (i > 0 && i <= 3 && t.slice(0, i).trim() === "이름"){
        const v = t.slice(i + 1).trim();
        if (v && v.length <= 12) return v;
      }
    }
    /* ⓑ 이름표가 아닌 첫 줄 */
    for (const l of 캐.split(NL)){
      const t = l.trim();
      if (!t || t.indexOf("[") === 0) continue;
      const v = t.split("|")[0].split("·")[0].split("(")[0].split(",")[0].trim();
      if (v && v.length <= 12) return v;
    }
    /* ⓒ 그래도 없으면 플롯 제목 */
    return 이름;
  })();
  return {
    id: "지은-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
    name: 이름,
    imageUrl: null,
    shortDescription: (칸["한줄"] || "").trim(),
    longDescription: (칸["소개"] || "").trim(),
    hashtags: (칸["태그"] || "").split(",").map(x => x.trim().split("#").join("")).filter(Boolean),
    characters: [{name: 인물이름, description: (칸["캐릭터"] || "").trim(), imageUrl: null}],
    /* ★★★ 260913 — **유저 이름과 설명을 담는다.** 여태 `[]` 로 버리고 있었다.
       이름이 없으면 앱이 유저를 「나」로 부르고 모델이 지문을 1인칭으로 쓴다 (실측) */
    chatProfiles: [{name: (칸["유저이름"] || "").trim().split(NL)[0].slice(0, 12),
                    summary: "",
                    description: (칸["유저설명"] || "").trim()}],
    intros: [{conversation: {messages: [{contents: [{type: "TEXT", position: "LEFT",
      speakerName: 인물이름, text: (칸["인트로"] || "").trim()}]}]}}],
    lorebooks: [],
    interactionCount: 0,
    /* ★ 260913 — 자동생성이 낸 **판벌 다섯 칸과 본보기**를 담는다.
       여태 받고도 버렸다. 판벌은 `특징.js` 판벌과 짝이라 특징 자리에 들어가 프롬프트에 실린다 */
    지은판: {붙잡는것: (칸["붙잡는것"] || "").trim(),
             안끝나는못: (칸["안끝나는못"] || "").trim(),
             오늘거리: (칸["오늘거리"] || "").trim(),
             저절로: (칸["저절로"] || "").trim(),
             쓸것: (칸["쓸것"] || "").trim()},
    지은본보기: (칸["본보기"] || "").trim(),
    지은자리: 자리,
    지은것: true
  };
}
function 나그리기(){
  const 값 = k => 안전(localStorage.getItem(k) || "");
  넣기("#몸",
    '<div class="만들기판">' +
      '<div class="칸"><h2>모델</h2>' +
        모델셋.map(x => {

      '<div class="칸"><h2>구글 키</h2>' +
        '<div class="글" style="margin-bottom:8px;color:var(--흐림2)">' +

        설정칸("구글키", "AIza… (없으면 비움)", 값("구글키")) +
      '</div>' +
      /* ★ 260910 회원님 : 「실제 제타처럼, 나도 내 프로필을 관리할 수 있는 창을 구현하라.」 */
      '<div class="칸"><h2>내 프로필</h2>' +
        (프로필들().length
          ? 프로필들().map(x => 시트줄(x.기본 ? "●" : "○", x.이름, "프로필고치기",
              {값: x.id, 밑: (x.설명 || "(설명 없음)").slice(0, 44) +
                            (x.기본 ? "   · 기본" : ""),
               빛: x.기본 ? "켬" : ""})).join("")
          : '<div class="글" style="color:var(--흐림);margin-bottom:8px">' +
            '아직 없습니다. 대화를 시작하면 만들 수 있습니다.</div>') +
        시트줄("＋", "대화 프로필 추가", "프로필새로") +
      '</div>' +
      /* ★ 260913 — **설정집.** 회원님 지시 : 설정집 생성 · 플롯 연결 · 대화방 연결 */
      '<div class="칸"><h2>설정집</h2>' +
        '<div class="글" style="margin-bottom:8px;color:var(--흐림2)">' +
          '열쇠말이 그 자리에 나온 항목만 실립니다 (제타 로어북과 같은 방식).<br>' +
          '한 턴에 <b>' + 쉼표수(설정집한도()) + '자</b>까지 갑니다. ' +

        (설정집들().length
          ? 설정집들().map(b => {
              const 늘 = 설정집늘셈(b);
              return 시트줄("📖", b.제목 || "(제목 없음)", "설정집",

               {밑: "데타 설정집 · 전부 꾸러미 · 제타 플롯 JSON 을 다 받습니다"}) +
        시트줄("⚖", "한 턴 한도 — " + 쉼표수(설정집한도()) + "자", "설정집한도열기",
               {밑: "작게 두면 보내는 양이 줄어듭니다"}) +
      '</div>' +

      '<div class="칸"><h2>내보내기</h2>' +
        '<div class="글" style="margin-bottom:8px;color:var(--흐림2)">' +
          '바꾸거나 쌓은 것을 통째로 냅니다 — 프로필 · 스크랩 · 지은 플롯 ·' +
          ' 고친 플롯 · 새 방 · 기억 · 메모 · <b>특징(내가 고친 것 포함)</b> · 걸린 시간.<br>' +
          '열쇠와 초대 코드는 담기지 않습니다.</div>' +

      '</div>' +
      /* ★ 260913 회원님 : 「우리 모델은 수발신 토큰수가 높으면 안되니까
         **제한을 두고 명시**해주는게 좋겠다.」 — 그림은 장당 값이 드니 여기에 적어 둔다 */
      '<div class="칸"><h2>그림</h2>' +
        '<div class="글" style="color:var(--흐림2);line-height:1.8">' +
          '열쇠는 앱에 없습니다. 중계가 들고 있습니다 (venice.ai).<br>' +
          '오늘 쓴 것 <b>' + 그림셈() + '/' + 그림하루한도 + '장</b> · ' +
          '남겨 둔 실물 <b>' + Object.keys(그림창고()).length + '/' + 그림창고한도 + '장</b><br>' +
          '한 장에 보내는 글은 ' + 그림보낼자 + '자까지입니다. 사람 이름과 나이는 뺍니다.' +
        '</div>' +
        시트줄("🗑", "담아 둔 그림 비우기", "그림비우기",
               {밑: "도막은 남고 그림 실물만 지워집니다"}) +
      '</div>' +
      '<div class="칸"><h2>걸린 시간</h2><div class="글" id="시간판"></div></div>' +
      '<div class="칸"><h2>이 판</h2><div class="글" style="color:var(--흐림2)">' +
        '빌드 ' + 안전(빌드.번호) +
        (빌드.때 ? '<br>' + 안전(빌드.때)
                 : '<br><span style="color:var(--흐림)">아직 굽지 않은 판입니다</span>') +
      '</div></div>' +
    '</div>');
  시간판그리기();
}
const 설정칸 = (키, 안내, 값) =>
  '<input class="설정" data-키="' + 키 + '" placeholder="' + 안내 + '" value="' + 값 + '" ' +
  'style="width:100%;background:var(--바탕2);border-radius:10px;padding:10px 12px;' +
  'margin-bottom:8px;font-size:16px">';

/* 걸린 시간을 보인다.
   회원님 : 「맨날 넌 구글키가 느리지 않다고 하는데, 내가 앱에서 쓰면 느리다.」
   그래서 **앱이 실제로 겪은 시간**을 남겨 보여 드린다 */
function 시간판그리기(){
  const 판 = $("#시간판");
  if (!판) return;
  let 목 = [];
  try { 목 = JSON.parse(localStorage.getItem("시간") || "[]"); } catch(_){}
  if (!목.length){ 판.textContent = "아직 없습니다."; return; }
  const 뒤 = 목.slice(-12).reverse();
  const 값들 = 목.map(x => x.걸림).sort((a, b) => a - b);
  /* ★ 260910 회원님 :
       「월/일 시:분  [방이름 4글자]  or google/gemini~  3.1초  368자
        형태로 출력하되, 글씨가 더 작아져도 좋으니 한줄에 로그 하나씩 찍히도록 해라.」 */
  const 두자리 = n => (n < 10 ? "0" : "") + n;
  const 때글 = t => {
    if (!t) return "  ─  ";
    const d = new Date(t);
    return 두자리(d.getMonth() + 1) + "/" + 두자리(d.getDate()) + " " +
           두자리(d.getHours()) + ":" + 두자리(d.getMinutes());
  };
  /* ★ 260911 — 흘려받은 판은 **첫 글자까지**도 함께 찍는다. 사람이 느끼는 것은 그쪽이다 */
  const 줄들 = 뒤.map(x =>
    안전(때글(x.때)) + "  [" + 안전(String(x.방 || "").slice(0, 4)) + "]  " +
    안전(x.업체) + " " + 안전(String(x.모델).slice(0, 22)) + "  " +
    (x.첫 ? ("첫 " + x.첫 + "초 · ") : "") + x.걸림 + "초  " + x.자수 + "자" +
    (x.설정 ? "  · 설정 " + x.설정 + "자" : ""));

  판.innerHTML =
    '가장 빠름 ' + 값들[0] + '초 · 가운데 ' + 값들[Math.floor(값들.length / 2)] +
    '초 · 가장 느림 ' + 값들[값들.length - 1] + '초  (' + 목.length + '번)' +
    '<div style="margin-top:10px;font-size:11px;line-height:1.9;' +
      'white-space:pre;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace">' +
      줄들.join("<br>") + '</div>';
}

/* ══ 뒤로 가기 ══

   ★ 260910 회원님 : 「취소 누르면 브라우저 꺼짐 말고 뒤로 가거나, 홈까지 돌아가게끔 바꿔.」

   폰에서 뒤로(취소)를 누르면 앱이 그냥 닫혔다. 앱이 자리를 안 쌓아 두었기 때문이다.
   이제 한 단계씩 물러난다 — 시트 → 방·플롯 → 홈. 홈에서 한 번 더 누르면 그때 나간다 */
/* ★ 260911 신고 — 「디바이스 취소버튼 뒤로가기 나가짐(채팅창열자마자누르면.
   다른창들도 체크)」
   ★ 260911 회원님 v1.2 메모 3번 — 「무조껀 상위가 아님.
   내부에서 열린 경로에서는 내부로 돌아가는 기능도 필요함.」

   전에는 **온 길이 없었다.** 「시트 → 방·플롯 → 홈」으로 무조건 한 단계씩 내렸다.
   그래서 마이페이지에서 프로필을 고치다 뒤로 가면 홈으로 떨어졌다.
   방을 열어도 자리를 안 쌓아서, 브라우저 자리가 하나뿐이면 그대로 앱 밖으로 나갔다.

   이제 **지나온 자리를 쌓아 두고 그 길로 되돌아간다.**
     온길      화면·방·플롯 을 옮길 때마다 앞 자리를 쌓는다
     시트길    시트가 시트를 덮을 때 밑에 깔린 것을 쌓는다 (시트열기 쪽)
   되돌아갈 때는 **쌓지 않는다** — `되돌리는중` 이 그것을 막는다 */
const 온길 = [];
let 지금자리 = null;
let 되돌리는중 = false;

function 자리표(){
  return S.방 ? "방:" + S.방.id : S.플롯 ? "플롯:" + S.플롯.id : "화면:" + S.화면;
}
function 자리담기(){ return {표: 자리표(), 화면: S.화면, 방: S.방, 플롯: S.플롯}; }

/* `그리기()` 가 맨 처음 부른다. 자리가 바뀌었으면 앞 자리를 쌓는다 */
function 길살피기(){
  const 이번 = 자리표();
  if (!지금자리 || 이번 === 지금자리.표){ 지금자리 = 자리담기(); return; }
  if (!되돌리는중){
    온길.push(지금자리);
    if (온길.length > 40) 온길.shift();     /* 끝없이 쌓이지 않게 */
    자리쌓기();
  }
  지금자리 = 자리담기();
}

function 뒤로가기(){
  /* ① 시트가 떠 있으면 시트에서 한 겹 */
  if (시트열렸나()){ 시트뒤로(); return true; }
  /* ② 온 길이 있으면 그 길로 */
  const 앞 = 온길.pop();
  if (앞){
    되돌리는중 = true;
    try {
      S.화면 = 앞.화면; S.플롯 = 앞.플롯;
      /* 그 사이 지워졌을 수 있다. 최신 것으로 다시 집는다 */
      S.방 = 앞.방 ? (D.방.find(x => x.id === 앞.방.id) || null) : null;
      그리기();
    } finally { 되돌리는중 = false; }
    return true;
  }
  /* ③ 길이 없으면 옛 규칙대로 한 단계 — 첫 화면이 방·플롯일 때를 위한 것이다 */
  if (S.방 || S.플롯){
    되돌리는중 = true;
    try { S.방 = null; S.플롯 = null; 그리기(); } finally { 되돌리는중 = false; }
    return true;
  }
  if (S.화면 !== "홈"){
    되돌리는중 = true;
    try { S.화면 = "홈"; 그리기(); } finally { 되돌리는중 = false; }
    return true;
  }
  return false;                       /* 더 갈 데가 없다 */
}
function 자리쌓기(){ try { history.pushState({앱: 1}, ""); } catch(_){} }
window.addEventListener("popstate", () => { if (뒤로가기()) 자리쌓기(); });

/* ★ 260910 회원님 : 「가끔 다른 곳을 보고 돌아오면 그 페이지가 과거 데이터일 때가 있다.」

   창을 두고 다른 데를 보다 오면 브라우저가 화면을 얼려 둔 채 되살린다(bfcache).
   그 사이 다른 탭에서 담은 것도 안 보인다. 돌아올 때 **담긴 것을 다시 읽고 그린다** */
function 되살리기(){
  try {
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    for (const k of Object.keys(새도막)){
      const 담긴 = 새도막[k] || [];
      const 이미 = (D.도막[k] || []).length;
      if (담긴.length > 이미 - (기본도막수[k] || 0)) {
        D.도막[k] = (D.도막[k] || []).slice(0, 기본도막수[k] || 0).concat(담긴);
      }
    }
    for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
  } catch(_){}
  /* 방 안이면 그 방이 아직 있는지 보고 다시 그린다 */
  if (S.방){ const 있 = D.방.find(x => x.id === S.방.id); if (있) S.방 = 있; }
  그리기();
}

/* 어느 화면을 그리고 있었나 — 화면이 바뀌면 스크롤을 맨 위로 되돌린다 */
let 앞화면 = "";
function 그리기(){
  길살피기();          /* ★ 260911 — 자리가 바뀌었으면 온 길에 쌓는다 */
  머리그리기(); 발그리기();
  /* ★ 260910 회원님 : 「돌아왔다가 또다른 곳을 보면, 스크롤이 아래로 내려간 채로
     시작되어 마치 오류인 것처럼 인지될 때가 있다.」
     #몸 은 하나를 돌려 쓰므로 앞 화면의 스크롤이 남는다. 자리가 바뀌면 되돌린다 */
  const 이번 = (S.방 ? "방:" + S.방.id : S.플롯 ? "플롯:" + S.플롯.id : "화면:" + S.화면);
  if (이번 !== 앞화면){
    앞화면 = 이번;
    const 판 = $("#몸");
    if (판 && !S.방) 판.scrollTop = 0;      /* 방은 아래(최신)로 가야 하니 건드리지 않는다 */
  }
  /* ★ 260911 회원님 : 「최상위 메뉴(홈/대화/만들기/마이페이지)는
     좌상단 < 버튼 필요없다.」
     탭 넷은 아래 바로 오가므로 뒤로 갈 데가 없다. 방·플롯에서만 띄운다 */
  const 떠 = $("#뒤로떠");
  if (떠) 떠.classList.toggle("보임", !!(S.방 || S.플롯));
  $('#입력자리').innerHTML = '';
  if (S.방) return 방그리기();
  if (S.플롯) return 플롯그리기();
  if (S.화면 === '홈') return 홈그리기();
  if (S.화면 === '대화') return 대화그리기();
  if (S.화면 === '만들기') return 만들기그리기();
  return 나그리기();
}

const 빈기억 = id => ({방: id, 여태: "", 사이: [], 열린것: [], 남길것: [],
                       요약한데까지: -1, 고친때: 0});

function 기억읽기(방아이디){

/* 기억을 모델이 읽을 글로. **모델이 쓴 것을 손대지 않고 잇는다** */
/* ★ 260911 — 마디를 **층으로** 싣는다.
   최근 둘은 본문까지, 그 앞은 제목만, 더 앞은 몇 개였는지만.
   첫 앱의 fmtEras() 와 같은 얼개다 (ERA_FULL 2 · ERA_TITLES 15).     */
const 마디본문 = 2;      /* 본문까지 싣는 최근 마디 수 */
const 마디제목 = 15;     /* 제목만 싣는 최대 마디 수 */
function 마디글(기억){
  const 마디 = (기억 && 기억.마디) || [];
  if (!마디.length) return String((기억 && 기억.여태) || "");
  const 판 = [];
  const 앞 = 마디.slice(0, Math.max(0, 마디.length - 마디본문));
  const 보일앞 = 앞.slice(-마디제목);
  if (앞.length > 보일앞.length)
    판.push("(그보다 앞선 " + (앞.length - 보일앞.length) + "토막은 제목도 남지 않았다)");
  for (const x of 보일앞) 판.push(x.n + ". " + x.제목);
  for (const x of 마디.slice(-마디본문)) 판.push(x.n + ". " + x.제목 + NL + "  " + x.글);
  return 판.join(NL);
}
function 기억글(기억){
  if (!기억) return "";
  const 판 = [];
  const 마 = 마디글(기억);
  if (마) 판.push(마);
  const 사이 = (기억.사이 || []).filter(x => String(x || "").trim());
  if (사이.length) 판.push("[사이]" + NL + 사이.join(NL + NL));
  const 열린 = (기억.열린것 || []).filter(x => String(x || "").trim());
  if (열린.length) 판.push("[아직 답이 안 난 것]" + NL + 열린.map(x => "- " + x).join(NL));
  const 남길 = (기억.남길것 || []).filter(x => String(x || "").trim());
  if (남길.length) 판.push("[꼭 남길 것]" + NL + 남길.map(x => "- " + x).join(NL));
  return 판.join(NL + NL);
}

/* ══════════════════════════════════════════════════════

/* 주소 끝의 빗금을 뗀다.
   ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 (G6) */
function 끝빗금떼기(주소){
  let t = String(주소 || '').trim();
  while (t.length && t[t.length - 1] === '/') t = t.slice(0, -1);
  return t;
}

/* 이어가기 = true 면 회원님이 아무것도 안 치고 보낸 것이다.
   유저 도막을 만들지 않고, 모델에게 **그냥 이어 가라**고만 알린다 */
/* ── 흘려받기 ─────────────────────────────────────────
   ★ 260911 신고 — 「채팅 흐르는 느낌 있우면 좋을듯.」

   업체들이 다 같은 꼴로 흘려보낸다 (SSE) —
     data: {"choices":[{"delta":{"content":"글"}}]}
     data: [DONE]
   빈 줄로 덩이가 갈리고, 콜론으로 시작하는 줄은 주석이다(오픈라우터가 보낸다).

   ★ **덩이가 반쪽으로 끊겨 온다.** 그물이 나누는 자리는 글자 경계와 상관없다.
     그래서 마지막 줄은 늘 남겨 두었다가 다음 덩이와 이어 붙인다.
     이걸 안 하면 한글이 깨지고 JSON 이 쪼개진다
   ★ `TextDecoder` 에 `{stream:true}` 를 주는 것도 같은 까닭이다 —
     한글 한 글자가 세 바이트라 덩이 경계에서 쪼개진다

   돌려주는 것 —
     {흘렀나:true,  글, 첫글자, 답}    흘러왔다
     {흘렀나:false, 답}                안 흘렀다 — 부른 쪽이 옛 길로 되돌아간다 */
async function 흘려받기(주소, 머리, 본문, 닿을때){
  const r = await fetch(주소, {method: "POST", headers: 머리, body: 본문});
  const 결 = String(r.headers.get("Content-Type") || "");
  if (!r.ok || 결.indexOf("event-stream") < 0 || !r.body) return {흘렀나: false, 답: r};

  const 읽개 = r.body.getReader();
  const 풀개 = new TextDecoder("utf-8");
  let 남은 = "", 글 = "", 첫글자 = 0;
  /* ★ 260911 — **왜 끝났는지를 모은다.**
     회원님이 실제로 굴리시다 겪으셨다 —
       「유저 첫 입력 후 **모델 첫 반응이 끊김.** 그래서 다시(빈값) 전송하게됨.」
     받아 둔 자료에서 봇 도막이 **19자**에서 잘려 있었다 (별표도 안 닫힘).
     그런데 앱은 그것을 **정상으로 여기고 그대로 저장**했다. 알려 주지도 않았다.
     stop 이 아니면 잘린 것이다 — length(토큰 한도) · content_filter · 그 밖 */
  let 왜끝남 = "";

  for (;;){
    const 온것 = await 읽개.read();
    if (온것.done) break;
    남은 += 풀개.decode(온것.value, {stream: true});
    const 줄들 = 남은.split(NL);
    남은 = 줄들.pop();                 /* 마지막 줄은 아직 덜 왔을 수 있다 */
    for (const 줄 of 줄들){
      const t = 줄.trim();
      if (!t || t.charAt(0) === ":") continue;         /* 빈 줄 · 주석 */
      if (t.indexOf("data:") !== 0) continue;
      const 속 = t.slice(5).trim();
      if (!속 || 속 === "[DONE]") continue;
      let j;
      try { j = JSON.parse(속); } catch(_){ continue; }
      const 고 = (j.choices || [])[0] || {};
      if (고.finish_reason) 왜끝남 = String(고.finish_reason);
      const d = 고.delta || {};
      const c = d.content;
      if (typeof c === "string" && c){
        if (!첫글자) 첫글자 = Date.now();
        글 += c;
        if (닿을때) 닿을때(글);
      }
    }
  }
  return {흘렀나: true, 글: 글, 첫글자: 첫글자, 왜끝남: 왜끝남, 답: r};
}

  function 방본보기(방, 몇){

         뒷부분  묶음 31자 · 40자↓ 60% · 한 턴의 묶음 8

       우리는 **뒷부분에서 이어 쓰는데 본보기는 앞부분에서 뽑고** 있었다.
       그래서 뒤쪽 절반에서 고루 집는다 */
    const 뒤쪽 = 것.slice(Math.floor(것.length / 2));

     그리고 이 글은 특징보다 모델에게 **가까이** 놓인다. 가까운 쪽이 이긴다.

     ★ 그래서 **모델에게 보낼 때만** 주어를 채운다. 화면에는 원본이 그대로 보인다.

     채우는 자리 — 이름줄 아래 별표 지문인데 **주어 표시(은/는/이/가)가 없는** 문장.
     그런 문장의 임자는 **그 이름줄의 인물**이다. */
  function 주어채우기(글, 이름){

         한국어 문장이 아닙니다」 (판정자가 「지안은 (왜 옆에 앉았지?)」 를 짚었다)

  /* 이름 끝 글자에 받침이 있나 — 조사를 맞추기 위한 것 */

    return ((c - 0xac00) % 28) !== 0;

    /* ★ 260911 — **24 → 14 로 줄였다.**

    /* ★★★ 260912 — **방금 친 말을 빼고 보낸다. 두 번 들어가고 있었다.**

      return {봇, 글};

    /* ★ 260912 — **보내는 도막의 이름도 맞춘다.**

       소개는 「준」, 도막은 「주노」, 지금 이름은 또 다르면 모델이 셋 중에 고른다.

    특징: 특징읽기(방.플롯아이디) || undefined,

    if (흐름 && 흐름.흘렀나) await 흐름끝나기다리기();

      글 = 흐름.글;

        : await fetch(중계 + "/" + 어디 + "/turn", {method: "POST", headers: 머리, body: 본문});

      글 = (((j.choices || [])[0] || {}).message || {}).content || "";
      /* ★★★ 260912 — **흘려받지 않은 길에서도 왜 끝났는지 본다.**

      안흐른왜끝남 = String((((j.choices || [])[0] || {}).finish_reason) || "");
    }

    도막.push(답을도막으로(글, 유저이름(방), 묶음크기(플롯찾기(방))));

    새것담기();
    방그리기();

    /* 시간을 남긴다 — 나중에 회원님께 숫자로 보여 드린다.

       ★ 260911 — **첫 글자까지와 다 뜨기까지를 따로 잰다** (실행계획 2.4).
         전에는 `첫글자` 라는 이름만 붙여 놓고 실제로는 **머리글이 온 때**를 재고 있었다.
         흘려받으면 진짜 첫 글자가 언제 왔는지 알 수 있다.
         사람이 느끼는 것은 앞쪽이다 */
    const 걸림 = ((잰것.다받음 - 잰것.보냄) / 1000).toFixed(1);
    const 첫 = 잰것.첫글자 ? ((잰것.첫글자 - 잰것.보냄) / 1000).toFixed(1) : 0;
    const 중계잰것 = r.headers.get("X-Ttfb");
    /* ★ 260913 — 이번 턴에 설정집이 얼마나 실렸나. 중계가 「자수:넣은수:모두」로 알려 준다.
       ★ 옛 중계에는 이 머리글이 없다 — 그때는 0 이 되고 꼬리가 안 붙는다. 깨지지 않는다 */
    const 설정쪽 = String(r.headers.get("X-Lore") || "").split(":");
    const 설정자수 = Number(설정쪽[0] || 0);
    const 설정꼬리 = 설정자수 ? ("  · 설정 " + (설정쪽[1] || "?") + "/" + (설정쪽[2] || "?") +
                                "항목 " + 쉼표수(설정자수) + "자") : "";

    시간남기기({때: Date.now(), 걸림: Number(걸림), 첫: Number(첫),
                흘림: !!(흐름 && 흐름.흘렀나), 중계: Number(중계잰것 || 0),
                업체: 어디, 모델: 재료.모델 || "(기본)", 자수: 글.length,
                /* ★ 260912 — 방마다 든 값을 세려면 어느 방인지 남겨야 한다 */
                방아이디: 방 && 방.id,
                /* ★ 260913 — 설정집이 그 턴에 몇 자 실렸나. 값을 되짚을 때 쓴다 */
                설정: 설정자수,

                방: (방 && 방.제목) || ""});
    if (잘렸나) 알림("답이 중간에 끊겼습니다 (" + 잘렸나 + ") — 다시 쓰기를 눌러 보십시오", 6000);
    else 알림(((흐름 && 흐름.흘렀나) ? ("첫 글자 " + 첫 + "초 · 다 " + 걸림 + "초")
                                     : (걸림 + "초")) + 설정꼬리);

    /* ★ 답을 받은 뒤에 조용히 돌린다. 대화를 안 막는다 */
    요약해두기(방.id);
  } catch (e){
    알림("못 보냈습니다 — " + String(e.message).slice(0, 40), 8000);
  }
  /* ★ 260911 — 어느 길로 끝나든 점 셋을 반드시 뗀다.
     성공하면 `방그리기()` 가 통째로 다시 그려 저절로 사라지지만,
     탈이 나 되돌아가는 길에서는 그것이 안 돈다. 그대로 두면 영영 점만 깜빡인다 */
  대기떼기();
  S.보낸중 = false;
}

/* ══════════════════════════════════════════════════════
   요약기 — **장기기억을 저절로 채운다. 제타에 없는 것**

   ★ 몇 턴에 한 번만 돈다. 매 턴 돌면 값이 두 배가 된다.
     옛 프로젝트 실측 — 한 바퀴에 한 번 돌면 부름이 안 는다 ($0.0007).

   ★ **어느 칸에 넣을지 · 언제 지울지는 모델이 정한다.** 앱은 나르기만 한다.
     회원님 : 「앱은 정말 0 or 1 정도의 기능밖에 못하며, 그런 용도로만 써야한다」
   ══════════════════════════════════════════════════════ */
const 요약주기 = 4;          /* ★ 260911 — 대화 원문을 14 도막으로 줄인 만큼 더 자주 돈다 */

async function 요약해두기(방아이디){
  const 중계 = 중계주소();
  if (!중계) return;
  const 기 = 기억읽기(방아이디);
  const 도막 = D.도막[방아이디] || [];
  const 여기까지 = 도막.length;
  const 아직 = 여기까지 - (기.요약한데까지 < 0 ? 0 : 기.요약한데까지);
  if (아직 < 요약주기 * 2) return;              /* 아직 모자라다 */

  /* 요약할 토막 — 지난번 이후 것만 */
  const 밑 = 기.요약한데까지 < 0 ? 0 : 기.요약한데까지;
  const 새것 = 도막.slice(밑).map(m =>
    (m.contents || []).filter(c => c.type === "TEXT")
      .map(c => (c.speakerName ? c.speakerName + ": " : "") + c.text).join(NL)).join(NL + NL);
  if (!새것.trim()) return;

  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/summary", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({
        모델: 고른모델().모델 || undefined,
        /* ★ 앞선 마디 제목들 — 같은 제목을 또 짓지 않게 */
        앞제목: (기.마디 || []).map(x => x.n + ". " + x.제목).join(NL),
        /* 바로 앞 마디 본문만 보낸다. 전부 보내면 다시 무한히 자란다 */
        여태: (기.마디 || []).length ? 기.마디[기.마디.length - 1].글 : (기.여태 || ""),
        사이: (기.사이 || []).join(NL),
        열린것: (기.열린것 || []).join(NL), 남길것: (기.남길것 || []).join(NL),
        새것
      })
    });
    const j = await r.json();
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    if (!글) return;
    const 갈린것 = 요약가르기(글);
    /* ★ 260911 — **마디로 쌓는다. 여태에 이어 붙이지 않는다.**
       전에는 여태가 계속 자라 500턴이면 터졌다 (회원님 지적).
       첫 앱이 이미 이렇게 풀어 두었다 — 마디마다 제목을 달고,
       오래된 것은 제목만 싣는다. 「놀이터 사건」의 인덱스 구조다 */
    기.마디 = 기.마디 || [];
    if (갈린것.여태){
      기.마디.push({
        n: 기.마디.length + 1,
        부터: 밑, 까지: 여기까지,
        제목: 갈린것.제목 || ("토막 " + (기.마디.length + 1)),
        글: 갈린것.여태
      });
    }
    /* 옛 자료 호환 — 여태만 있던 방은 그것을 0번 마디로 삼는다 */
    기.여태 = "";
    기.사이 = 갈린것.사이 ? [갈린것.사이] : 기.사이;
    기.열린것 = 갈린것.열린것;
    기.남길것 = 갈린것.남길것;
    기.요약한데까지 = 여기까지;
    기억쓰기(기);
    알림("기억을 갈무리했습니다");
  } catch(_){ /* 조용히 넘어간다 — 대화를 막으면 안 된다 */ }
}

/* 요약을 네 칸으로 가른다.
   ★ 정규식을 안 쓴다 (G6) */
function 요약가르기(글){
  const 낸것 = {제목: "", 여태: "", 사이: "", 열린것: [], 남길것: []};
  let 지금 = null;
  for (const 줄 of String(글).split(NL)){
    const t = 줄.trim();
    if (t === "[제목]"){ 지금 = "제목"; continue; }
    if (t === "[여태]"){ 지금 = "여태"; continue; }
    if (t === "[사이]"){ 지금 = "사이"; continue; }
    if (t === "[열린것]"){ 지금 = "열린것"; continue; }
    if (t === "[남길것]"){ 지금 = "남길것"; continue; }
    if (!지금 || !t || t === "…") continue;
    if (지금 === "제목"){ if (!낸것.제목) 낸것.제목 = t.slice(0, 40); continue; }
    if (지금 === "여태" || 지금 === "사이")
      낸것[지금] = (낸것[지금] ? 낸것[지금] + NL : "") + t;
    else {
      const x = (t.indexOf("- ") === 0) ? t.slice(2).trim() : t;
      if (x && x !== "…") 낸것[지금].push(x);
    }
  }
  return 낸것;
}

function 이름줄인가(t){
  if (!t || t.length > 14) return false;
  /* ★★★ 260912 열한 번째 판정 — 「**화자 이름표가 별표 안에 들어갔습니다.**
     `*내레이터*` … 그리고 내레이터 블록 안에 하린의 대사가 들어가 있습니다. 화자가 뒤섞였습니다」

     모델이 이름줄을 별표로 감싸 내는 턴이 있다. 그러면 앱이 그것을 **지문으로** 그리고,
     그 아래 대사가 앞 사람 것에 붙어 **누가 말하는지가 뒤섞인다.**
     별표만 두른 짧은 낱말은 **벗겨서 다시 본다.**

     ★ 다만 **아무 짧은 지문이나 벗기면 안 된다.** 처음에 그렇게 했다가
       `*피식*` 과 `*눈이 치켜올라간다*`(본보기에 있는 문장)를 이름으로 먹었다.
       실측에서 별표에 먹힌 것은 **「내레이터」 하나뿐**이었다. 거기만 받는다. */
  let ㅅ = t;
  if (ㅅ === "*내레이터*" || ㅅ === "＊내레이터＊") ㅅ = "내레이터";
  if (!ㅅ || ㅅ.length > 14) return false;
  for (const c of [".", ",", "!", "?", "…", String.fromCharCode(34), "*", ">", "("])
    if (ㅅ.indexOf(c) >= 0) return false;
  return true;
}

function 답을도막으로(글, 유저들, 묶음){
  const 묶을수 = Math.max(1, Number(묶음) || 1);

       제타는 같은 자리에서 **내레이터로 받는다** —
         내레이터
         *준은 자기 손바닥을 내려다보고 있었다.*
         *축축했다.*

       내용은 비슷한데 **꼴만 달랐다.** 그래서 그리는 자리에서 바로잡는다.

    const 말할이 = 유저인가 ? "내레이터" : 이름;

    /* ★ 260912 — **묶는다.** 바로 앞 조각과 말할 이가 같으면 같은 말풍선에 이어 붙인다.
       제타가 그렇게 한다 — 한 말풍선 안에 문단이 1.28~6.13 개 들어 있고,
       **앞 풍선과 말할 이가 같은 경우는 6,901개 중 33개(0.5%)뿐이다.**
       말할 이가 바뀌면 반드시 새 풍선이다. 그건 묶을 수 없다.

       ★ `묶을수` 는 이제 사실상 한도가 없다 (`묶음크기()` 가 99 를 준다).
         까닭은 `묶음크기()` 위 주석에 적었다.
         묶음을 안 주고 부르면 예전대로 한 문단씩이다 — 검사가 그 꼴을 본다. */
    const 앞 = 조각[조각.length - 1];
    if (앞 && 앞.position === 자리 && 앞.speakerName === 말할이 && 앞.담은수 < 묶을수){
      앞.text += NL + NL + 줄.join(NL);
      앞.담은수++;
      continue;
    }
    조각.push({type: "TEXT", position: 자리, speakerName: 말할이,
               text: 줄.join(NL), 담은수: 1});
  }
  for (const c of 조각) delete c.담은수;
  return {sender: {type: "BOT"}, contents: 조각, messageTime: new Date().toISOString()};
}

/* ══════════════════════════════════════════════════════
   그림 — venice.ai

   회원님 지시 — 「이미지 생성 기능 넣어줘. **venice.ai** 키 확인해서 아예 삽입해버려.
     제타는 채팅방 안의 **15 재화가 있는 그 버튼 위치**에, 우리 데타에서는
     **이미지 생성 버튼**을 넣어서 **채팅방 중간에 출력**하게 해주고.」

   ★★★ **열쇠는 앱에 없다.** `01. 최종 결과물/본편/index.html` 은 GitHub Pages 로
     공개되므로 앱에 박으면 누구나 F12 로 본다. 중계가 secret `VE_KEY` 로 들고 있다.

   ★ 값이 드는 것이므로 **세 겹으로 막는다**
     (회원님 : 「수발신 토큰수가 높으면 안되니까 제한을 두고 명시해주는게 좋겠다」) —
       ⑴ 하루 한도   그림하루한도 장. 단추 옆에 「남은수/한도」로 **늘 보인다**
       ⑵ 잠금        그리는 동안 · 그린 뒤 그림잠금초 동안 못 누른다
       ⑶ 보내는 글   장면 글을 그림보낼자 자로 자른다. 중계가 한 번 더 자른다

   ★ 그림 실물(base64)은 **도막에 안 넣는다.** 도막은 `새것담기()` 가 턴마다 통째로
     다시 쓰므로 큰 것이 끼면 매 턴 그것을 또 쓴다. 도막에는 `그림키` 만 둔다 */
const 그림하루한도 = 20;        /* 하루에 그릴 수 있는 장 수 */
const 그림창고한도 = 10;        /* 실물로 남겨 두는 장 수. 넘으면 오랜 것부터 버린다 */
const 그림보낼자 = 400;         /* 중계로 보내는 장면 글의 최대 글자 수 */
const 그림잠금초 = 8;           /* 그린 뒤 이만큼은 못 누른다 */
let 그림중 = false;
let 그림마지막 = 0;

/* ── 그림 창고 ── 실물은 여기에만. 키는 `g` + 밀리초라서 **이름 차례가 곧 때 차례**다 */
function 그림창고(){
  try { return JSON.parse(localStorage.getItem("그림") || "{}"); } catch(_){ return {}; }
}
function 그림꺼내기(키){ return 키 ? (그림창고()[키] || "") : ""; }
function 그림담기(키, 주소){
  const 표 = 그림창고();
  표[키] = 주소;
  const 키들 = Object.keys(표).sort();
  while (키들.length > 그림창고한도) delete 표[키들.shift()];
  try { localStorage.setItem("그림", JSON.stringify(표)); return true; }
  catch(_){
    /* 자리가 모자라면 최근 셋만 남기고 한 번 더 — 도막은 남으므로 자리만 비운다 */
    const 남 = Object.keys(표).sort();
    while (남.length > 3) delete 표[남.shift()];
    try { localStorage.setItem("그림", JSON.stringify(표)); return true; }
    catch(_2){ 알림("그림 담을 자리가 모자랍니다 — 나 화면에서 비우십시오", 6000); return false; }
  }
}

/* ── 하루 셈 ── 날이 바뀌면 0 으로 본다 (지우지는 않는다) */
function 오늘글(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function 그림셈(){
  try {
    const j = JSON.parse(localStorage.getItem("그림셈") || "{}");
    return (j.날 === 오늘글()) ? (j.수 || 0) : 0;
  } catch(_){ return 0; }
}
function 그림셈올리기(){
  try { localStorage.setItem("그림셈", JSON.stringify({날: 오늘글(), 수: 그림셈() + 1})); } catch(_){}
}
function 그림남은수(){ return Math.max(0, 그림하루한도 - 그림셈()); }

/* ── 이름을 지운다 ──
   ★ 회원님 지시 — 「사람 이름과 나이 같은 것은 빼야 한다」. 까닭이 둘이다 —
     ⑴ 그림 모델은 한국 이름을 못 알아듣고 엉뚱한 얼굴이나 **글자를 그려 넣는다**
     ⑵ 나이가 든 글은 그림 쪽에서 걸린다
   긴 이름부터 지운다 — 짧은 것이 먼저 걸리면 긴 이름이 토막난다 */
function 이름지우기(글, 방, 플롯){
  let t = String(글 || "");
  const 이름들 = [];
  for (const c of ((플롯 && 플롯.characters) || [])) if (c && c.name) 이름들.push(c.name);
  const 나 = 방프로필(방, 플롯).이름;
  if (나) 이름들.push(나);
  이름들.push("{{user}}", "{{char}}");
  이름들.sort((a, b) => b.length - a.length);
  for (const 이 of 이름들) if (이) t = t.split(이).join("그 사람");
  /* 나이가 붙은 낱말을 떼어 낸다 — 「스물셋」·「23살」 같은 것.
     정규식을 안 쓴다 (G6) — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 */
  return t.split(" ").filter(x => {
    const y = x.trim();
    if (!y) return false;
    return !(y.indexOf("살") >= 0 && y.length <= 4);
  }).join(" ");
}

/* ── 이 자리의 장면을 글로 뽑는다 ──
   ★ 무엇을 보내나 — 앞 도막 여섯 개에서 **지문만.** 대사는 안 보낸다.
     그림에 옮길 것은 「무엇이 보이나」이지 「무엇을 말했나」가 아니다.
     지문은 별표 사이에 있다 — `조각그리기()` 가 가르는 것과 같은 셈이다.
   ★ 뒤에서 앞으로 훑고, 넘치면 **앞을 자른다** — 최근 것이 지금 자리다 */
function 장면뽑기(){
  const 방 = S.방;
  if (!방) return "";
  const 플롯 = 플롯찾기(방);
  const 도막 = D.도막[방.id] || [];
  let 지문 = [];
  for (let i = 도막.length - 1; i >= 0 && i > 도막.length - 7; i--){
    const m = 도막[i];
    if (!m || m.그림 || m.그림키) continue;
    const 한도막 = [];
    for (const c of (m.contents || [])){
      if (c.type !== "TEXT" || !c.text) continue;
      const 토막 = String(c.text).split("*");
      토막.forEach((조각, k) => {
        const x = 조각.trim();
        if (!x) return;
        /* 홀수 자리가 지문이다. 내레이션은 통째로 지문이다 */
        if (c.position === "NARRATOR" || (k % 2) === 1) 한도막.push(x);
      });
    }
    지문 = 한도막.concat(지문);
    if (지문.join(" ").length >= 그림보낼자) break;
  }
  let 글 = 지문.join(" ");
  /* 지문이 하나도 없으면 있는 글이라도 쓴다 — 아무것도 안 보내면 그릴 것이 없다 */
  if (!글.trim()){
    const m = 도막[도막.length - 1];
    글 = m ? 별표벗기기(도막글꺼내기(m)) : "";
  }
  글 = 이름지우기(글, 방, 플롯);
  if (글.length > 그림보낼자) 글 = 글.slice(글.length - 그림보낼자);
  return 글.trim();
}

/* ── 단추를 누르면 ── 곧바로 안 보낸다. **무엇을 보내는지 먼저 보여 드린다** */
function 그림내기(){
  if (!S.방) return 알림("방을 먼저 여십시오");
  if (그림중) return 알림("그리는 중입니다");
  const 남초 = Math.ceil((그림잠금초 * 1000 - (Date.now() - 그림마지막)) / 1000);
  if (남초 > 0) return 알림(남초 + "초 뒤에 다시 누르십시오");
  if (그림남은수() <= 0)
    return 알림("오늘 " + 그림하루한도 + "장을 다 썼습니다. 날이 바뀌면 다시 됩니다", 6000);

  const 장면 = 장면뽑기();
  if (!장면) return 알림("그릴 장면이 없습니다 — 한 턴 먼저 주고받으십시오", 5000);

  시트열기("이 자리를 그림으로",
    '<div class="글" style="padding:0 14px;color:var(--흐림2);line-height:1.8">' +
      '보내는 글 <b>' + 장면.length + '자</b> · 오늘 남은 장 <b>' + 그림남은수() + '/' +
      그림하루한도 + '</b><br>' +
      '사람 이름과 나이는 뺐습니다. 열쇠는 앱에 없고 중계가 들고 있습니다.' +
    '</div>' +
    '<div style="padding:10px 14px"><textarea id="그림칸" style="width:100%;height:120px;' +
      'background:var(--바탕2);border-radius:10px;padding:10px 12px;font-size:16px;' +
      'line-height:1.7;resize:none">' + 안전(장면) + '</textarea></div>' +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
      '<button class="강" data-시트=그림보내기>그린다</button></div>');
}

/* ── 중계에 보낸다 ── `/img` 한 길이다. venice 는 or·gg 갈래가 아니다 */
async function 그림보내기(장면){
  const 방 = S.방;
  if (!방) return;
  그림중 = true;
  알림("그리는 중입니다 — 20초쯤 걸립니다", 20000);
  const 잰것 = Date.now();
  try {
    const 중계 = 중계주소();
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/img", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      /* 업체·모델은 **밑그림말을 다듬는 글 모델**이다. 그림 모델은 중계가 정한다 */
      body: JSON.stringify({장면: 장면, 업체: 고른모델().업체, 모델: 고른모델().모델})
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.그림){
      알림("그림이 안 나왔습니다 — " +
           ((j.error && j.error.message) || ("탈 " + r.status)), 8000);
      return;
    }
    const 키 = "g" + Date.now();
    const 담김 = 그림담기(키, j.그림);
    const 도막 = D.도막[방.id] || [];
    도막.push({sender: {type: "BOT"}, contents: [],
               그림키: 담김 ? 키 : "", 그림말: j.밑그림말 || "",
               messageTime: new Date().toISOString()});
    D.도막[방.id] = 도막;
    그림셈올리기();
    새것담기();
    방그리기();
    맨아래로(true);
    시간남기기({때: Date.now(),
                걸림: Number(((Date.now() - 잰것) / 1000).toFixed(1)), 첫: 0,
                흘림: false, 중계: 0, 업체: "ve",
                모델: "그림 " + (j.그림모델 || ""), 자수: 장면.length,
                방아이디: 방.id, 방: 방.제목 || ""});
    알림("그렸습니다 · 오늘 " + 그림셈() + "/" + 그림하루한도 +
         (j.흐릿함 ? " (안전 모드로 흐려졌습니다)" : ""), 4000);
  } catch(e){
    알림("그림을 못 받았습니다 — " + (e && e.message ? e.message : ""), 8000);
  } finally {
    그림중 = false;
    그림마지막 = Date.now();   /* 실패해도 잠금을 건다 — 연달아 두드리면 값만 든다 */
  }
}

/* ── 그림을 누르면 크게 ── */
function 그림열기(몇){
  const m = (D.도막[(S.방 || {}).id] || [])[몇];
  if (!m) return;
  const 주소 = m.그림 || 그림꺼내기(m.그림키);
  시트열기(null,
    (주소 ? '<div style="padding:0 12px"><img src="' + 안전(주소) +
            '" style="width:100%;border-radius:12px"></div>'
          : '<div class="글" style="padding:0 14px;color:var(--흐림)">그림 실물이 지워졌습니다</div>') +
    (m.그림말 ? '<div class="글" style="padding:10px 14px;color:var(--흐림2);font-size:11px;' +
                'line-height:1.7;word-break:break-word">' + 안전(m.그림말) + '</div>' : '') +
    '<div class="시트단추"><button data-시트=닫기>닫기</button>' +
      '<button data-시트=지우기 data-값="' + 몇 + '">여기부터 지우기</button></div>');
}


/* 시간 기록 — 회원님께 「느리다」를 숫자로 답하기 위한 것 */
function 시간남기기(한줄){
  try {
    const 목 = JSON.parse(localStorage.getItem("시간") || "[]");
    목.push(한줄);
    localStorage.setItem("시간", JSON.stringify(목.slice(-200)));
  } catch(_){}
}

/* ══════════════════════════════════════════════════════
   상호작용 — 제타 실물을 보고 만든 것

     프사 누르기      인물 정보
     말풍선 누르기    편집 · 다시 · 지우기
     하단 넷         신고 · 편집 · 주문해서 다시 · 다시
     방 메뉴         새로하기 · 이어하기 · 대화 프로필 · 모델 · 지우기
   ══════════════════════════════════════════════════════ */

/* 지금 방의 플롯 */
function 지금플롯(){ return 플롯찾기(S.방); }

/* ★ 260912 — **방으로 플롯을 찾는다.** 지금 방이 아닌 것도 찾아야 해서 갈랐다
   (답이 올 때는 S.방 이 딴 방으로 옮겨 가 있을 수 있다) */
function 플롯찾기(방){
  if (!방) return null;
  return D.플롯.find(x => x.id === 방.플롯아이디) ||
         D.인기.find(x => x.id === 방.플롯아이디) || null;
}

/* ── 인물 정보 ── */
function 인물열기(이름){
  const p = 지금플롯();
  if (!p) return 알림("인물을 못 찾았습니다");
  const c = (p.characters || []).find(x => x.name === 이름) || (p.characters || [])[0];
  if (!c) return 알림("인물 정보가 없습니다");
  const 그림 = c.imageUrl || p.imageUrl;
  시트열기(null,
    '<div class="인물머리">' +
      (그림 ? '<img src="' + 안전(그림) + '">' : '<div style="width:56px;height:56px;border-radius:50%;background:var(--바탕3)"></div>') +
      '<div><div class="이름">' + 안전(c.name) + '</div>' +
      '<div class="밑">' + 안전(p.name) + '</div></div>' +
    '</div>' +
    '<div class="인물글">' + 안전(c.description || "(설명 없음)") + '</div>' +
    /* ★ 260912 — **방 안에서는 그 방 캐릭터 이름으로** (회원님 지시) */
    (p.longDescription ? '<div class="시트머리">상황</div><div class="인물글">' +
      안전(이름채우기(p.longDescription, p, S.방)) + '</div>' : ""));
}

/* ── 말풍선 메뉴 ── */
function 도막메뉴(몇){
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];
  if (!m) return;
  const 봇 = ((m.sender && m.sender.type) === "BOT");
  const 마지막 = (몇 === 도막.length - 1);
  시트열기("이 말",
    시트줄("✏", "고쳐 쓰기", "편집", {값: 몇}) +
    (봇 && 마지막 ? 시트줄("↺", "다시 쓰게 하기", "재실행", {값: 몇}) : "") +
    (봇 && 마지막 ? 시트줄("🪄", "주문해서 다시", "주문", {값: 몇}) : "") +
    시트줄("⧉", "글 복사", "복사", {값: 몇}) +
    시트줄("📝", "메모장에 담기", "메모", {값: 몇, 밑: "이 턴과 내가 친 말을 이어 적습니다"}) +
    시트줄("🗑", "여기부터 지우기", "지우기", {값: 몇, 빛: "빨강"}));
}

/* 도막을 글로 (편집·복사에 쓴다. 섞어놓기 판도 이것으로 뜬다)

   ★★★ 260912 — **말할 이가 안 바뀌면 이름을 다시 찍지 않는다.**

   맥락 없는 판정자가 첫 열 줄만 보고 여섯 덩이를 다 갈라냈다. 그 첫째 단서가
   「데타는 문단마다 이름을 다시 찍는다 — 지유 / 지유 / 지유 / 내레이터 / 지유」였다.

   화면(`도막그리기()`)은 이미 이어지는 같은 사람을 **한 이름줄 아래로 묶어** 그린다.
   그런데 **글로 꺼내는 이 자리만** 말풍선마다 이름을 다시 찍고 있었다.
   판정자가 본 것은 화면이 아니라 이 글이다 — 화면과 글이 서로 달랐던 것이다.

   제타 실측 (내 대화방 스물한 방 · 봇 도막 1,433턴 · 말풍선 6,901개)

     바로 앞 말풍선과 말할 이가 같은 것        33개 = 0.5%
     이름줄 하나에 딸린 문단                   1.99 개
     한 턴에 찍히는 이름줄                     4.79 줄

   데타는 같은 자리가 **36%** 였다 (앱에서 굴린 48턴 · 말풍선 278개 중 101개).
   제타는 **같은 사람이 이어 말하면 이름을 다시 찍지 않는다.** 그대로 맞춘다. */
function 도막글꺼내기(m){
  const 낸것 = [];
  let 앞이름 = null;
  for (const c of (m.contents || [])){
    if (c.type !== "TEXT") continue;
    const 이름 = (c.speakerName && c.position !== "RIGHT") ? c.speakerName : "";
    /* 말할 이가 바뀔 때만 이름줄을 얹는다. 안 바뀌면 글만 이어 붙인다 */
    낸것.push((이름 && 이름 !== 앞이름 ? 이름 + NL : "") + c.text);
    앞이름 = 이름;
  }
  return 낸것.join(NL + NL);
}

/* ── 고쳐 쓰기 ── */
function 편집열기(몇){
  const 도막 = D.도막[S.방.id] || [];

  if (!m) return;

    '<div style="padding:0 12px"><textarea id="편집칸">' + 안전(도막글꺼내기(m)) + '</textarea></div>' +

    '<button class="강" data-시트=편집저장 data-값="' + 몇 + '">고침</button></div>');
  setTimeout(() => { const t = $("#편집칸"); if (t) t.focus(); }, 260);
}
function 편집저장(몇){
  const t = $("#편집칸");
  if (!t) return;
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];
  if (!m) return;
  const 봇 = ((m.sender && m.sender.type) === "BOT");
  도막[몇] = 봇 ? 답을도막으로(t.value, 유저이름(S.방), 묶음크기(지금플롯()))
                : {sender: {type: "USER"},
                   contents: [{type: "TEXT", position: "RIGHT", text: t.value}],
                   messageTime: m.messageTime};
  D.도막[S.방.id] = 도막;
  새것담기(); 시트닫기(); 방그리기();
  알림("고쳤습니다");
}

/* ── 다시 쓰게 하기 ── */
async function 재실행(몇, 주문){
  const 도막 = D.도막[S.방.id] || [];
  /* 마지막 봇 도막을 걷어내고, 그 앞의 내 말로 다시 친다 */
  let i = 몇 === undefined ? 도막.length - 1 : 몇;
  while (i >= 0 && ((도막[i].sender && 도막[i].sender.type) !== "BOT")) i--;
  if (i < 0) return 알림("다시 쓸 것이 없습니다");
  const 지운것 = 도막.splice(i);
  /* 그 앞의 내 말을 찾는다 */
  let j = i - 1;
  while (j >= 0 && ((도막[j].sender && 도막[j].sender.type) === "BOT")) j--;
  const 친말 = j >= 0 ? (도막[j].contents || []).filter(c => c.type === "TEXT")
    .map(c => c.text).join(NL) : "";
  if (j >= 0) 도막.splice(j);
  D.도막[S.방.id] = 도막;
  방그리기();
  await 말보내기(친말 || "…", 주문);
}

/* **방을 통째로 지운다.**
   자료.json 에서 온 방은 파일을 못 고치므로 「지운방」에 이름을 적어 두고
   앱이 뜰 때 거른다. 그래야 새로고침해도 안 돌아온다 */
function 지운방들(){
  try { return JSON.parse(localStorage.getItem("지운방") || "[]"); } catch(_){ return []; }
}
function 방지우기속(id){
  const 목 = 지운방들();
  if (목.indexOf(id) < 0) 목.push(id);
  try { localStorage.setItem("지운방", JSON.stringify(목)); } catch(_){}
  D.방 = D.방.filter(r => r.id !== id);
  delete D.도막[id];
  try {
    localStorage.removeItem("기억_" + id);
    localStorage.removeItem("메모_" + id);
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    localStorage.setItem("새방", JSON.stringify(새방.filter(r => r.id !== id)));
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    delete 새도막[id];
    localStorage.setItem("새도막", JSON.stringify(새도막));
  } catch(_){}
  if (S.방 && S.방.id === id){ S.방 = null; S.화면 = "대화"; }
}

/* ── 이어하기 ── */
/* ★ 260912 회원님 : 「이어하기에서 고를 땐 일일이 들어가보지 않아도 목록에서
   각 방의 **생성시각, 최종시각(마지막 상호작용시각), 턴수, 사용금액**을 확인할 수 있으면 좋고」

   ★ 「이어하기 여부 결정 없이 바로 채팅 가능하게」 — 누르면 바로 들어갑니다.
     API 는 상태를 안 가지므로 다른 방 내용이 새어 들어갈 일이 없습니다 */
const 짧은때 = t => {
  if (!t) return "—";
  const d = new Date(t);
  if (isNaN(d.getTime())) return "—";
  const z = n => (n < 10 ? "0" : "") + n;
  return z(d.getMonth() + 1) + "/" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes());
};
const 값글 = v => v > 0 ? "$" + v.toFixed(4) : "—";

/* ★ 260912 회원님 물음 — 「**9/12에 만들어서 9/6에 최종대화** 했다는건 잘 이해 안된다.」

   버그가 아니라 **두 시각의 출처가 달랐다** —
     만든때        앱이 그 방을 받아들인 때 (9/12)
     끝 도막 시각   제타에서 실제로 주고받은 때 (9/6)

   받아 온 방은 도막 쪽이 참값이다. **도막이 있으면 첫 도막 시각을 쓴다.** */
function 연때(방이나벌, 도막){
  const 첫 = (도막 || [])[0];
  const ㄱ = 첫 && 첫.messageTime;
  const ㄴ = 방이나벌 && (방이나벌.만든때 || 방이나벌.savedAt);
  if (ㄱ && ㄴ) return (new Date(ㄱ) < new Date(ㄴ)) ? ㄱ : ㄴ;
  return ㄱ || ㄴ || "";
}

function 이어하기열기(){
  const 방 = S.방;
  const 목 = 방.이어하기 || [];
  const 지금도막 = D.도막[방.id] || [];
  /* 지금 보고 있는 것도 한 줄로 보인다 — 몇 번째 대화인지 알 수 있게 */
  const 이줄 = (꼭, 말, 가, 더) => 시트줄(꼭, 말, 가, 더);
  /* ★ 260912 회원님 : 「신고내역 및 기억도 방 별로 적용 및 **열고 닫을 수 있도록**」
     벌마다 적어 둔 것이 있으면 그 자리에서 바로 열어 봅니다 */
  /* ★ 260912 회원님 : 「메모/기억 뿐만아니라 **수정 버튼도 추가**해서,
     그거 누르면 **제목을 편집**할 수 있게 해.」
     ★ 수정은 늘 보인다 — 메모·기억이 없어도 제목은 붙일 수 있어야 한다 */
  const 곁줄 = (대화, 있나) =>
    '<div class="곁줄">' +
      '<button class="곁단추" data-시트=제목고치기 data-값="' + 안전(대화) + '">✏ 수정</button>' +
      (있나.메모 ? '<button class="곁단추" data-시트=메모 data-값="@' + 안전(대화) +
                    '">📝 메모</button>' : "") +
      (있나.기억 ? '<button class="곁단추" data-시트=기억 data-값="@' + 안전(대화) +
                    '">🧠 기억</button>' : "") +
    '</div>';
  const 한벌 = (e) => {
    const 도막 = D.도막[e.id] || [];
    const 끝 = 도막[도막.length - 1];
    const 있나 = 적은것있나(e.id);
    /* ★ 260912 회원님 : 「제목은 09/12 18:10 -> 09/06 18:20 **보다 앞에** 들어가게끔.」
       붙인 제목이 있으면 그것이 앞에 서고, 날짜는 뒤로 물러나 밑줄로 간다 */
    const 때글 = 짧은때(연때(e, 도막)) + "  →  " +
                 짧은때((끝 && 끝.messageTime) || e.savedAt);
    return 이줄("💾", (e.제목 ? e.제목 : 때글), "이어열기",
                {값: e.id,
                 밑: (e.제목 ? 때글 + " · " : "") +
                     턴수(도막) + "턴 · " + 도막.length + "도막 · " + 값글(방값(e.id)) +
                     (있나.메모 ? " · 📝" : "") + (있나.기억 ? " · 🧠" : "")}) +
           곁줄(e.id, 있나);
  };
  const 지금끝 = 지금도막[지금도막.length - 1];
  const 지금있나 = 적은것있나(방.id);
  시트열기("대화 " + (목.length + 1) + "개",
    시트줄("▶", (방.벌제목 || "지금 보고 있는 대화"), "닫기",
           {빛: "켬",
            밑: 짧은때(연때(방, 지금도막)) + "  →  " +
                짧은때(지금끝 && 지금끝.messageTime) + "   " +
                턴수(지금도막) + "턴 · " + 값글(방값(방.id)) +
                (지금있나.메모 ? " · 📝" : "") + (지금있나.기억 ? " · 🧠" : "")}) +
    곁줄(방.id, 지금있나) +
    (목.length ? 목.map(한벌).join("")
      : '<div class="인물글">저장된 것이 없습니다. 방메뉴의 「새로하기」로 만듭니다.</div>'));
}

/* ── 기억 ── */
function 기억열기(어느){
  /* ★ 260912 — **방에서 나온 뒤에 불릴 수 있다.**
     갈무리는 오래 걸린다. 그 사이 회원님이 뒤로 가시면 S.방 이 null 이 된다.
     그때 터지면 화면이 멈춘다 */
  if (!S.방) return;
  /* ★ 260912 — 값이 `@아이디` 꼴이면 이어하기에 담긴 그 대화의 기억을 본다 */
  const 딴대화 = (typeof 어느 === "string" && 어느.charAt(0) === "@") ? 어느.slice(1) : "";
  const 대화 = 딴대화 || S.방.id;
  S.기억대화 = 대화;
  const 기 = 기억읽기(대화);
  const 글 = 기억글(기);
  시트열기("기억 — " + (딴대화 ? "지난 대화" : "제타에 없는 것"),
    '<div style="padding:0 12px"><textarea id="기억칸" ' +
    'placeholder="여태 있었던 일 · 사이 · 아직 답이 안 난 것">' + 안전(글) + '</textarea></div>' +
    '<div class="인물글" style="color:var(--흐림)">여기 적은 것이 매 턴 함께 갑니다.' +
    ' 대화가 길어져도 앞의 일이 안 사라집니다.</div>' +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
    (딴대화 ? "" : '<button data-시트=지금갈무리>지금 갈무리</button>') +
    '<button class="강" data-시트=기억저장>담기</button></div>');
}

/* ══ 자료 들이기 ══
   제타에서 받은 것을 그대로 쓴다. 꼴을 안 고친다 */
async function 들이기(){
  try {
    const r = await fetch('./자료.json', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    D.플롯 = j.플롯 || []; D.방 = j.방 || []; D.도막 = j.도막 || {}; D.인기 = j.인기 || [];
    /* 받아 온 방의 도막 수를 적어 둔다 — 이어 친 것만 담으려고 */
    for (const r of D.방) 기본도막수[r.id] = (D.도막[r.id] || []).length;
    /* 브라우저에 담아 둔 것을 얹는다 */
    try {
      const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
      const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
      for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
      for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
      /* ★ 손으로 고친 플롯을 얹는다 — 자료.json 은 못 고치므로 따로 담아 둔다 */

      /* 지운 방은 되살리지 않는다 */
      const 지운 = 지운방들();
      if (지운.length){
        D.방 = D.방.filter(r => 지운.indexOf(r.id) < 0);
        for (const id of 지운) delete D.도막[id];
      }
      const 고침 = 플롯고침들();
      for (const id of Object.keys(고침)){
        const i = D.플롯.findIndex(x => x.id === id);
        if (i >= 0) D.플롯[i] = 고침[id]; else D.플롯.unshift(고침[id]);
      }
      for (const k of Object.keys(새도막)) D.도막[k] = 새도막[k];

      /* ★ 260912 — **같은 플롯의 방을 하나로 합친다.** (제타 로직)
         회원님 : 「플롯마다 가장 최근 방을 남기고 나머지를 이어하기로 넣는거다.」
         이미 흩어진 것들도 다 합칩니다 — 「이거 난잡해서 쓰겠나」
         ★ **도막을 다 얹은 뒤에** 합친다. 앞서 합치면 도막이 없어 이어하기가 빈다 */
      합치기();
    } catch(_){}
    알림('방 ' + D.방.length + '개 · 플롯 ' + D.플롯.length + '개');
  } catch (e){
    /* 자료가 없어도 화면은 뜬다 */
  }
  그리기();
}

/* ══════════════════════════════════════════════════════
   자판이 올라온 것을 앱이 알게 한다

   ★ 260911 신고 — 「첫 대화때 자판누르면 첫대화가 안보임.」
   ★ 260911 회원님 v1.2 메모 1번 — 「타자 불러와졌을떄 채팅입력란이 위로 로드된
      상태로 고정되어, 채팅방 스크롤해도 그 위치를 고정하길 바람.」

   자판이 올라와도 `100dvh` 는 그대로다. 실제로 재 보면 이랬다 —
     보이는 높이 640px   ·   앱 높이 900px   ·   입력칸 아래끝 900px
   입력칸이 자판 뒤로 260px 들어가 있었다. 위쪽 첫 대화는 그만큼 화면 밖으로 밀렸다.

   **`visualViewport` 를 본다.** 그것만이 자판을 셈에 넣는다.
     height     자판을 뺀 진짜 보이는 높이
     offsetTop  iOS 에서 판이 통째로 밀려 올라간 만큼. 그만큼 되밀어야 제자리다

   ★ `visualViewport` 가 없으면 아무것도 안 한다 — CSS 가 `100dvh` 로 되돌아간다
   ══════════════════════════════════════════════════════ */
/* ★★★ 260913 — **window.resize 도 듣는다.**
   전에는 `visualViewport` 의 resize·scroll 만 들었다. PC 에서 창틀을 끌어 줄일 때
   그것이 안 터지거나 늦으면 `--보임` 이 옛 값으로 남아 아래가 잘렸다.
   ★ 그리고 `visualViewport` 가 없는 곳에서도 `innerHeight` 로 세운다 —
     전에는 `if (!vv) return` 으로 아무것도 안 했다. */
(function 자판보기(){
  const vv = window.visualViewport;
  let 앞높이 = -1;
  function 맞추기(){
    const h = Math.round((vv && vv.height) || window.innerHeight);
    const 위 = Math.round((vv && vv.offsetTop) || 0);
    document.documentElement.style.setProperty('--보임', h + 'px');
    const 앱 = $('#앱');
    if (앱) 앱.style.transform = 위 ? 'translateY(' + 위 + 'px)' : '';
    /* 자판이 **올라올 때만** 따라 내린다. 내려갈 때 끌어내리면 읽던 자리를 잃는다.
       그리고 바닥에 붙어 있을 때만 내린다 — 위를 읽고 계시면 가만둔다 */
    const 자판올라옴 = (앞높이 >= 0 && h < 앞높이 - 40);
    앞높이 = h;
    if (자판올라옴 && S.방) 맨아래로(false);
  }
  if (vv){
    vv.addEventListener('resize', 맞추기);
    vv.addEventListener('scroll', 맞추기);
  }
  /* ★ 260913 — **창틀을 끌어 줄일 때**가 이 자리다. PC 에서 이것이 없어 아래가 잘렸다 */
  addEventListener('resize', 맞추기);
  addEventListener('orientationchange', () => setTimeout(맞추기, 250));
  맞추기();
})();

그리기();
자리쌓기();      /* ★ 첫 뒤로가 먹으려면 자리를 하나 쌓아 둬야 한다 */
들이기();
</script>
