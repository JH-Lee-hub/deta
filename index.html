<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151516">
<title>제타앱</title>
<!--
  제타앱 — 제타와 같은 화면 · 같은 결 · 거기에 **장기기억**

  회원님 지시 (260910) —
    「제타랑 똑같은 레이아웃, 기능, 동일수준의 출력 되게끔 앱 만들어놓고,
     해당 플롯들도 안에 구현해놔.」
    「제타앱이 갖지 못한 '장기기억'을 나는 갖는게 목표니까,
     제타앱에는 장기기억을 추가로 구현해놓고.」

  색과 크기는 **제타 실물에서 잰 것**이다 (07. 제타에서 받은 것/4. 화면 그림/00_결.json)
    바탕 rgb(21,21,22) · 강조 rgb(124,103,255) · 글꼴 Pretendard Variable
-->
<style>
/* ── 결 ─────────────────────────────────────────────
   제타 화면에서 실제로 잰 값. 짐작한 것이 아니다 */
:root{
  --바탕:#151516;          /* rgb(21,21,22) */
  --바탕2:#1e1e20;         /* 말풍선 · 카드 */
  --바탕3:#26262a;         /* 눌린 것 */
  --글자:#ffffff;
  --흐림:#595b63;          /* rgb(89,91,99) — 마지막 메시지 */
  --흐림2:#8b8d95;         /* 이름줄. 제타 실측 「흰색 50%」와 사실상 같다 */
  /* ★ 260911 실측 — **제타는 흐린 글자를 회색이 아니라 「흰색에 투명도」로 낸다.**

     제타 방 안 갈무리(07. …/4. 화면 그림/06_방안.png)에서 픽셀을 직접 쟀다.
     바탕이 rgb(21,21,22) 로 정확히 나와 **색이 틀어지지 않은 그림**임을 먼저 확인했다.
     구역마다 밝기 상위 2% 의 가운데값(=글자 속살)을 잰 것이다.

       자리            잰 값   그 바탕 위 흰색 몇 %   데타는 그동안
       인물 이름줄      180        68%  ≈ 70%        #8b8d95 (139)  ← 어두웠다
       인물 지문        188        70%               #8b8d95 (139)  ← 어두웠다
       인물 대사        249        ≈ 흰색             #ffffff        ○
       내레이션         161        60%               #8b8d95 (139)  ← 어두웠다
       유저 글          255        흰색               #ffffff        ○

     **흐린 글자 셋이 다 제타보다 어두웠다.** 이름줄 색을 지문·내레이션에도
     그대로 돌려 썼기 때문이다. 제타는 셋을 다르게 쓴다.
     제타가 내려받는 CSS 에도 같은 토큰이 있다 — lab(100 …/0.5) · lab(100 …/0.7) */
  --지문:rgba(255,255,255,.7);
  --나레:rgba(255,255,255,.6);
  --강조:#7c67ff;          /* rgb(124,103,255) — 단추·탭. 홈 화면에서 잰 값 */
  /* ★ 260911 실측 — 유저 말풍선은 --강조 가 아니다. 방 안에서 잰 값이 따로 있다 */
  --내말바탕:#644dd6;      /* rgb(100,77,214) */
  --강조흐림:#5a48c7;
  --빨강:#f04438;
  --선:#2a2a2e;
  --머리높이:52px;
  --발높이:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--바탕); color:var(--글자);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;
  font-size:16px}   /* 16px 밑이면 iOS 가 확대한다 */
img{display:block;max-width:100%}
.숨김{display:none!important}

/* ── 판 짜기 ───────────────────────────────────────── */
/* ★ 260910 회원님 : 「PC 브라우저에서 켠 제타앱은 높이가 높아야 아래가 나온다.
   상단/하단 바들은 필수 노출되게 하고, 세로 길이가 줄어들면 하단 필수바 위에서 축소되게 하라.」

   까닭은 **`min-height:0` 이 없어서**였다. flex 자식은 기본이 `min-height:auto` 라
   내용만큼 커지고, 그만큼 아래 바가 화면 밖으로 밀려난다.
   가운데(#몸)만 줄어들게 하면 머리와 발은 늘 남는다 */
/* ★ 260911 신고 — 「첫 대화때 자판누르면 첫대화가 안보임」
   ★ 260911 회원님 v1.2 메모 1번 — 「타자 불러와졌을떄 채팅입력란이 위로 로드된 상태로
      고정되어, 채팅방 스크롤해도 그 위치를 고정하길 바람.」

   `100dvh` 는 **자판이 올라온 것을 모른다.** 자판이 화면 절반을 덮어도
   앱은 여전히 전체 높이라고 믿어서, 위쪽(첫 대화)이 화면 밖으로 밀리고
   입력칸은 자판 뒤로 들어간다.
   재 보면 이랬다 — 보이는 높이 640px 인데 입력칸 아래끝이 900px.

   그래서 **`visualViewport.height` 를 보고 `--보임` 에 담아 쓴다.**
   `visualViewport` 가 없는 곳(옛 브라우저·PC)에서는 `100dvh` 로 되돌아간다 */
#앱{display:flex;flex-direction:column;height:var(--보임,100dvh);min-height:0;
  max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#머리자리,#입력자리,#발{flex:0 0 auto}
#몸{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
#몸::-webkit-scrollbar{width:0}

/* 머리 */
.머리{
  height:var(--머리높이); flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 14px; background:var(--바탕); border-bottom:1px solid var(--선);
  position:sticky; top:0; z-index:20;
}
.머리 .제목{font-size:20px;font-weight:700;letter-spacing:-.3px}
.머리 .가운데{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.머리 .단추{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:18px}
.머리 .단추:active{background:var(--바탕3)}

/* 발 — 하단 네비 넷 */
#발{
  height:var(--발높이); flex:0 0 auto; display:flex; border-top:1px solid var(--선);
  background:var(--바탕); padding-bottom:env(safe-area-inset-bottom);
}
#발 button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--흐림); font-size:10px;
}
#발 button .꼭지{font-size:19px;line-height:1}
#발 button.켬{color:var(--글자)}

/* ── 홈(랭킹) ──────────────────────────────────────── */
.탭줄{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.탭줄::-webkit-scrollbar{height:0}
.탭{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--흐림2);
  background:var(--바탕2);white-space:nowrap}
.탭.켬{background:var(--글자);color:#111}
.탭줄.맨탭 .탭{background:none;padding:6px 4px;font-size:15px;font-weight:600}
.탭줄.맨탭 .탭.켬{background:none;color:var(--글자);border-bottom:2px solid var(--글자);border-radius:0}

.플롯줄{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--선)}
.플롯줄 .순위{width:22px;flex:0 0 auto;font-size:15px;font-weight:700;color:var(--흐림2);padding-top:2px}
.플롯줄 .그림{width:64px;height:64px;flex:0 0 auto;border-radius:10px;background:var(--바탕3);
  object-fit:cover}
.플롯줄 .속{flex:1;min-width:0}
.플롯줄 .이름{font-size:15px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .한줄{font-size:12px;color:var(--흐림2);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .태그{font-size:11px;color:var(--강조);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .셈{font-size:11px;color:var(--흐림);margin-top:3px}

/* ── 대화 목록 ─────────────────────────────────────── */
.칸제목{padding:14px 14px 8px;font-size:15px;font-weight:700;display:flex;align-items:center;
  justify-content:space-between}
/* ★ 260910 회원님 : 「대화 목록 우상단의 더보기 기능이 없다면 취소선을 그어라.」
   있는 척하는 것보다 없다고 하는 편이 낫다 */
.칸제목 .더{font-size:12px;color:var(--흐림2);font-weight:400;
  text-decoration:line-through;opacity:.55}
.스크랩줄{display:flex;gap:12px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.스크랩줄::-webkit-scrollbar{height:0}
.스크랩{flex:0 0 auto;width:62px;text-align:center}
.스크랩 img{width:62px;height:78px;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.스크랩 .이름{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.방줄{display:flex;gap:12px;padding:11px 14px;align-items:center}
.방줄:active{background:var(--바탕2)}
.방줄 img{width:46px;height:46px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.방줄 .속{flex:1;min-width:0}
.방줄 .이름{font-size:14px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.방줄 .끝말{font-size:12px;color:var(--흐림);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 방 안 ────────────────────────────────────────── */
#대화판{padding:14px 12px 8px;display:flex;flex-direction:column;gap:14px}

/* 유저 — 오른쪽 보라 */
.내말{align-self:flex-end;max-width:78%;background:var(--내말바탕);color:#fff;
  padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
/* ★ 260911 신고 — 「*로 묶어도 내 대화가 회색이탤릭처리가 안됨」

   제타는 **유저 말풍선도 같은 얼개로 가른다.** 짐작이 아니라 실측이다 —
   회원님이 제타에서 치신 유저 조각 1,730개 중 **809개(46.8%)에 별표가 들어 있고**,
   제타 화면을 긁은 글(06_방안.txt)에는 그 별표가 **하나도 안 남아 있다.**
     보낸 것 : `*문을 열러주며*` + 줄바꿈 + `결정했나?`
     화면 글 : `문을 열러주며` / `결정했나?`      ← 별표가 사라졌다 = 갈라서 그렸다

   ★ 대사는 **굵게 하지 않는다.** 인물 말풍선과 다른 자리다 —
     제타 갈무리에서 인물 대사는 굵고(가장 밝은 점 249), 유저 글은 보통 굵기다 */
.내말 .지문{color:var(--지문);font-style:italic;display:block}
.내말 .대사{color:#fff;display:block}
.내말 .지문+.대사,.내말 .대사+.지문{margin-top:5px}

/* 인물 — 왼쪽 회색. 이름줄이 위에 */
.남말{display:flex;gap:9px;max-width:88%}
.남말 .얼굴{width:30px;height:30px;flex:0 0 auto;border-radius:50%;object-fit:cover;
  background:var(--바탕3);margin-top:16px}
.남말 .묶음{flex:1;min-width:0}
.남말 .이름{font-size:12px;color:var(--지문);margin-bottom:4px}   /* 260911 실측 — 흰색 70% */
.방울{background:var(--바탕2);padding:10px 13px;border-radius:16px;position:relative;
  font-size:14px;word-break:break-word}
.방울+.방울{margin-top:6px}
.방울 .모델딱지{position:absolute;right:8px;bottom:4px;font-size:9px;color:#3a3a40}
/* 지문과 대사가 **한 말풍선 안에서** 갈린다 — 제타 실물이 그렇다 */
/* ★ 260911 — 색을 `--흐림2`(이름줄 색) 에서 `--지문`(흰색 70%) 으로 바꿨다.
   제타 갈무리에서 재 보니 지문이 이름줄보다 밝았다. 위 `:root` 주석에 잰 값이 있다 */
.방울 .지문{color:var(--지문);font-style:italic;display:block}
.방울 .대사{color:var(--글자);font-weight:600;display:block}
.방울 .지문+.대사,.방울 .대사+.지문{margin-top:6px}

/* ── 대기 표시 (· · ·) ──────────────────────────────
   ★ 260911 신고 — 「출력대기중엔 ᆞ ᆞ ᆞ 표시가 움직이도록.」
   ★ 260911 신고 총평 — 「제타의 무빙ㆍ모션을 직접 체크하지 않고 만든듯」

   그래서 **짐작하지 않고 제타가 내려받는 CSS 를 그대로 읽었다.**
   (제타 홈을 브라우저로 열어 받아진 자산만 읽었다. API 는 부르지 않았다)

     @keyframes loading-dot-bubble{0%,to{opacity:.5}33.333%,66.667%{opacity:.2}}
     @keyframes loading-dot-plate {0%,to{opacity:.7}33.333%,66.667%{opacity:.3}}
     .animate-loading-dot-bubble{animation:1.5s linear infinite loading-dot-bubble}
     .animate-loading-dot-plate {animation:1.5s linear infinite loading-dot-plate}

   알아낸 것 셋 —
     ① **튀지 않는다.** 위아래로 움직이지 않고 **투명도만** 오르내린다
     ② 1.5초 · linear · 무한
     ③ 두 벌이다. 말풍선 안은 최대 .5, 판 위는 최대 .7 —
        위에서 잰 「흐린 글자」 값(말풍선 70% · 내레이션 60%)과 같은 얼개다

   ★ 어긋나는 시각(딜레이)은 **못 쟀다.** 방 안 화면은 로그인이 있어야 열린다.
     다만 마디가 0% · 33.3% · 66.7% 로 **정확히 셋으로 나뉜 것**은
     점 세 개에 1.5초÷3 = 0.5초씩 어긋나게 준 꼴이다. 그렇게 뒀다.
     ★ 이것만은 잰 값이 아니라 **읽어 낸 것**이다 */
@keyframes 대기점{0%,100%{opacity:.5}33.333%,66.667%{opacity:.2}}
.대기방울{display:inline-flex;align-items:center;gap:5px;min-height:21px}
.대기방울 .점{width:6px;height:6px;border-radius:50%;background:#fff;
  animation:대기점 1.5s linear infinite}
.대기방울 .점:nth-child(2){animation-delay:-.5s}
.대기방울 .점:nth-child(3){animation-delay:-1s}
/* 움직임을 꺼 둔 분에게는 안 움직인다 — 점은 그대로 보인다 */
@media (prefers-reduced-motion:reduce){
  .대기방울 .점{animation:none;opacity:.4}
}

/* 내레이션 — 말풍선 없이 ≡ */
.나레{display:flex;gap:8px;color:var(--나레);font-style:italic;font-size:13px;   /* 260911 실측 — 흰색 60% */
  padding:0 4px;line-height:1.7}
.나레::before{content:"≡";flex:0 0 auto;color:var(--흐림);font-style:normal}

/* 입력 */
#입력칸{flex:0 0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--선);background:var(--바탕)}
#입력줄{display:flex;align-items:flex-end;gap:8px;background:var(--바탕2);
  border-radius:22px;padding:6px 6px 6px 12px}
/* ★ 260911 — **16px 밑이면 iOS 사파리가 화면을 확대한다.**
   글을 치려고 누를 때마다 판이 커졌다 줄었다 해서 쓰기가 나쁘다.
   입력할 수 있는 칸은 전부 16px 로 둔다 */
#입력{flex:1;resize:none;max-height:110px;font-size:16px;padding:6px 0;line-height:1.45}
#입력::placeholder{color:var(--흐림)}
#보내기{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--강조);
  display:grid;place-items:center;font-size:15px}
#보내기[disabled]{background:var(--바탕3);color:var(--흐림)}
#연장{display:flex;gap:14px;padding:6px 16px 2px;color:var(--흐림2);font-size:16px}

/* ── 플롯 정보 ─────────────────────────────────────── */
.플롯그림{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--바탕3)}
.플롯속{padding:16px 14px 90px}
.플롯속 h1{font-size:22px;font-weight:800;margin:0 0 6px}
.플롯속 .한줄{font-size:14px;color:#d5d6da;margin-bottom:8px}
.플롯속 .태그{font-size:13px;color:var(--강조);margin-bottom:10px}
.배지줄{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.배지{font-size:11px;color:var(--흐림2);background:var(--바탕2);padding:4px 9px;border-radius:999px}
.칸{margin-top:20px}
.칸 h2{font-size:15px;font-weight:700;margin:0 0 8px}
.칸 .글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7}
.아래고정{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px
  calc(10px + env(safe-area-inset-bottom));background:var(--바탕);border-top:1px solid var(--선);
  max-width:520px;margin:0 auto}
.아래고정 .북{width:48px;flex:0 0 auto;border-radius:12px;background:var(--바탕2);
  display:grid;place-items:center;font-size:17px}
.아래고정 .큰단추{flex:1;height:48px;border-radius:12px;background:var(--강조);
  font-size:15px;font-weight:700;display:grid;place-items:center}

/* ── 만들기 ───────────────────────────────────────── */
.만들기판{padding:16px 14px}
.빈말{padding:40px 20px;text-align:center;color:var(--흐림);font-size:13px;line-height:1.9}

/* ── 바닥시트 · 덮개 ── */
#덮개{position:fixed;inset:0;background:#000a;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s}
#덮개.보임{opacity:1;pointer-events:auto}
/* ★ 260911 회원님 v1.2 메모 2번 — 「채팅방 메모장/수정창 손잡이 작음.
   키우고, 손잡이를 위에 두자.」

   전에는 `38×4px` 이고 **시트 안쪽 맨 위**에 있었다. 작아서 잡히지도 않았다.
   이제 **시트 바깥 위로 띄우고** 크기를 키웠다 — `64×7px`.
   ★ 미끄러져 내려갈 때 손잡이만 남아 떠 있으면 안 되므로
     감추는 거리를 `101%` 에서 `101% + 34px` 으로 늘렸다. 손잡이까지 같이 내려간다
   ★ 잡는 자리는 눈에 보이는 것보다 훨씬 넓다 — 위아래 22px · 좌우 30px 더 준다 */
#시트{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:520px;margin:0 auto;
  background:var(--바탕2);border-radius:18px 18px 0 0;
  transform:translateY(calc(101% + 34px));
  transition:transform .22s;display:flex;flex-direction:column;
  /* 자판이 올라오면 보이는 높이도 줄어든다. `dvh` 는 그것을 모른다 */
  max-height:calc(var(--보임,100dvh) * .82);
  /* 손잡이가 흐름에서 빠졌으니 맨 위 여백을 시트가 직접 준다 */
  padding-top:10px}
#시트.보임{transform:none}
#시트 .손잡이{position:absolute;top:-26px;left:50%;margin-left:-32px;
  width:64px;height:7px;border-radius:4px;background:rgba(255,255,255,.38);
  cursor:ns-resize;touch-action:none}
#시트 .손잡이:before{content:"";position:absolute;left:-30px;right:-30px;top:-22px;bottom:-22px}
#시트 .시트머리{padding:4px 18px 10px;font-size:15px;font-weight:700}
/* 속만 스크롤되고 아래 단추줄은 늘 보인다 */
#시트 .시트속{overflow-y:auto;flex:1 1 auto;min-height:0;
  padding:0 8px calc(14px + env(safe-area-inset-bottom))}
#시트 .시트단추{flex:0 0 auto}
.시트줄{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;
  font-size:14px;width:100%;text-align:left}
.시트줄:active{background:var(--바탕3)}
.시트줄 .꼭{width:22px;text-align:center;font-size:16px}
.시트줄 .밑{font-size:11px;color:var(--흐림);margin-top:2px}
.시트줄.빨강{color:var(--빨강)}
.시트줄.켬{background:var(--바탕3)}
#시트 textarea{width:100%;background:var(--바탕);border-radius:12px;padding:12px;
  font-size:14px;min-height:120px;resize:vertical;line-height:1.6}
#시트 .시트단추{display:flex;gap:8px;padding:10px 12px}
#시트 .시트단추 button{flex:1;height:44px;border-radius:12px;background:var(--바탕3);
  font-size:14px;font-weight:600}
#시트 .시트단추 button.강{background:var(--강조)}

/* 인물 정보 */
.인물머리{display:flex;gap:12px;padding:4px 12px 14px;align-items:center}
.인물머리 img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--바탕3)}
.인물머리 .이름{font-size:17px;font-weight:700}
.인물머리 .밑{font-size:12px;color:var(--흐림2)}
.인물글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7;padding:0 12px 8px}

/* 눌리는 것 */
.방울{cursor:pointer}
.남말 .얼굴{cursor:pointer}

/* 알림 */
#알림{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;
  background:#000c;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%}
#알림.보임{opacity:1}
</style>
</head>
<body>
<div id="앱">
  <div id="머리자리"></div>
  <div id="몸"></div>
  <div id="입력자리"></div>
  <div id="발"></div>
</div>
<!-- ★ 260910 회원님 : 「모든 창 좌상단에 < 로 뒤로가기 버튼 오버레이 해놔.」
     머리에 있던 ‹ 를 떼고 이 하나로 모았다. 어느 창이든 같은 자리에 있다 -->
<button id="뒤로떠" data-가="뒤로" aria-label="뒤로">‹</button>
<div id="덮개"></div>
<div id="시트"></div>
<style>
#뒤로떠{position:fixed;left:10px;top:10px;z-index:60;width:38px;height:38px;
  border-radius:50%;display:none;place-items:center;font-size:24px;line-height:1;
  padding-bottom:3px;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
#뒤로떠.보임{display:grid}
.방더{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:8px;color:var(--흐림);font-size:18px}
.방더:active{background:var(--바탕3)}
.플롯연필{position:absolute;right:10px;top:10px;z-index:30;width:38px;height:38px;
  border-radius:50%;display:grid;place-items:center;font-size:17px;
  background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
</style>
<div id="알림"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════
   제타앱

   ★ 이 파일 하나가 앱 전부다. 옛 앱과 같은 얼개다.
   ★ 화면은 제타 실물을 찍어 놓고 보고 그렸다.
     그림 — 07. 제타에서 받은 것/4. 화면 그림/
   ══════════════════════════════════════════════════════ */

const S = {              /* 지금 상태 */
  화면: '대화',           /* 홈 · 대화 · 만들기 · 나 */
  방: null,              /* 열려 있는 방 */
  플롯: null,            /* 열려 있는 플롯 */
  보낸중: false
};
const D = {              /* 담아 둔 것 */
  플롯: [], 방: [], 도막: {}, 인기: []
};

/* 줄바꿈.
   ★ 260910 — 이것이 없어서 **중계로 요청이 아예 안 나갔다.**
     `말보내기` 안에서 NL 을 쓰는데 만드는 자리가 없었다. 회원님이 폰에서 치셨는데 무응답이었다.
   ★ 소스에 역빗금을 안 쓴다 — 스크립트로 이 파일을 고칠 때 한 겹 벗겨진다 (G6) */
const NL = String.fromCharCode(10);

const $ = s => document.querySelector(s);
const 몸 = () => $('#몸');
const 알림 = 글 => {
  const e = $('#알림'); e.textContent = 글; e.classList.add('보임');
  clearTimeout(알림._t); 알림._t = setTimeout(() => e.classList.remove('보임'), 1800);
};
const 넣기 = (자리, html) => { $(자리).innerHTML = html; };
const 안전 = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ── 도막 한 조각을 지문/대사로 가른다 ──
   제타 실물 : 지문 65% · 섞임 33% · 대사만 1.9%.
   한 조각 안에 *지문* 과 대사가 섞여 있다. 별표로 가른다 */
function 조각그리기(글){
  const t = String(글 || "");
  if (!t.trim()) return "";
  /* 별표로 자른다. 홀수 자리가 지문이다.
     ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 (G6) */
  const 토막 = t.split("*");
  let 낸것 = "";
  토막.forEach((조각, i) => {
    const x = 조각.trim();
    if (!x) return;
    낸것 += (i % 2 === 1)
      ? '<span class="지문">' + 안전(x) + '</span>'
      : '<span class="대사">' + 안전(x) + '</span>';
  });
  return 낸것 || '<span class="대사">' + 안전(t) + '</span>';
}

/* ══════════════════════════════════════════════════════
   바닥시트 — 제타가 메뉴를 이렇게 띄운다
   ══════════════════════════════════════════════════════ */
/* ★ 260911 — **시트도 온 길을 쌓는다.**
   회원님 v1.2 메모 3번 : 「무조껀 상위가 아님. 내부에서 열린 경로에서는
   내부로 돌아가는 기능도 필요함.」

   시트는 한 자리를 돌려 쓴다(`#시트` 하나에 내용만 갈아 끼운다).
   그래서 방메뉴에서 「모델 고르기」를 열면 **방메뉴가 덮여 사라졌고**,
   뒤로 가면 시트가 통째로 닫혔다. 이제 **덮기 전 것을 쌓아 두고 그리로 돌아간다** */
let 지금시트 = null;          /* {제목, 속} — 지금 떠 있는 것 */
const 시트길 = [];             /* 그 밑에 깔린 것들 */

function 시트그리기(제목, 속){
  const 시 = $("#시트");
  시.innerHTML = '<div class="손잡이"></div>' +
    (제목 ? '<div class="시트머리">' + 안전(제목) + '</div>' : '') +
    '<div class="시트속">' + 속 + '</div>';
  $("#덮개").classList.add("보임");
  시.style.height = ""; 시.style.maxHeight = "";   /* 지난번 늘린 것을 되돌린다 */
  requestAnimationFrame(() => { 시.classList.add("보임"); 손잡이붙이기(); });
}
function 시트열기(제목, 속){
  if (지금시트) 시트길.push(지금시트);
  지금시트 = {제목: 제목, 속: 속};
  시트그리기(제목, 속);
  자리쌓기();
}
/* 시트에서 한 겹만 물러난다. 밑에 깔린 것이 있으면 그것을 도로 띄운다 */
function 시트뒤로(){
  const 앞 = 시트길.pop();
  if (!앞){ 시트닫기(); return; }
  지금시트 = 앞;
  시트그리기(앞.제목, 앞.속);
}
/* Esc · 뒤로 가기로도 닫는다 */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && 시트열렸나()) 시트닫기();
});

/* ★ 260910 회원님 : 「채팅창의 연필모양 눌러 띄우는 팝업창 위에 핸들이 있는데,
   이걸 통해 입력창을 늘릴 수도 있어야 한다.」

   손잡이를 위로 끌면 시트가 커지고 그 안의 입력칸도 함께 커진다 */
/* ★ 260911 — 창(window)에 거는 것은 **딱 한 번만** 건다.
   전에는 시트를 열 때마다 `mousemove`·`touchmove` 를 새로 걸었다.
   시트를 스무 번 열면 스무 벌이 쌓여 손잡이 한 번 끄는 데 스무 번 돈다.
   이번에 시트가 시트를 덮는 길이 생겨 더 자주 열리므로 여기서 잡는다 */
let 잡음 = null;
let 손잡이걸었나 = false;

function 손잡이붙이기(){
  const 시 = $("#시트");
  const 손 = 시 && 시.querySelector(".손잡이");
  if (!손) return;
  잡음 = null;
  const 시작 = e => {
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    잡음 = {y: y, 높이: 시.getBoundingClientRect().height};
    e.preventDefault();
  };
  손.addEventListener("mousedown", 시작);
  손.addEventListener("touchstart", 시작, {passive: false});
  if (손잡이걸었나) return;
  손잡이걸었나 = true;

  const 움직임 = e => {
    if (!잡음) return;
    const 시 = $("#시트");
    if (!시) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    /* ★ 자판이 올라오면 `innerHeight` 는 그대로다. 보이는 높이를 봐야 한다 */
    const 보임 = (window.visualViewport && window.visualViewport.height) || innerHeight;
    const 새높이 = Math.max(180, Math.min(보임 * 0.94, 잡음.높이 + (잡음.y - y)));
    시.style.maxHeight = 새높이 + "px";
    시.style.height = 새높이 + "px";
    /* 안에 입력칸이 있으면 함께 늘린다 */
    const 칸 = 시.querySelector("textarea");
    if (칸) 칸.style.minHeight = Math.max(90, 새높이 - 170) + "px";
    e.preventDefault();
  };
  const 끝 = () => { 잡음 = null; };
  addEventListener("mousemove", 움직임, {passive: false});
  addEventListener("touchmove", 움직임, {passive: false});
  addEventListener("mouseup", 끝);
  addEventListener("touchend", 끝);
}

function 시트열렸나(){
  const 시 = $("#시트");
  return !!(시 && 시.classList.contains("보임"));
}
function 시트닫기(){
  const 시 = $("#시트");
  /* ★ 260911 — 통째로 닫으니 밑에 깔린 것도 함께 버린다 */
  지금시트 = null; 시트길.length = 0;
  시.classList.remove("보임");
  $("#덮개").classList.remove("보임");
  /* ★ 260910 — 닫아도 속이 DOM 에 남아 있었다.
     다음에 무엇을 찾을 때 **닫힌 시트의 것**이 걸려 엉뚱하게 돌았다.
     미끄러져 내려간 뒤에 비운다 */
  시.style.height = ""; 시.style.maxHeight = "";
  setTimeout(() => { if (!시.classList.contains("보임")) 시.innerHTML = ""; }, 260);
}
const 시트줄 = (꼭, 말, 가, 더) =>
  '<button class="시트줄 ' + (더 && 더.빛 ? 더.빛 : "") + '" data-시트="' + 가 + '"' +
  (더 && 더.값 ? ' data-값="' + 안전(더.값) + '"' : "") + '>' +
  '<span class="꼭">' + 꼭 + '</span><span><span>' + 안전(말) + '</span>' +
  (더 && 더.밑 ? '<div class="밑">' + 안전(더.밑) + '</div>' : "") + '</span></button>';

/* ══ 머리 ══ */
function 머리그리기(){
  const 자리 = $('#머리자리');
  if (S.방){
    자리.innerHTML =
      '<div class="머리">' +
        '<div style="width:38px"></div>' +   /* 뒤로는 떠 있는 단추가 맡는다 */
        /* ★ 260911 회원님 : 「채팅방 안에서 채팅방 제목을 누르면
           플롯 정보가 동일하게 떠야한다.」 */
        '<button class="가운데" data-가=플롯보기 style="text-align:left">' +
          안전(S.방.제목) + '</button>' +
        '<button class="단추" data-가=모델 style="font-size:12px;font-weight:600">' +
          안전(고른모델().이름) + ' ˅</button>' +
        '<button class="단추" data-가=방메뉴>☰</button>' +
      '</div>';
    return;
  }
  if (S.플롯){ 자리.innerHTML = ''; return; }   /* 플롯 화면은 그림 위에 얹는다 */
  const 이름 = {홈: '홈', 대화: '대화', 만들기: '만들기', 나: '마이페이지'}[S.화면];
  자리.innerHTML =
    '<div class="머리">' +
      '<div class="제목">' + 이름 + '</div>' +
      '<div style="flex:1"></div>' +
      (S.화면 === '대화' ? '<button class="단추">🔍</button><button class="단추">⚙</button>' : '') +
    '</div>';
}

/* ══ 발 ══ */
function 발그리기(){
  const 것 = [['홈', '🏠', '홈'], ['대화', '💬', '대화'], ['만들기', '⊕', '만들기'], ['나', '👤', '마이페이지']];
  $('#발').innerHTML = 것.map(([키, 꼭지, 말]) =>
    '<button data-화면="' + 키 + '" class="' + (S.화면 === 키 && !S.방 && !S.플롯 ? '켬' : '') + '">' +
      '<span class="꼭지">' + 꼭지 + '</span>' + 말 + '</button>').join('');
  $('#발').classList.toggle('숨김', !!S.방 || !!S.플롯);
}

/* ══ 홈 — 랭킹 ══ */
function 홈그리기(){
  const 것 = D.인기;
  넣기('#몸',
    '<div class="탭줄 맨탭"><button class="탭">홈</button><button class="탭 켬">랭킹</button>' +
      '<button class="탭">글로벌</button></div>' +
    '<div class="탭줄"><button class="탭">트렌딩</button><button class="탭 켬">베스트</button>' +
      '<button class="탭">신작</button></div>' +
    '<div class="탭줄"><button class="탭 켬">남성 인기순</button><button class="탭">전체</button></div>' +
    '<div class="탭줄"><button class="탭">비주얼 노벨</button><button class="탭 켬">일상/로맨스</button>' +

/* ── 맨 아래로 ────────────────────────────────────────
   ★ 260911 신고 — 「유저입력시 입력된 유저말풍선 모두 보이게 최하단으로 스크롤 이동.」

   전에는 `판.scrollTop = 판.scrollHeight` 한 줄이었다. **한 번으로는 모자라다** —
     ⑴ 그 순간엔 아직 줄바꿈이 안 끝나서 `scrollHeight` 가 실제보다 작다
     ⑵ 인물 얼굴 그림이 나중에 떠서 그만큼 아래로 밀린다
     ⑶ 자판이 올라오는 중이면 보이는 높이가 아직 안 줄었다
   그래서 **그린 뒤 · 한 틱 뒤 · 조금 더 뒤** 세 번 내린다. 값이 같으면 아무 일도 안 난다.

   ★ 바닥에 붙어 있을 때만 따라 내려간다 (`억지로` 가 아니면).
     위를 읽고 계신데 끌어내리면 안 된다 */
const 바닥여유 = 80;
function 바닥에붙었나(){
  const 판 = 몸();
  if (!판) return true;
  return (판.scrollHeight - 판.scrollTop - 판.clientHeight) <= 바닥여유;
}
function 맨아래로(억지로){
  const 판 = 몸();
  if (!판) return;
  if (!억지로 && !바닥에붙었나()) return;
  const 내리기 = () => { const p = 몸(); if (p) p.scrollTop = p.scrollHeight; };
  내리기();
  requestAnimationFrame(() => { 내리기(); requestAnimationFrame(내리기); });
  setTimeout(내리기, 120);
  setTimeout(내리기, 320);
}

/* 도막 하나를 그린다.

   ★ 260910 — **`position` 으로 가른다.** 도막이 아니라 **조각마다** 다르다 —
     LEFT      인물     왼쪽 회색 말풍선
     RIGHT     유저     오른쪽 보라 말풍선
     NARRATOR  내레이션  말풍선 없이 ≡
   한 도막 안에 LEFT 와 NARRATOR 가 섞여 온다. 그래서 조각 단위로 돈다 */
/* 말풍선 오른쪽 아래에 붙는 작은 딱지.

   ★ 260911 회원님 v1.2 메모 4번 — 「채팅 말풍선 끝에 zeta 대신 deta라고 붙이길 바람.」

   받아 온 방 서른 개는 모델 칸이 다 `zeta` 다(회원님이 제타 무료 모델을 쓰셨다).
   이제 이 앱은 **데타**다. 그 이름으로 붙인다. 딴 모델은 그 이름 그대로 둔다 */
function 딱지이름(모델){
  const t = String(모델 || "").trim();
  if (!t || t === "zeta") return "deta";
  return t;
}

/* 별표를 벗긴다.
   ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 한 겹 벗겨진다 (Ground rule G6) */
function 별표벗기기(글){
  return String(글 || '').split('*').join('').trim();
}

function 도막그리기(m, 몇){
  const 조각 = (m.contents || []).filter(c => c.type === "TEXT" && c.text);
  if (!조각.length) return "";
  const 낸것 = [];
  let 묶음 = null;              /* 이어지는 LEFT 조각을 한 묶음으로 */
  const 묶음닫기 = () => {
    if (!묶음) return;
    const 얼굴 = 얼굴찾기(묶음.이름);
    낸것.push(
      '<div class="남말">' +
        (얼굴 ? '<img class="얼굴" src="' + 안전(얼굴) + '" loading=lazy data-인물="' + 안전(묶음.이름) + '">'
            : '<div class="얼굴" data-인물="' + 안전(묶음.이름) + '"></div>') +
        '<div class="묶음">' +
          '<div class="이름">' + 안전(묶음.이름) + '</div>' +
          묶음.글.map(t => '<div class="방울" data-도막="' + 몇 + '">' + 조각그리기(t) +
            '<span class="모델딱지">' + 안전(딱지이름(S.방 && S.방.모델)) + '</span></div>').join("") +
        '</div>' +
      '</div>');
    묶음 = null;
  };

  for (const c of 조각){
    const 자리 = c.position || (((m.sender && m.sender.type) === "BOT") ? "LEFT" : "RIGHT");
    if (자리 === "RIGHT"){
      묶음닫기();
      /* ★ 260911 신고 — 「*로 묶어도 내 대화가 회색이탤릭처리가 안됨」
         인물 말풍선만 `조각그리기()` 를 거치고 유저 말풍선은 `안전()` 으로 그냥 넣고 있었다.
         그래서 별표가 글자 그대로 남았다. **같은 얼개를 태운다** */
      낸것.push('<div class="내말" data-도막="' + 몇 + '">' + 조각그리기(c.text) + '</div>');
    } else if (자리 === "NARRATOR"){
      묶음닫기();
      /* 내레이션은 별표를 벗기고 ≡ 로 놓는다 */
      낸것.push('<div class="나레">' + 안전(별표벗기기(c.text)) + '</div>');
    } else {
      const 이름 = c.speakerName || "";
      if (묶음 && 묶음.이름 === 이름) 묶음.글.push(c.text);
      else { 묶음닫기(); 묶음 = {이름, 글: [c.text]}; }
    }
  }
  묶음닫기();
  return 낸것.join("");
}
/* ── 기다리는 동안 (· · ·) ────────────────────────────
   ★ 260911 신고 — 「출력대기중엔 ᆞ ᆞ ᆞ 표시가 움직이도록.」

/* ── 글자가 흐르는 동안 ───────────────────────────────
   ★ 260911 신고 — 「채팅 흐르는 느낌 있우면 좋을듯.」
                  「출력 시작할 때 자동으로 스크롤이 따라붙길 바람.」

   받는 대로 **점 셋이 있던 자리**를 글로 바꿔 나간다.
   그리는 얼개는 `도막그리기()` 그대로다 — 그래야 흐르는 동안 보이는 것과
   다 받은 뒤 보이는 것이 **같다.** 따로 그리면 마지막에 화면이 한 번 덜컥한다.

   ★ 매 조각마다 다시 그리면 폰이 버벅인다. 0.06초에 한 번으로 묶는다
   ★ **바닥에 붙어 계실 때만** 따라 내려간다. 위를 읽고 계시면 가만둔다 */
let 흐름글 = '';
let 흐름예약 = 0;
let 흐름때 = 0;

function 흐름그리기(){
  흐름예약 = 0;
  const e = $('#대기');
  if (!e || !S.방) return;
  const 붙었나 = 바닥에붙었나();      /* ★ 바꾸기 **전에** 재야 한다. 바꾸면 높이가 변한다 */
  const 글 = 흐름글;
  e.innerHTML = 글.trim()
    ? 도막그리기(답을도막으로(글, 유저이름(S.방)), -1)
    : 대기점html();
  흐름때 = Date.now();
  if (붙었나) 맨아래로(true);
}
function 흐름보이기(글){
  흐름글 = 글;
  if (흐름예약) return;
  const 지난 = Date.now() - 흐름때;
  흐름예약 = setTimeout(흐름그리기, 지난 > 60 ? 0 : 60 - 지난);
}

/* 인물 이름으로 얼굴을 찾는다. 방의 플롯에 인물 그림이 들어 있다 */
function 얼굴찾기(이름){
  if (!S.방) return null;
  const p = D.플롯.find(x => x.id === S.방.플롯아이디);
  if (!p) return null;
  const c = (p.characters || []).find(c => c.name === 이름);
  return (c && c.imageUrl) || p.imageUrl || null;
}

/* ══ 플롯 정보 ══ */
function 플롯그리기(){
  const p = S.플롯;
  넣기('#몸',

      '<h1>' + 안전(p.name) + '</h1>' +

      (p.creator ? '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">' +
        '<div style="width:34px;height:34px;border-radius:50%;background:var(--바탕3)"></div>' +

        '<button style="padding:6px 14px;border-radius:999px;background:var(--강조);' +
          'font-size:12px;font-weight:700">팔로우</button></div>' : '') +
      '<div class="배지줄">' +
        '<span class="배지">💬 ' + (p.interactionCount ? 만단위(p.interactionCount) : '—') + '</span>' +
        ((p.lorebooks || []).length ? '<span class="배지">📖 설정집</span>' : '') +
      '</div>' +
      칸그리기('소개', p.longDescription) +
      칸그리기('캐릭터', (p.characters || []).map(c => c.name + '\n' + (c.description || '')).join('\n\n')) +
      칸그리기('인트로', 인트로글(p)) +
    '</div>' +
    '<div class="아래고정">' +
      '<button class="북" data-가=스크랩>' + (스크랩인가(p.id) ? "🔖" : "🏳") + '</button>' +
      '<button class="큰단추" data-가=시작>대화 시작하기</button>' +
    '</div>');
}
const 만단위 = n => n >= 10000 ? (n / 10000).toFixed(1) + '만' : String(n);
const 칸그리기 = (제목, 글) => !글 ? '' :
  '<div class="칸"><h2>' + 제목 + '</h2><div class="글">' + 안전(글) + '</div></div>';
/* **인트로 도막을 앱 꼴로 바꾼다.**

   ★ 260910 — 플롯 서른 개가 전부 인트로가 비어 보였다. 까닭은 **꼴이 다른 것**이었다 —
     대화 도막 : {contents: [{type:"TEXT", text, speakerName, position}]}
     인트로 도막: {type:"text", content:"…", senderType:"BOT", senderId}
   앱은 contents 만 찾아서 늘 빈 값을 냈고, 새 대화도 소개 한 줄로 시작했다.

   senderId 를 characters 와 맞춰 누가 말하는지 되살린다.
   맞는 인물이 없으면 내레이터로 둔다 (제타도 그렇게 그린다) */
function 인트로도막(플롯){
  const 인 = ((플롯 && 플롯.intros) || [])[0];
  const 대화 = 인 && (인.conversation || {});
  const 목 = (대화 && (대화.messages || (Array.isArray(대화) ? 대화 : null))) || [];
  /* ★ 260911 — **인트로 인물이 통째로 내레이터로 떨어지고 있었다.**

     제타 플롯 서른 개를 다 재 보니 `characters` 에 **id 칸이 없다** (name·description·imageUrl 뿐).
     그런데 인트로 도막의 `senderId` 는 `_NARRATOR_` 아니면 UUID 다.
     그래서 이름표가 늘 비었고 — **인물 대사가 전부 내레이터로 깔렸다.**

     폰에서 실제로 눌러 보고 찾았다. 「소꿉친구가 나에게 이상한 선물을 줬다」 방을 새로 여니
     인트로 아홉 도막이 다 ≡ 로 떴고, 그 되먹임을 받아 **새 답도 이름줄 없이 나왔다.**

     ★ 고치는 법 — `_NARRATOR_` 만 내레이터로 본다.
       그 밖의 senderId 는 인물이다. **나온 차례대로** characters 에 맞춘다.
       인물이 하나인 플롯이 대부분이라 이것으로 맞는다.                          */
  const 이름표 = {};
  for (const c of ((플롯 && 플롯.characters) || [])) if (c && c.id) 이름표[c.id] = c.name;
  {
    const 캐 = ((플롯 && 플롯.characters) || []).filter(c => c && c.name);
    const 본것 = [];
    const 목2 = 목;
    for (const m of 목2){
      const sid = m && m.senderId;
      if (!sid || sid === "_NARRATOR_" || m.senderType === "USER") continue;
      if (이름표[sid]) continue;
      if (본것.indexOf(sid) < 0) 본것.push(sid);
    }
    본것.forEach((sid, i) => { if (캐[i] && 캐[i].name) 이름표[sid] = 캐[i].name; });
    /* 인물보다 senderId 가 많으면 나머지는 첫 인물로 — 내레이터로 뭉뚱그리는 것보다 낫다 */
    if (캐.length) for (const sid of 본것) if (!이름표[sid]) 이름표[sid] = 캐[0].name;
  }
  const 때 = new Date().toISOString();
  const 낸것 = [];
  for (const m of 목){
    /* 이미 앱 꼴이면 그대로 쓴다 */
    if (Array.isArray(m.contents)){
      const 조각 = m.contents.filter(c => c.type === "TEXT" && c.text);
      if (조각.length) 낸것.push({sender: {type: "BOT"}, contents: 조각, messageTime: 때});
      continue;
    }
    if (m.type === "image" && m.url){
      낸것.push({sender: {type: "BOT"}, 그림: m.url, contents: [], messageTime: 때});
      continue;
    }
    const 글 = String(m.content || "").trim();
    if (!글) continue;
    const 유저 = (m.senderType === "USER");
    const 이름 = 이름표[m.senderId] || "";
    낸것.push({sender: {type: 유저 ? "USER" : "BOT"},
      contents: [{type: "TEXT",
                  position: 유저 ? "RIGHT" : (이름 ? "LEFT" : "NARRATOR"),
                  speakerName: 유저 ? "" : (이름 || "내레이터"), text: 글}],
      messageTime: 때});
  }
  return 낸것;
}

function 인트로글(p){
  return 인트로도막(p).map(m => (m.contents || [])
    .filter(x => x.type === "TEXT")
    .map(x => (x.speakerName ? x.speakerName + NL : "") + x.text).join(NL))
    .filter(x => x.trim()).join(NL + NL);
}

function 파일로내리기(이름, 글){

};

/* ══ 새 대화 ══
   플롯 정보에서 「대화 시작하기」를 누르면 방을 하나 만든다.
   인트로가 있으면 그것을 첫 도막으로 놓는다 — 제타가 그렇게 한다 */
function 새대화(플롯){
  if (!플롯) return;
  const id = "새-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
  const 프 = 기본프로필();
  const 방 = {id, 제목: 플롯.name, 그림: 플롯.imageUrl, 플롯아이디: 플롯.id,
              프로필아이디: (프 && 프.id) || "",
              모델: "zeta", 끝말: "", 이어하기: [], 새것: true};

  /* 인트로를 첫 도막으로 — ★ 260910 꼴이 달라 여태 비어 있었다 */
  const 도막 = 인트로도막(플롯).filter(m => (m.contents || []).length);
  /* 인트로가 없으면 소개라도 한 줄 놓는다 — 빈 화면으로 시작하면 막막하다 */
  if (!도막.length && (플롯.longDescription || 플롯.shortDescription)){
    도막.push({sender: {type: "BOT"}, contents: [{type: "TEXT", position: "NARRATOR",
      speakerName: "내레이터", text: 플롯.longDescription || 플롯.shortDescription}],
      messageTime: new Date().toISOString()});
  }

  D.방.unshift(방);
  D.도막[id] = 도막;
  /* 이 플롯이 내 목록에 없으면 넣는다 — 인기 플롯에서 시작한 경우 */
  if (!D.플롯.some(p => p.id === 플롯.id)) D.플롯.unshift(플롯);
  새것담기();

  S.플롯 = null; S.방 = 방;
  그리기();
  /* ★ 제타와 같게 — 방에 들어간 뒤 대화 프로필을 고른다.
     제타는 새 방에 들어가면 곧바로 「선택 · 대화 프로필 추가」가 뜬다 */
  setTimeout(() => { if (프로필들().length) 프로필열기(); else 프로필쓰기(null); }, 420);
  알림("새 대화를 시작했습니다");
}

/* 새로 만든 방과 도막을 담아 둔다 — 자료.json 은 못 고치므로 브라우저에 */
function 새것담기(){
  try {
    const 새방 = D.방.filter(r => r.새것);
    const 새도막 = {};
    for (const r of 새방) 새도막[r.id] = D.도막[r.id] || [];
    /* 받아 온 방에서 이어 친 것도 담는다 */
    for (const r of D.방){
      if (r.새것) continue;
      const 처음 = (기본도막수[r.id] || 0);
      const 지금 = (D.도막[r.id] || []).length;
      if (지금 > 처음) 새도막[r.id] = D.도막[r.id];
    }
    localStorage.setItem("새방", JSON.stringify(새방));
    localStorage.setItem("새도막", JSON.stringify(새도막));
  } catch(e){ 알림("담기 실패 — 자리가 모자랍니다"); }
}

/* ★ 260911 — **구글로 직접 플롯을 짓는다.**
   물음은 중계(/plotprompt)가 짜서 돌려준다. 앱에 한 벌 더 두면 한쪽이 낡는다.
   부르는 것만 앱이 한다 — 앱은 회원님 기기에서 도니 한국에서 나간다. */
async function 구글플롯직접(){
  const 열 = 설정("구글키");
  if (!열){
    알림("마이페이지에서 구글 키를 넣어 주십시오");
    S.보낸중 = false; return;
  }
  const 중계 = 중계주소();
  try {
    const p = await fetch(중계 + "/plotprompt", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({})
    });
    if (!p.ok){ 알림("물음을 못 받았습니다 (" + p.status + ")"); S.보낸중 = false; return; }
    const {messages, 자리} = await p.json();

    const r = await fetch(구글주소, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + 열},
      body: JSON.stringify({
        model: 고른모델().모델 || "gemini-3.1-flash-lite",
        messages, temperature: 1.15, max_tokens: 1600
      })
    });
    const j = await r.json();
    if (!r.ok){ 알림((j.error && j.error.message) || ("탈 " + r.status)); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    const pp = 플롯가르기(글, 자리);
    if (!pp){ 알림("못 알아들었습니다"); S.보낸중 = false; return; }

    const 목 = 지은것읽기();
    목.unshift(pp);
    try { localStorage.setItem("지은플롯", JSON.stringify(목.slice(0, 60))); } catch(_){}
    D.플롯.unshift(pp);
    S.플롯 = pp; S.방 = null;
    그리기();
    알림("지었습니다 — " + ((자리 && 자리.갈래) ? 자리.갈래 : ""));
  } catch(e){ 알림("못 지었습니다 — " + String(e.message).slice(0, 30)); }
  S.보낸중 = false;
}

async function 자동생성(){
  const 중계 = 중계주소();

  if (S.보낸중) return;
  S.보낸중 = true;
  알림("짓는 중…");
  try {
    const 어디 = 고른모델().업체;
    /* ★ 260911 두 번째 고침 — **여기에 대화용 분기를 잘못 붙였다.**

       처음에 `if (어디 === "gd") return await 구글직접(재료, 잰것, 방, 도막, 이어가기);`
       를 넣었는데, **이 함수에는 그런 변수가 하나도 없다.** 자동생성은 플롯을 짓는
       함수이고 구글직접은 대화 턴을 굴리는 함수다. 붙일 자리를 잘못 골랐다.
       검사가 `or` 로 돌아 그 줄을 안 타서 못 잡았다 — **회원님이 「(무)google 직접」을
       고른 채 자동생성을 누르면 ReferenceError 로 죽었을 것이다.**

       플롯 짓는 쪽은 따로 둔다. 중계의 /plotprompt 가 물음만 돌려준다 (열쇠 안 씀). */
    if (어디 === "gd") return await 구글플롯직접();
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/plot", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({모델: 고른모델().모델 || undefined})
    });
    const j = await r.json();
    if (j.error){ 알림((j.error && j.error.message) || "탈"); S.보낸중 = false; return; }
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    const p = 플롯가르기(글, j.자리);
    if (!p){ 알림("못 알아들었습니다"); S.보낸중 = false; return; }

    const 목 = 지은것읽기();
    목.unshift(p);
    try { localStorage.setItem("지은플롯", JSON.stringify(목.slice(0, 60))); } catch(_){}
    D.플롯.unshift(p);
    S.플롯 = p; S.방 = null;
    그리기();
    알림("지었습니다 — " + (j.자리 && j.자리.갈래 ? j.자리.갈래 : ""));
  } catch (e){ 알림("못 지었습니다 — " + String(e.message).slice(0, 30)); }
  S.보낸중 = false;
}

/* 지은 글을 플롯 한 벌로 가른다.
   ★ 정규식을 안 쓴다 (G6). 칸 이름은 「이름>>」 꼴이다 */
function 플롯가르기(글, 자리){
  const 줄 = String(글).split(NL);
  const 칸 = {};
  let 지금 = null;
  for (const l of 줄){
    const t = l.trim();
    const i = t.indexOf(">>");
    if (i > 0 && i <= 4){
      지금 = t.slice(0, i).trim();
      칸[지금] = t.slice(i + 2).trim();
      continue;
    }
    if (지금) 칸[지금] = (칸[지금] ? 칸[지금] + NL : "") + l;
  }
  const 이름 = (칸["이름"] || "").trim();
  if (!이름) return null;
  const 인물이름 = ((칸["캐릭터"] || "").split(NL)[0] || "")
    .split("|")[0].split("·")[0].split("(")[0].split(",")[0].trim() || 이름;
  return {
    id: "지은-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
    name: 이름,
    imageUrl: null,
    shortDescription: (칸["한줄"] || "").trim(),
    longDescription: (칸["소개"] || "").trim(),
    hashtags: (칸["태그"] || "").split(",").map(x => x.trim().split("#").join("")).filter(Boolean),
    characters: [{name: 인물이름, description: (칸["캐릭터"] || "").trim(), imageUrl: null}],
    chatProfiles: [],
    intros: [{conversation: {messages: [{contents: [{type: "TEXT", position: "LEFT",
      speakerName: 인물이름, text: (칸["인트로"] || "").trim()}]}]}}],
    lorebooks: [],
    interactionCount: 0,
    지은자리: 자리,
    지은것: true
  };
}

/* 걸린 시간을 보인다.
   회원님 : 「맨날 넌 구글키가 느리지 않다고 하는데, 내가 앱에서 쓰면 느리다.」
   그래서 **앱이 실제로 겪은 시간**을 남겨 보여 드린다 */
function 시간판그리기(){
  const 판 = $("#시간판");
  if (!판) return;
  let 목 = [];
  try { 목 = JSON.parse(localStorage.getItem("시간") || "[]"); } catch(_){}
  if (!목.length){ 판.textContent = "아직 없습니다."; return; }
  const 뒤 = 목.slice(-12).reverse();
  const 값들 = 목.map(x => x.걸림).sort((a, b) => a - b);
  /* ★ 260910 회원님 :
       「월/일 시:분  [방이름 4글자]  or google/gemini~  3.1초  368자
        형태로 출력하되, 글씨가 더 작아져도 좋으니 한줄에 로그 하나씩 찍히도록 해라.」 */
  const 두자리 = n => (n < 10 ? "0" : "") + n;
  const 때글 = t => {
    if (!t) return "  ─  ";
    const d = new Date(t);
    return 두자리(d.getMonth() + 1) + "/" + 두자리(d.getDate()) + " " +
           두자리(d.getHours()) + ":" + 두자리(d.getMinutes());
  };
  /* ★ 260911 — 흘려받은 판은 **첫 글자까지**도 함께 찍는다. 사람이 느끼는 것은 그쪽이다 */
  const 줄들 = 뒤.map(x =>
    안전(때글(x.때)) + "  [" + 안전(String(x.방 || "").slice(0, 4)) + "]  " +
    안전(x.업체) + " " + 안전(String(x.모델).slice(0, 22)) + "  " +
    (x.첫 ? ("첫 " + x.첫 + "초 · ") : "") + x.걸림 + "초  " + x.자수 + "자");
  판.innerHTML =
    '가장 빠름 ' + 값들[0] + '초 · 가운데 ' + 값들[Math.floor(값들.length / 2)] +
    '초 · 가장 느림 ' + 값들[값들.length - 1] + '초  (' + 목.length + '번)' +
    '<div style="margin-top:10px;font-size:11px;line-height:1.9;' +
      'white-space:pre;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace">' +
      줄들.join("<br>") + '</div>';
}

/* ══ 뒤로 가기 ══

   ★ 260910 회원님 : 「취소 누르면 브라우저 꺼짐 말고 뒤로 가거나, 홈까지 돌아가게끔 바꿔.」

   폰에서 뒤로(취소)를 누르면 앱이 그냥 닫혔다. 앱이 자리를 안 쌓아 두었기 때문이다.
   이제 한 단계씩 물러난다 — 시트 → 방·플롯 → 홈. 홈에서 한 번 더 누르면 그때 나간다 */
/* ★ 260911 신고 — 「디바이스 취소버튼 뒤로가기 나가짐(채팅창열자마자누르면.
   다른창들도 체크)」
   ★ 260911 회원님 v1.2 메모 3번 — 「무조껀 상위가 아님.
   내부에서 열린 경로에서는 내부로 돌아가는 기능도 필요함.」

   전에는 **온 길이 없었다.** 「시트 → 방·플롯 → 홈」으로 무조건 한 단계씩 내렸다.
   그래서 마이페이지에서 프로필을 고치다 뒤로 가면 홈으로 떨어졌다.
   방을 열어도 자리를 안 쌓아서, 브라우저 자리가 하나뿐이면 그대로 앱 밖으로 나갔다.

   이제 **지나온 자리를 쌓아 두고 그 길로 되돌아간다.**
     온길      화면·방·플롯 을 옮길 때마다 앞 자리를 쌓는다
     시트길    시트가 시트를 덮을 때 밑에 깔린 것을 쌓는다 (시트열기 쪽)
   되돌아갈 때는 **쌓지 않는다** — `되돌리는중` 이 그것을 막는다 */
const 온길 = [];
let 지금자리 = null;
let 되돌리는중 = false;

function 자리표(){
  return S.방 ? "방:" + S.방.id : S.플롯 ? "플롯:" + S.플롯.id : "화면:" + S.화면;
}
function 자리담기(){ return {표: 자리표(), 화면: S.화면, 방: S.방, 플롯: S.플롯}; }

/* `그리기()` 가 맨 처음 부른다. 자리가 바뀌었으면 앞 자리를 쌓는다 */
function 길살피기(){
  const 이번 = 자리표();
  if (!지금자리 || 이번 === 지금자리.표){ 지금자리 = 자리담기(); return; }
  if (!되돌리는중){
    온길.push(지금자리);
    if (온길.length > 40) 온길.shift();     /* 끝없이 쌓이지 않게 */
    자리쌓기();
  }
  지금자리 = 자리담기();
}

function 뒤로가기(){
  /* ① 시트가 떠 있으면 시트에서 한 겹 */
  if (시트열렸나()){ 시트뒤로(); return true; }
  /* ② 온 길이 있으면 그 길로 */
  const 앞 = 온길.pop();
  if (앞){
    되돌리는중 = true;
    try {
      S.화면 = 앞.화면; S.플롯 = 앞.플롯;
      /* 그 사이 지워졌을 수 있다. 최신 것으로 다시 집는다 */
      S.방 = 앞.방 ? (D.방.find(x => x.id === 앞.방.id) || null) : null;
      그리기();
    } finally { 되돌리는중 = false; }
    return true;
  }
  /* ③ 길이 없으면 옛 규칙대로 한 단계 — 첫 화면이 방·플롯일 때를 위한 것이다 */
  if (S.방 || S.플롯){
    되돌리는중 = true;
    try { S.방 = null; S.플롯 = null; 그리기(); } finally { 되돌리는중 = false; }
    return true;
  }
  if (S.화면 !== "홈"){
    되돌리는중 = true;
    try { S.화면 = "홈"; 그리기(); } finally { 되돌리는중 = false; }
    return true;
  }
  return false;                       /* 더 갈 데가 없다 */
}
function 자리쌓기(){ try { history.pushState({앱: 1}, ""); } catch(_){} }

/* ★ 260910 회원님 : 「가끔 다른 곳을 보고 돌아오면 그 페이지가 과거 데이터일 때가 있다.」

   창을 두고 다른 데를 보다 오면 브라우저가 화면을 얼려 둔 채 되살린다(bfcache).
   그 사이 다른 탭에서 담은 것도 안 보인다. 돌아올 때 **담긴 것을 다시 읽고 그린다** */
function 되살리기(){
  try {
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    for (const k of Object.keys(새도막)){

      const 이미 = (D.도막[k] || []).length;
      if (담긴.length > 이미 - (기본도막수[k] || 0)) {
        D.도막[k] = (D.도막[k] || []).slice(0, 기본도막수[k] || 0).concat(담긴);
      }
    }
    for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
  } catch(_){}
  /* 방 안이면 그 방이 아직 있는지 보고 다시 그린다 */
  if (S.방){ const 있 = D.방.find(x => x.id === S.방.id); if (있) S.방 = 있; }
  그리기();
}

/* 어느 화면을 그리고 있었나 — 화면이 바뀌면 스크롤을 맨 위로 되돌린다 */
let 앞화면 = "";
function 그리기(){
  길살피기();          /* ★ 260911 — 자리가 바뀌었으면 온 길에 쌓는다 */
  머리그리기(); 발그리기();
  /* ★ 260910 회원님 : 「돌아왔다가 또다른 곳을 보면, 스크롤이 아래로 내려간 채로
     시작되어 마치 오류인 것처럼 인지될 때가 있다.」
     #몸 은 하나를 돌려 쓰므로 앞 화면의 스크롤이 남는다. 자리가 바뀌면 되돌린다 */
  const 이번 = (S.방 ? "방:" + S.방.id : S.플롯 ? "플롯:" + S.플롯.id : "화면:" + S.화면);
  if (이번 !== 앞화면){
    앞화면 = 이번;
    const 판 = $("#몸");
    if (판 && !S.방) 판.scrollTop = 0;      /* 방은 아래(최신)로 가야 하니 건드리지 않는다 */
  }
  /* ★ 260911 회원님 : 「최상위 메뉴(홈/대화/만들기/마이페이지)는
     좌상단 < 버튼 필요없다.」
     탭 넷은 아래 바로 오가므로 뒤로 갈 데가 없다. 방·플롯에서만 띄운다 */
  const 떠 = $("#뒤로떠");
  if (떠) 떠.classList.toggle("보임", !!(S.방 || S.플롯));
  $('#입력자리').innerHTML = '';
  if (S.방) return 방그리기();
  if (S.플롯) return 플롯그리기();
  if (S.화면 === '홈') return 홈그리기();
  if (S.화면 === '대화') return 대화그리기();
  if (S.화면 === '만들기') return 만들기그리기();
  return 나그리기();
}

        shift 엔터로 줄바꿈되게 하고, 엔터는 발송되게 하라.」
       「제타앱에서 아무것도 치지 않아도 발송이 되어야 한다.
        이 경우, 유저의 응답 없이 상황을 계속 이어서 진행시키라는 의미이다.」 */
  const 치기 = () => {
    if (S.보낸중) return;

    입.value = ''; 입.style.height = 'auto';

    말보내기(글, undefined, !글);
  };
  보.addEventListener('click', 치기);
  /* 엔터로 보내고 Shift+엔터로 줄을 바꾼다. 폰에서는 자판이 제 일을 하게 둔다 */
  입.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const 폰 = matchMedia("(pointer: coarse)").matches;
    if (폰) return;
    e.preventDefault(); 치기();
  });
}

   최근 둘은 본문까지, 그 앞은 제목만, 더 앞은 몇 개였는지만.
   첫 앱의 fmtEras() 와 같은 얼개다 (ERA_FULL 2 · ERA_TITLES 15).     */
const 마디본문 = 2;      /* 본문까지 싣는 최근 마디 수 */
const 마디제목 = 15;     /* 제목만 싣는 최대 마디 수 */
function 마디글(기억){
  const 마디 = (기억 && 기억.마디) || [];
  if (!마디.length) return String((기억 && 기억.여태) || "");
  const 판 = [];
  const 앞 = 마디.slice(0, Math.max(0, 마디.length - 마디본문));
  const 보일앞 = 앞.slice(-마디제목);
  if (앞.length > 보일앞.length)
    판.push("(그보다 앞선 " + (앞.length - 보일앞.length) + "토막은 제목도 남지 않았다)");
  for (const x of 보일앞) 판.push(x.n + ". " + x.제목);
  for (const x of 마디.slice(-마디본문)) 판.push(x.n + ". " + x.제목 + NL + "  " + x.글);
  return 판.join(NL);
}
function 기억글(기억){
  if (!기억) return "";
  const 판 = [];
  const 마 = 마디글(기억);
  if (마) 판.push(마);
  const 사이 = (기억.사이 || []).filter(x => String(x || "").trim());
  if (사이.length) 판.push("[사이]" + NL + 사이.join(NL + NL));
  const 열린 = (기억.열린것 || []).filter(x => String(x || "").trim());
  if (열린.length) 판.push("[아직 답이 안 난 것]" + NL + 열린.map(x => "- " + x).join(NL));
  const 남길 = (기억.남길것 || []).filter(x => String(x || "").trim());
  if (남길.length) 판.push("[꼭 남길 것]" + NL + 남길.map(x => "- " + x).join(NL));
  return 판.join(NL + NL);
}

/* ══════════════════════════════════════════════════════
   말 보내기

   ★ 시간을 **구간마다** 잰다.
     회원님 : 「맨날 넌 구글키가 느리지 않다고 하는데, 내가 앱에서 쓰면 느리다.」
     스크립트에서 API 를 바로 부른 시간이 아니라 **앱이 실제로 가는 길**을 잰다.
   ══════════════════════════════════════════════════════ */
/* 주소 끝의 빗금을 뗀다.
   ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 (G6) */
function 끝빗금떼기(주소){
  let t = String(주소 || '').trim();
  while (t.length && t[t.length - 1] === '/') t = t.slice(0, -1);
  return t;
}

/* 이어가기 = true 면 회원님이 아무것도 안 치고 보낸 것이다.
   유저 도막을 만들지 않고, 모델에게 **그냥 이어 가라**고만 알린다 */
/* ── 흘려받기 ─────────────────────────────────────────
   ★ 260911 신고 — 「채팅 흐르는 느낌 있우면 좋을듯.」

   업체들이 다 같은 꼴로 흘려보낸다 (SSE) —
     data: {"choices":[{"delta":{"content":"글"}}]}
     data: [DONE]
   빈 줄로 덩이가 갈리고, 콜론으로 시작하는 줄은 주석이다(오픈라우터가 보낸다).

   ★ **덩이가 반쪽으로 끊겨 온다.** 그물이 나누는 자리는 글자 경계와 상관없다.
     그래서 마지막 줄은 늘 남겨 두었다가 다음 덩이와 이어 붙인다.
     이걸 안 하면 한글이 깨지고 JSON 이 쪼개진다
   ★ `TextDecoder` 에 `{stream:true}` 를 주는 것도 같은 까닭이다 —
     한글 한 글자가 세 바이트라 덩이 경계에서 쪼개진다

   돌려주는 것 —
     {흘렀나:true,  글, 첫글자, 답}    흘러왔다
     {흘렀나:false, 답}                안 흘렀다 — 부른 쪽이 옛 길로 되돌아간다 */
async function 흘려받기(주소, 머리, 본문, 닿을때){
  const r = await fetch(주소, {method: "POST", headers: 머리, body: 본문});
  const 결 = String(r.headers.get("Content-Type") || "");
  if (!r.ok || 결.indexOf("event-stream") < 0 || !r.body) return {흘렀나: false, 답: r};

  const 읽개 = r.body.getReader();
  const 풀개 = new TextDecoder("utf-8");
  let 남은 = "", 글 = "", 첫글자 = 0;

  for (;;){
    const 온것 = await 읽개.read();
    if (온것.done) break;
    남은 += 풀개.decode(온것.value, {stream: true});
    const 줄들 = 남은.split(NL);
    남은 = 줄들.pop();                 /* 마지막 줄은 아직 덜 왔을 수 있다 */
    for (const 줄 of 줄들){
      const t = 줄.trim();
      if (!t || t.charAt(0) === ":") continue;         /* 빈 줄 · 주석 */
      if (t.indexOf("data:") !== 0) continue;
      const 속 = t.slice(5).trim();
      if (!속 || 속 === "[DONE]") continue;
      let j;
      try { j = JSON.parse(속); } catch(_){ continue; }
      const d = (((j.choices || [])[0] || {}).delta) || {};
      const c = d.content;
      if (typeof c === "string" && c){
        if (!첫글자) 첫글자 = Date.now();
        글 += c;
        if (닿을때) 닿을때(글);
      }
    }
  }
  return {흘렀나: true, 글: 글, 첫글자: 첫글자, 답: r};
}

async function 말보내기(친말, 주문, 이어가기){
  const 중계 = 중계주소();

  if (S.보낸중) return;
  S.보낸중 = true;

  const 방 = S.방;
  const 플롯 = D.플롯.find(x => x.id === 방.플롯아이디) || {};
  const 기억 = 기억읽기(방.id);
  const 도막 = D.도막[방.id] || [];

  /* 내가 친 말을 먼저 화면에 놓는다 — 기다리는 동안 빈 화면이면 답답하다.
     ★ 빈 채로 보냈으면(이어가기) 유저 도막을 만들지 않는다. 화면에 빈 말풍선이 뜨면 안 된다 */
  if (!이어가기){
    도막.push({sender: {type: "USER"}, contents: [{type: "TEXT", position: "RIGHT", text: 친말}],
               messageTime: new Date().toISOString()});
  }
  방그리기();
  /* ★ 260911 — 기다리는 동안 화면이 죽어 있지 않게 점 셋을 놓는다.
     신고 : 「출력대기중엔 ᆞ ᆞ ᆞ 표시가 움직이도록.」
     ★ 그리고 **맨 아래로 내린다** — 방금 친 말풍선이 통째로 보여야 한다 */
  대기붙이기();

  /* 재료만 보낸다. 프롬프트는 중계가 짠다 */
  /* **이 방에서 본보기를 뽑는다.**

     ★ 260910 — 방마다 결이 크게 다르다. 제타 실측으로 한 묶음이 44자~257자,
       여섯 배까지 벌어진다. 중계에 박아 둔 본보기는 여러 방에서 뽑은 것이라
       그 방과 어긋날 수 있고, 그러면 앞 도막이 가르치는 것과 서로 부딪힌다.

     그래서 **그 방의 앞부분**에서 (친 말, 답) 쌍을 골라 보낸다.
     ★ 최근 것은 안 쓴다 — 그건 이미 도막으로 들어가므로 겹친다.
     ★ 자동생성한 새 플롯처럼 도막이 적으면 안 보낸다. 중계 것이 쓰인다 */
  function 방본보기(방, 몇){
    const 다 = 도막.slice(0, Math.max(0, 도막.length - 24));
    const 것 = [];
    for (let i = 1; i < 다.length; i++){
      const 앞 = 다[i - 1], 이 = 다[i];
      if (((앞.sender && 앞.sender.type) === "BOT")) continue;
      if (((이.sender && 이.sender.type) !== "BOT")) continue;
      const 준 = (앞.contents || []).filter(c => c.type === "TEXT")
        .map(c => c.text).join(NL).trim();
      const 답 = 보낼글(이).trim();
      /* ★ 260910 — **거르는 조건이 그 방 결을 왜곡한다.**

         심다은 방 실측 —
           그 방 전체    묶음 43자 · 40자↓ 49% · 한 턴의 묶음 7
           걸러낸 뒤     묶음 71자 · 40자↓ 27% · 한 턴의 묶음 5
           뽑은 본보기   묶음 80자 · 40자↓ 20% · 한 턴의 묶음 5

         짧은 답을 버리면 **잘게 끊는 결**이 통째로 빠진다.
         그래서 거르는 것은 **쓸 수 없는 것만** — 빈 것과 터무니없이 긴 것 */
      if (준.length < 2 || 준.length > 150) continue;
      if (답.length < 20 || 답.length > 2000) continue;
      것.push({준, 답});
    }
    if (것.length < 3) return null;
    /* 고루 퍼지게 집는다 — 앞쪽만 쓰면 그 대목 결만 배운다.

       ★ 260910 — 길이로 줄 세워 집는 것도 해 봤으나 판 흔들림에 묻혔다
         (짧은묶음 38.0% ↔ 15.2%). 회원님 —
         「세차례 수정해도 안잡히는건 그 안에서 최선의 선택을 한 뒤에 넘어가라.
          수치로만 줄이려고 하면 끝이 없다.」
         그래서 실측이 가장 좋았던 **시간 순 고루 집기**로 둔다.
         ★ 앱과 잣대(zt_여러턴.js)가 **같은 법**이어야 한다 */
    /* ★ 260910 — **이어 쓰는 자리 가까이에서 집는다.**

       방 안에서도 앞뒤가 다르다 (심다은 방 실측) —
         앞부분  묶음 71자 · 40자↓ 26% · 한 턴의 묶음 5
         뒷부분  묶음 31자 · 40자↓ 60% · 한 턴의 묶음 8

       우리는 **뒷부분에서 이어 쓰는데 본보기는 앞부분에서 뽑고** 있었다.
       그래서 뒤쪽 절반에서 고루 집는다 */
    const 뒤쪽 = 것.slice(Math.floor(것.length / 2));
    const 밑감 = 뒤쪽.length >= 몇 ? 뒤쪽 : 것;
    const 낸것 = [];
    const 걸음 = 밑감.length / 몇;
    for (let k = 0; k < 몇; k++) 낸것.push(밑감[Math.floor(k * 걸음)]);
    return 낸것;
  }

  /* 도막 하나를 이름줄이 붙은 글로. 화면에 그리는 것과 같은 얼개다 */
  function 보낼글(m){
    const 조각 = (m.contents || []).filter(c => c.type === "TEXT" && c.text);
    const 낸것 = []; let 앞 = null;
    for (const c of 조각){
      const 이름 = c.position === "NARRATOR" ? "내레이터" : (c.speakerName || "");
      if (이름 && 이름 !== 앞){ 낸것.push((낸것.length ? NL : "") + 이름); 앞 = 이름; }
      낸것.push(c.text);
    }
    return 낸것.join(NL);
  }

  const 재료 = {
    모델: 고른모델().모델 || undefined,
    인물: (플롯.characters || [])[0] || {name: 방.제목},
    /* ★ 회원님이 적으신 대화 프로필이 매 턴 「나」로 들어간다 */
    나: (() => { const p = 방프로필(방, 플롯);
                 return {name: p.이름, description: p.설명 || ""}; })(),
    소개: 플롯.longDescription || 플롯.shortDescription || "",
    설정집: (플롯.lorebooks || []).map(l => l.description).join(NL).slice(0, 4000),
    기억: 기억글(기억),
    /* 최근 것만 보낸다. 앞엣것은 **기억**이 든다 — 그것이 장기기억의 값이다 */
    /* ★ 260910 — **이름줄을 붙여 싣는다.**
       전에는 글자만 이어 붙여 보냈다. 그러면 누가 말했는지가 사라져서
       모델이 앞 대화에서 묶음도 내레이터도 못 배운다. 되먹임이 본보기를 이긴다.
       실측 — 한 묶음이 259자로 뭉쳤다. 제타는 68자다 */
    /* ★ 260911 — **24 → 14 로 줄였다.**

       잰 값 : 프롬프트 9,970자 중 대화 원문이 6,607자(66.3%)였다.
       플롯은 3.7%, 유저는 0.6% 다. 그래서 **플롯을 바꿔도 인물이 안 갈렸다.**
       그리고 기운 흐름의 관성이 66% 로 되먹혀 들어왔다.

       ★ 연속성을 잃지 않으려고 **요약을 더 자주 돌린다** (아래 요약주기 6 → 4).
         미요약 구간이 최대 8 도막이므로 14 도막 안에 들어온다.                */
    /* ★ 260911 — **유저 도막에서 이름줄을 뗀다.**

       제타에서 받은 방은 유저 도막에도 speakerName 이 붙어 있다.
       그대로 보내면 되먹임이 「준」 이름줄을 계속 가르치는데,
       꼴 규칙은 「{{user}}는 이름줄에 놓지 않는다」다. **규칙과 되먹임이 어긋난다.**
       데타에서 새로 만든 도막에는 이름이 없으니 같은 꼴로 맞춘다.                 */
    도막들: 도막.slice(-14).map(m => {
      const 봇 = ((m.sender && m.sender.type) === "BOT");
      let 글 = 보낼글(m);
      if (!봇){
        const 나이름 = 방프로필(방, 플롯).이름;
        if (나이름) 글 = 글.split(NL).filter(l => l.trim() !== 나이름).join(NL).trim();
      }
      return {봇, 글};
    }),
    /* ★ 그 방에서 뽑은 본보기. 없으면 중계에 박힌 것이 쓰인다 */
    본보기: 방본보기(방, 14) || undefined,
    /* ★ 아무것도 안 치고 보내면 **이어 가라**는 뜻이다 (260910 회원님).
       빈 문자열을 그대로 보내면 모델이 헛도므로 그 뜻을 한 줄로 적는다.
       ★ 「무엇을 하라」고 박지 않는다 — 방향만 준다 (G2) */
    친말: 주문 ? (친말 + NL + NL + "[이렇게 다시 써라 — " + 주문 + "]")
          : (이어가기 ? "[나는 아직 아무 말도 하지 않았다. 장면을 이어 가라.]" : 친말)
  };

  const 잰것 = {보냄: Date.now()};
  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const 머리 = {"Content-Type": "application/json",
                  ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})};
    const 본문 = JSON.stringify(재료);

    /* ★ 260911 — **흘려받기를 먼저 해 본다.**
       중계에 `/turn-stream` 이 아직 없으면(안 올린 판) 404 가 온다.
       그때는 **옛 길 `/turn` 으로 되돌아간다.** 그래서 앱을 먼저 구워도 안 깨진다.
       회원님 지시 : 「옛 길(/turn)을 남기고 /turn-stream을 새로 더하게 하라.」 */
    let 흐름 = null;
    try {
      흐름 = await 흘려받기(중계 + "/" + 어디 + "/turn-stream", 머리, 본문, 흐름보이기);
    } catch(_){ 흐름 = null; }        /* 흐르다 끊겼다 — 아래에서 옛 길로 다시 한다 */

    let r, 글;
    if (흐름 && 흐름.흘렀나){
      r = 흐름.답;
      글 = 흐름.글;
      잰것.첫글자 = 흐름.첫글자 || Date.now();
      잰것.다받음 = Date.now();
    } else {
      /* 옛 길 — 전문을 한 번에 받는다 */
      r = (흐름 && 흐름.답 && 흐름.답.status !== 404) ? 흐름.답
        : await fetch(중계 + "/" + 어디 + "/turn", {method: "POST", headers: 머리, body: 본문});
      const j = await r.json().catch(() => ({}));
      잰것.첫글자 = Date.now();
      잰것.다받음 = Date.now();
      if (!r.ok){ 대기떼기(); 알림((j.error && j.error.message) || ("탈 " + r.status)); S.보낸중 = false; return; }
      글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    }

    if (!r.ok){ 대기떼기(); 알림("탈 " + r.status); S.보낸중 = false; return; }
    if (!글){ 대기떼기(); 알림("빈 답이 왔습니다"); S.보낸중 = false; return; }

    도막.push(답을도막으로(글, 유저이름(방)));
    D.도막[방.id] = 도막;
    새것담기();
    방그리기();

    /* 시간을 남긴다 — 나중에 회원님께 숫자로 보여 드린다.

       ★ 260911 — **첫 글자까지와 다 뜨기까지를 따로 잰다** (실행계획 2.4).
         전에는 `첫글자` 라는 이름만 붙여 놓고 실제로는 **머리글이 온 때**를 재고 있었다.
         흘려받으면 진짜 첫 글자가 언제 왔는지 알 수 있다.
         사람이 느끼는 것은 앞쪽이다 */
    const 걸림 = ((잰것.다받음 - 잰것.보냄) / 1000).toFixed(1);
    const 첫 = 잰것.첫글자 ? ((잰것.첫글자 - 잰것.보냄) / 1000).toFixed(1) : 0;
    const 중계잰것 = r.headers.get("X-Ttfb");
    시간남기기({때: Date.now(), 걸림: Number(걸림), 첫: Number(첫),
                흘림: !!(흐름 && 흐름.흘렀나), 중계: Number(중계잰것 || 0),
                업체: 어디, 모델: 재료.모델 || "(기본)", 자수: 글.length,
                방: (방 && 방.제목) || ""});
    알림((흐름 && 흐름.흘렀나) ? ("첫 글자 " + 첫 + "초 · 다 " + 걸림 + "초") : (걸림 + "초"));
    /* ★ 답을 받은 뒤에 조용히 돌린다. 대화를 안 막는다 */
    요약해두기(방.id);
  } catch (e){
    알림("못 보냈습니다 — " + String(e.message).slice(0, 40));
  }
  /* ★ 260911 — 어느 길로 끝나든 점 셋을 반드시 뗀다.
     성공하면 `방그리기()` 가 통째로 다시 그려 저절로 사라지지만,
     탈이 나 되돌아가는 길에서는 그것이 안 돈다. 그대로 두면 영영 점만 깜빡인다 */
  대기떼기();
  S.보낸중 = false;
}

/* ══════════════════════════════════════════════════════
   요약기 — **장기기억을 저절로 채운다. 제타에 없는 것**

   ★ 몇 턴에 한 번만 돈다. 매 턴 돌면 값이 두 배가 된다.
     옛 프로젝트 실측 — 한 바퀴에 한 번 돌면 부름이 안 는다 ($0.0007).

   ★ **어느 칸에 넣을지 · 언제 지울지는 모델이 정한다.** 앱은 나르기만 한다.
     회원님 : 「앱은 정말 0 or 1 정도의 기능밖에 못하며, 그런 용도로만 써야한다」
   ══════════════════════════════════════════════════════ */
const 요약주기 = 4;          /* ★ 260911 — 대화 원문을 14 도막으로 줄인 만큼 더 자주 돈다 */

async function 요약해두기(방아이디){
  const 중계 = 중계주소();
  if (!중계) return;
  const 기 = 기억읽기(방아이디);
  const 도막 = D.도막[방아이디] || [];
  const 여기까지 = 도막.length;
  const 아직 = 여기까지 - (기.요약한데까지 < 0 ? 0 : 기.요약한데까지);
  if (아직 < 요약주기 * 2) return;              /* 아직 모자라다 */

  /* 요약할 토막 — 지난번 이후 것만 */
  const 밑 = 기.요약한데까지 < 0 ? 0 : 기.요약한데까지;
  const 새것 = 도막.slice(밑).map(m =>
    (m.contents || []).filter(c => c.type === "TEXT")
      .map(c => (c.speakerName ? c.speakerName + ": " : "") + c.text).join(NL)).join(NL + NL);
  if (!새것.trim()) return;

  try {
    const 어디 = 고른모델().업체;
    const 초대 = 설정("초대");
    const r = await fetch(중계 + "/" + 어디 + "/summary", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({
        모델: 고른모델().모델 || undefined,
        /* ★ 앞선 마디 제목들 — 같은 제목을 또 짓지 않게 */
        앞제목: (기.마디 || []).map(x => x.n + ". " + x.제목).join(NL),
        /* 바로 앞 마디 본문만 보낸다. 전부 보내면 다시 무한히 자란다 */
        여태: (기.마디 || []).length ? 기.마디[기.마디.length - 1].글 : (기.여태 || ""),
        사이: (기.사이 || []).join(NL),
        열린것: (기.열린것 || []).join(NL), 남길것: (기.남길것 || []).join(NL),
        새것
      })
    });
    const j = await r.json();
    const 글 = (((j.choices || [])[0] || {}).message || {}).content || "";
    if (!글) return;
    const 갈린것 = 요약가르기(글);
    /* ★ 260911 — **마디로 쌓는다. 여태에 이어 붙이지 않는다.**
       전에는 여태가 계속 자라 500턴이면 터졌다 (회원님 지적).
       첫 앱이 이미 이렇게 풀어 두었다 — 마디마다 제목을 달고,
       오래된 것은 제목만 싣는다. 「놀이터 사건」의 인덱스 구조다 */
    기.마디 = 기.마디 || [];
    if (갈린것.여태){
      기.마디.push({
        n: 기.마디.length + 1,
        부터: 밑, 까지: 여기까지,
        제목: 갈린것.제목 || ("토막 " + (기.마디.length + 1)),
        글: 갈린것.여태
      });
    }
    /* 옛 자료 호환 — 여태만 있던 방은 그것을 0번 마디로 삼는다 */
    기.여태 = "";
    기.사이 = 갈린것.사이 ? [갈린것.사이] : 기.사이;
    기.열린것 = 갈린것.열린것;
    기.남길것 = 갈린것.남길것;
    기.요약한데까지 = 여기까지;
    기억쓰기(기);
    알림("기억을 갈무리했습니다");
  } catch(_){ /* 조용히 넘어간다 — 대화를 막으면 안 된다 */ }
}

/* 요약을 네 칸으로 가른다.
   ★ 정규식을 안 쓴다 (G6) */
function 요약가르기(글){
  const 낸것 = {제목: "", 여태: "", 사이: "", 열린것: [], 남길것: []};
  let 지금 = null;
  for (const 줄 of String(글).split(NL)){
    const t = 줄.trim();
    if (t === "[제목]"){ 지금 = "제목"; continue; }
    if (t === "[여태]"){ 지금 = "여태"; continue; }
    if (t === "[사이]"){ 지금 = "사이"; continue; }
    if (t === "[열린것]"){ 지금 = "열린것"; continue; }
    if (t === "[남길것]"){ 지금 = "남길것"; continue; }
    if (!지금 || !t || t === "…") continue;
    if (지금 === "제목"){ if (!낸것.제목) 낸것.제목 = t.slice(0, 40); continue; }
    if (지금 === "여태" || 지금 === "사이")
      낸것[지금] = (낸것[지금] ? 낸것[지금] + NL : "") + t;
    else {
      const x = (t.indexOf("- ") === 0) ? t.slice(2).trim() : t;
      if (x && x !== "…") 낸것[지금].push(x);
    }
  }
  return 낸것;
}

/* 모델이 낸 글을 화면이 그릴 꼴로 바꾼다.
   제타 꼴 — 이름 한 줄 · 그 아래 지문과 대사. 빈 줄로 조각을 나눈다 */
/* 답을 도막으로 가른다.

   ★ 260910 — 전에는 **빈 줄로만** 잘랐다. 그러면 이름줄 뒤에 빈 줄이 오는 답에서
     이름이 이름으로 안 잡히고 **본문으로 그려졌다** —
       수빈
       (빈 줄)
       *남자친구. 있었냐고.*
     화면에 「수빈」이라는 말풍선이 따로 떴다.

   이제 **이름줄을 만나면** 자리를 바꾸고, 이름줄이 없는 덩이는 **앞 이름을 이어받는다.**
   제타 원본이 그렇게 생겼다 (contents 여럿 · speakerName 이 같으면 한 묶음으로 그린다) */
/* **이 방에서 회원님(유저)의 이름.**
   플롯의 대화 프로필에서, 없으면 그 방 도막의 RIGHT 조각에서 찾는다 */
function 유저이름(방){
  const 것 = [];
  const 플 = (D.플롯 || []).find(x => x && 방 && x.id === 방.플롯아이디);
  for (const p of ((플 && 플.chatProfiles) || [])) if (p && p.name) 것.push(p.name);
  for (const m of ((D.도막 || {})[(방 && 방.id)] || []))
    for (const c of (m.contents || []))
      if (c.position === "RIGHT" && c.speakerName && 것.indexOf(c.speakerName) < 0)
        것.push(c.speakerName);
  return 것.filter(x => x && x !== "나");
}

function 이름줄인가(t){
  if (!t || t.length > 14) return false;
  for (const c of [".", ",", "!", "?", "…", String.fromCharCode(34), "*", ">", "("])
    if (t.indexOf(c) >= 0) return false;
  return true;
}
function 답을도막으로(글, 유저들){
  const 조각 = [];
  let 이름 = "";
  for (const 덩이 of String(글).split(NL + NL)){
    let 줄 = 덩이.split(NL).map(x => x.trim()).filter(Boolean);
    if (!줄.length) continue;
    /* 이름줄로 시작하면 자리를 바꾼다. 그 줄만 있어도 마찬가지다 */
    while (줄.length && 이름줄인가(줄[0])){ 이름 = 줄[0]; 줄 = 줄.slice(1); }
    if (!줄.length) continue;        /* 이름만 있던 덩이 — 다음 덩이가 그 이름을 쓴다 */
    /* ★ 260910 【축 B】 — **{{user}} 이름줄은 내레이터로 받는다.**

       회원님이 당신 인물을 3인칭으로 서술하고 반응을 비워 두시면
       (「*준은 자신의 손에 묻은 액체를 보며 물음표를 띄우고 있었다.*」)
       모델이 그 빈칸을 「준」 이름줄로 채웠다. 실측 3.7%, 제타는 0.0% 다.

       제타는 같은 자리에서 **내레이터로 받는다** —
         내레이터
         *준은 자기 손바닥을 내려다보고 있었다.*
         *축축했다.*

       내용은 비슷한데 **꼴만 달랐다.** 그래서 그리는 자리에서 바로잡는다.
       회원님이 안 하신 말이 회원님 인물의 말풍선으로 뜨면 밀당이 깨진다 */
    const 유저인가 = 이름 && (유저들 || []).indexOf(이름) >= 0;
    조각.push({type: "TEXT",
               position: (이름 === "내레이터" || 유저인가) ? "NARRATOR" : "LEFT",
               speakerName: 유저인가 ? "내레이터" : 이름, text: 줄.join(NL)});
  }
  return {sender: {type: "BOT"}, contents: 조각, messageTime: new Date().toISOString()};
}

/* 시간 기록 — 회원님께 「느리다」를 숫자로 답하기 위한 것 */
function 시간남기기(한줄){
  try {
    const 목 = JSON.parse(localStorage.getItem("시간") || "[]");
    목.push(한줄);
    localStorage.setItem("시간", JSON.stringify(목.slice(-200)));
  } catch(_){}
}

/* ══════════════════════════════════════════════════════
   상호작용 — 제타 실물을 보고 만든 것

     프사 누르기      인물 정보
     말풍선 누르기    편집 · 다시 · 지우기
     하단 넷         신고 · 편집 · 주문해서 다시 · 다시
     방 메뉴         새로하기 · 이어하기 · 대화 프로필 · 모델 · 지우기
   ══════════════════════════════════════════════════════ */

/* 지금 방의 플롯 */
function 지금플롯(){
  if (!S.방) return null;
  return D.플롯.find(x => x.id === S.방.플롯아이디) ||
         D.인기.find(x => x.id === S.방.플롯아이디) || null;
}

/* ── 인물 정보 ── */
function 인물열기(이름){
  const p = 지금플롯();
  if (!p) return 알림("인물을 못 찾았습니다");
  const c = (p.characters || []).find(x => x.name === 이름) || (p.characters || [])[0];
  if (!c) return 알림("인물 정보가 없습니다");
  const 그림 = c.imageUrl || p.imageUrl;
  시트열기(null,
    '<div class="인물머리">' +
      (그림 ? '<img src="' + 안전(그림) + '">' : '<div style="width:56px;height:56px;border-radius:50%;background:var(--바탕3)"></div>') +
      '<div><div class="이름">' + 안전(c.name) + '</div>' +
      '<div class="밑">' + 안전(p.name) + '</div></div>' +
    '</div>' +
    '<div class="인물글">' + 안전(c.description || "(설명 없음)") + '</div>' +
    (p.longDescription ? '<div class="시트머리">상황</div><div class="인물글">' +
      안전(p.longDescription) + '</div>' : ""));
}

/* ── 말풍선 메뉴 ── */
function 도막메뉴(몇){
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];
  if (!m) return;
  const 봇 = ((m.sender && m.sender.type) === "BOT");
  const 마지막 = (몇 === 도막.length - 1);
  시트열기("이 말",
    시트줄("✏", "고쳐 쓰기", "편집", {값: 몇}) +
    (봇 && 마지막 ? 시트줄("↺", "다시 쓰게 하기", "재실행", {값: 몇}) : "") +
    (봇 && 마지막 ? 시트줄("🪄", "주문해서 다시", "주문", {값: 몇}) : "") +
    시트줄("⧉", "글 복사", "복사", {값: 몇}) +
    시트줄("📝", "메모장에 담기", "메모", {값: 몇, 밑: "이 턴과 내가 친 말을 이어 적습니다"}) +
    시트줄("🗑", "여기부터 지우기", "지우기", {값: 몇, 빛: "빨강"}));
}

/* 도막을 글로 (편집·복사에 쓴다) */
function 도막글꺼내기(m){
  return (m.contents || []).filter(c => c.type === "TEXT")
    .map(c => (c.speakerName && c.position !== "RIGHT" ? c.speakerName + NL : "") + c.text)
    .join(NL + NL);
}

/* ── 고쳐 쓰기 ── */
function 편집열기(몇){
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];
  if (!m) return;
  시트열기("고쳐 쓰기",
    '<div style="padding:0 12px"><textarea id="편집칸">' + 안전(도막글꺼내기(m)) + '</textarea></div>' +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
    '<button class="강" data-시트=편집저장 data-값="' + 몇 + '">고침</button></div>');
  setTimeout(() => { const t = $("#편집칸"); if (t) t.focus(); }, 260);
}
function 편집저장(몇){
  const t = $("#편집칸");
  if (!t) return;
  const 도막 = D.도막[S.방.id] || [];
  const m = 도막[몇];
  if (!m) return;
  const 봇 = ((m.sender && m.sender.type) === "BOT");
  도막[몇] = 봇 ? 답을도막으로(t.value, 유저이름(S.방))
                : {sender: {type: "USER"},
                   contents: [{type: "TEXT", position: "RIGHT", text: t.value}],
                   messageTime: m.messageTime};
  D.도막[S.방.id] = 도막;
  새것담기(); 시트닫기(); 방그리기();
  알림("고쳤습니다");
}

/* ── 다시 쓰게 하기 ── */
async function 재실행(몇, 주문){
  const 도막 = D.도막[S.방.id] || [];
  /* 마지막 봇 도막을 걷어내고, 그 앞의 내 말로 다시 친다 */
  let i = 몇 === undefined ? 도막.length - 1 : 몇;
  while (i >= 0 && ((도막[i].sender && 도막[i].sender.type) !== "BOT")) i--;
  if (i < 0) return 알림("다시 쓸 것이 없습니다");
  const 지운것 = 도막.splice(i);
  /* 그 앞의 내 말을 찾는다 */
  let j = i - 1;
  while (j >= 0 && ((도막[j].sender && 도막[j].sender.type) === "BOT")) j--;
  const 친말 = j >= 0 ? (도막[j].contents || []).filter(c => c.type === "TEXT")
    .map(c => c.text).join(NL) : "";
  if (j >= 0) 도막.splice(j);
  D.도막[S.방.id] = 도막;
  방그리기();
  await 말보내기(친말 || "…", 주문);
}

/* ── 주문해서 다시 ── */
function 주문열기(몇){
  시트열기("어떻게 다시 쓸까요",
    '<div style="padding:0 12px"><textarea id="주문칸" ' +
    'placeholder="보기) 더 짧게 · 더 차갑게 · 다른 인물도 끼워서"></textarea></div>' +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
    '<button class="강" data-시트=주문보내기 data-값="' + (몇 === undefined ? "" : 몇) + '">다시</button></div>');
  setTimeout(() => { const t = $("#주문칸"); if (t) t.focus(); }, 260);
}

/* ── 여기부터 지우기 ── */
function 여기부터지우기(몇){
  const 도막 = D.도막[S.방.id] || [];
  도막.splice(몇);
  D.도막[S.방.id] = 도막;
  새것담기(); 시트닫기(); 방그리기();
  알림("지웠습니다");
}

/* ── 방 메뉴 ── */
function 방메뉴열기(){
  const 방 = S.방;
  const 이어 = (방.이어하기 || []).length;
  시트열기(null,
    시트줄("＋", "새로하기", "새로하기", {밑: "지금 것을 저장하고 처음부터"}) +
    시트줄("↻", "이어하기", "이어하기", {밑: 이어 ? 이어 + "벌 저장돼 있습니다" : "저장된 것이 없습니다"}) +
    시트줄("👤", "대화 프로필", "대화프로필", {밑: "내 이름과 설명 — 대화에 계속 씁니다"}) +
    시트줄("📄", "플롯 정보", "플롯보기") +
    /* ★ 260911 회원님 — 「그대로 두어라. 그 방이 무슨 모델을 썼나를 보여주는 자리다.
       하지만 zeta가 나올 것 같다면 그 문구만 deta로 변경하라.」
       그래서 **값은 그대로 보여 주되** `zeta` 일 때만 `deta` 로 적는다 */
    시트줄("🤖", "AI 모델", "모델", {밑: 딱지이름(방.모델)}) +
    시트줄("🧠", "기억", "기억", {밑: "제타에 없는 것"}) +
    시트줄("📝", "메모장", "메모", {밑: 메모읽기(방.id) ? "적어 둔 것이 있습니다" : "비어 있습니다"}) +
    시트줄("⧉", "대화 통째로 복사", "다복사") +
    시트줄("⤓", "내보내기", "방내보내기",
           {밑: "채팅 · 플롯 · 내 프로필 · 기억 · 메모"}) +
    시트줄("🗑", "대화 내용만 지우기", "방지우기", {빛: "빨강", 밑: "방은 남습니다"}) +
    시트줄("✕", "이 대화 나가기", "방나가기", {빛: "빨강", 밑: "방째로 지웁니다"}));
}

/* **방을 통째로 지운다.**
   자료.json 에서 온 방은 파일을 못 고치므로 「지운방」에 이름을 적어 두고
   앱이 뜰 때 거른다. 그래야 새로고침해도 안 돌아온다 */
function 지운방들(){
  try { return JSON.parse(localStorage.getItem("지운방") || "[]"); } catch(_){ return []; }
}
function 방지우기속(id){
  const 목 = 지운방들();
  if (목.indexOf(id) < 0) 목.push(id);
  try { localStorage.setItem("지운방", JSON.stringify(목)); } catch(_){}
  D.방 = D.방.filter(r => r.id !== id);
  delete D.도막[id];
  try {
    localStorage.removeItem("기억_" + id);
    localStorage.removeItem("메모_" + id);
    const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
    localStorage.setItem("새방", JSON.stringify(새방.filter(r => r.id !== id)));
    const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
    delete 새도막[id];
    localStorage.setItem("새도막", JSON.stringify(새도막));
  } catch(_){}
  if (S.방 && S.방.id === id){ S.방 = null; S.화면 = "대화"; }
}

/* 대화 목록에서 여는 메뉴 — 제타의 「고정 · 나가기」 자리다 */
function 목록방메뉴(방){
  시트열기(방.제목,
    시트줄("💬", "이어서 하기", "목록방열기", {값: 방.id}) +
    시트줄("⧉", "대화 통째로 복사", "목록방복사", {값: 방.id}) +
    시트줄("🗑", "이 대화 지우기", "목록방지우기",
           {값: 방.id, 빛: "빨강", 밑: "되돌릴 수 없습니다"}));
}

/* ── 이어하기 ── */
function 이어하기열기(){
  const 방 = S.방;
  const 목 = 방.이어하기 || [];
  시트열기("이어하기 " + (목.length ? "1/" + 목.length : ""),
    (목.length ? 목.map((e, i) =>
      시트줄("💾", (e.savedAt || "").slice(0, 16).split("T").join(" "), "이어열기",
             {값: e.id, 밑: (e.도막수 || 0) + "도막"})).join("")
      : '<div class="인물글">저장된 것이 없습니다.</div>'));
}

/* ── 모델 고르기 ── */
function 모델열기(){
  /* ★ 260910 — **업체와 모델이 한 벌**이다. 따로 두면 안 되는 짝이 생긴다.
     회원님 : 「모델명은 … 중에 고를 수 있게 해. 일일이 타이핑하는거 불편해.」 */
  const 지금 = 설정("모델설정") || 기본모델;
  시트열기("AI 모델",
    모델셋.map(x => 시트줄(지금 === x.값 ? "●" : "○", x.이름, "모델고름",
      {값: x.값, 밑: x.밑, 빛: 지금 === x.값 ? "켬" : ""})).join(""));
}

/* ── 기억 ── */
function 기억열기(){
  const 기 = 기억읽기(S.방.id);
  const 글 = 기억글(기);
  시트열기("기억 — 제타에 없는 것",
    '<div style="padding:0 12px"><textarea id="기억칸" ' +
    'placeholder="여태 있었던 일 · 사이 · 아직 답이 안 난 것">' + 안전(글) + '</textarea></div>' +
    '<div class="인물글" style="color:var(--흐림)">여기 적은 것이 매 턴 함께 갑니다.' +
    ' 대화가 길어져도 앞의 일이 안 사라집니다.</div>' +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
    '<button data-시트=지금갈무리>지금 갈무리</button>' +
    '<button class="강" data-시트=기억저장>담기</button></div>');
}

/* ══ 자료 들이기 ══
   제타에서 받은 것을 그대로 쓴다. 꼴을 안 고친다 */
async function 들이기(){
  try {
    const r = await fetch('./자료.json', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    D.플롯 = j.플롯 || []; D.방 = j.방 || []; D.도막 = j.도막 || {}; D.인기 = j.인기 || [];
    /* 받아 온 방의 도막 수를 적어 둔다 — 이어 친 것만 담으려고 */
    for (const r of D.방) 기본도막수[r.id] = (D.도막[r.id] || []).length;
    /* 브라우저에 담아 둔 것을 얹는다 */
    try {
      const 새방 = JSON.parse(localStorage.getItem("새방") || "[]");
      const 새도막 = JSON.parse(localStorage.getItem("새도막") || "{}");
      for (const r of 새방) if (!D.방.some(x => x.id === r.id)) D.방.unshift(r);
      for (const p of 지은것읽기()) if (!D.플롯.some(x => x.id === p.id)) D.플롯.unshift(p);
      /* ★ 손으로 고친 플롯을 얹는다 — 자료.json 은 못 고치므로 따로 담아 둔다 */
      /* 지운 방은 되살리지 않는다 */
      const 지운 = 지운방들();
      if (지운.length){
        D.방 = D.방.filter(r => 지운.indexOf(r.id) < 0);
        for (const id of 지운) delete D.도막[id];
      }
      const 고침 = 플롯고침들();
      for (const id of Object.keys(고침)){
        const i = D.플롯.findIndex(x => x.id === id);
        if (i >= 0) D.플롯[i] = 고침[id]; else D.플롯.unshift(고침[id]);
      }
      for (const k of Object.keys(새도막)) D.도막[k] = 새도막[k];
    } catch(_){}
    알림('방 ' + D.방.length + '개 · 플롯 ' + D.플롯.length + '개');
  } catch (e){
    /* 자료가 없어도 화면은 뜬다 */
  }
  그리기();
}

/* ══════════════════════════════════════════════════════
   자판이 올라온 것을 앱이 알게 한다

   ★ 260911 신고 — 「첫 대화때 자판누르면 첫대화가 안보임.」
   ★ 260911 회원님 v1.2 메모 1번 — 「타자 불러와졌을떄 채팅입력란이 위로 로드된
      상태로 고정되어, 채팅방 스크롤해도 그 위치를 고정하길 바람.」

   자판이 올라와도 `100dvh` 는 그대로다. 실제로 재 보면 이랬다 —
     보이는 높이 640px   ·   앱 높이 900px   ·   입력칸 아래끝 900px
   입력칸이 자판 뒤로 260px 들어가 있었다. 위쪽 첫 대화는 그만큼 화면 밖으로 밀렸다.

   **`visualViewport` 를 본다.** 그것만이 자판을 셈에 넣는다.
     height     자판을 뺀 진짜 보이는 높이
     offsetTop  iOS 에서 판이 통째로 밀려 올라간 만큼. 그만큼 되밀어야 제자리다

   ★ `visualViewport` 가 없으면 아무것도 안 한다 — CSS 가 `100dvh` 로 되돌아간다
   ══════════════════════════════════════════════════════ */
(function 자판보기(){
  const vv = window.visualViewport;
  if (!vv) return;
  let 앞높이 = -1;
  function 맞추기(){
    const h = Math.round(vv.height);
    const 위 = Math.round(vv.offsetTop || 0);
    document.documentElement.style.setProperty('--보임', h + 'px');
    const 앱 = $('#앱');
    if (앱) 앱.style.transform = 위 ? 'translateY(' + 위 + 'px)' : '';
    /* 자판이 **올라올 때만** 따라 내린다. 내려갈 때 끌어내리면 읽던 자리를 잃는다.
       그리고 바닥에 붙어 있을 때만 내린다 — 위를 읽고 계시면 가만둔다 */
    const 자판올라옴 = (앞높이 >= 0 && h < 앞높이 - 40);
    앞높이 = h;
    if (자판올라옴 && S.방) 맨아래로(false);
  }
  vv.addEventListener('resize', 맞추기);
  vv.addEventListener('scroll', 맞추기);
  addEventListener('orientationchange', () => setTimeout(맞추기, 250));
  맞추기();
})();

그리기();
자리쌓기();      /* ★ 첫 뒤로가 먹으려면 자리를 하나 쌓아 둬야 한다 */
들이기();
</script>
