<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151516">
<title>데타</title>
<!--
  데타 — 제타와 같은 화면 · 같은 결 · 거기에 **장기기억**

  회원님 지시 (260910) —
    「제타랑 똑같은 레이아웃, 기능, 동일수준의 출력 되게끔 앱 만들어놓고,
     해당 플롯들도 안에 구현해놔.」
    「제타앱이 갖지 못한 '장기기억'을 나는 갖는게 목표니까,
     데타에는 장기기억을 추가로 구현해놓고.」

  색과 크기는 **제타 실물에서 잰 것**이다 (07. 제타에서 받은 것/4. 화면 그림/00_결.json)
    바탕 rgb(21,21,22) · 강조 rgb(124,103,255) · 글꼴 Pretendard Variable
-->
<style>
/* ── 결 ─────────────────────────────────────────────
   제타 화면에서 실제로 잰 값. 짐작한 것이 아니다 */
:root{
  --바탕:#151516;          /* rgb(21,21,22) */
  --바탕2:#1e1e20;         /* 말풍선 · 카드 */
  --바탕3:#26262a;         /* 눌린 것 */
  --글자:#ffffff;
  --흐림:#595b63;          /* rgb(89,91,99) — 마지막 메시지 */
  --흐림2:#8b8d95;         /* 이름줄. 제타 실측 「흰색 50%」와 사실상 같다 */
  /* ★ 260911 실측 — **제타는 흐린 글자를 회색이 아니라 「흰색에 투명도」로 낸다.**

     제타 방 안 갈무리(07. …/4. 화면 그림/06_방안.png)에서 픽셀을 직접 쟀다.
     바탕이 rgb(21,21,22) 로 정확히 나와 **색이 틀어지지 않은 그림**임을 먼저 확인했다.
     구역마다 밝기 상위 2% 의 가운데값(=글자 속살)을 잰 것이다.

       자리            잰 값   그 바탕 위 흰색 몇 %   데타는 그동안
       인물 이름줄      180        68%  ≈ 70%        #8b8d95 (139)  ← 어두웠다
       인물 지문        188        70%               #8b8d95 (139)  ← 어두웠다
       인물 대사        249        ≈ 흰색             #ffffff        ○
       내레이션         161        60%               #8b8d95 (139)  ← 어두웠다
       유저 글          255        흰색               #ffffff        ○

     **흐린 글자 셋이 다 제타보다 어두웠다.** 이름줄 색을 지문·내레이션에도
     그대로 돌려 썼기 때문이다. 제타는 셋을 다르게 쓴다.
     제타가 내려받는 CSS 에도 같은 토큰이 있다 — lab(100 …/0.5) · lab(100 …/0.7) */
  --지문:rgba(255,255,255,.7);
  --나레:rgba(255,255,255,.6);
  --강조:#7c67ff;          /* rgb(124,103,255) — 단추·탭. 홈 화면에서 잰 값 */
  /* ★ 260911 실측 — 유저 말풍선은 --강조 가 아니다. 방 안에서 잰 값이 따로 있다 */
  --내말바탕:#644dd6;      /* rgb(100,77,214) */
  --강조흐림:#5a48c7;
  --빨강:#f04438;
  --선:#2a2a2e;
  --머리높이:52px;
  --발높이:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--바탕); color:var(--글자);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;
  font-size:16px}   /* 16px 밑이면 iOS 가 확대한다 */
img{display:block;max-width:100%}
.숨김{display:none!important}

/* ── 판 짜기 ───────────────────────────────────────── */
/* ★ 260910 회원님 : 「PC 브라우저에서 켠 제타앱은 높이가 높아야 아래가 나온다.
   상단/하단 바들은 필수 노출되게 하고, 세로 길이가 줄어들면 하단 필수바 위에서 축소되게 하라.」

   까닭은 **`min-height:0` 이 없어서**였다. flex 자식은 기본이 `min-height:auto` 라
   내용만큼 커지고, 그만큼 아래 바가 화면 밖으로 밀려난다.
   가운데(#몸)만 줄어들게 하면 머리와 발은 늘 남는다 */
/* ★ 260911 신고 — 「첫 대화때 자판누르면 첫대화가 안보임」
   ★ 260911 회원님 v1.2 메모 1번 — 「타자 불러와졌을떄 채팅입력란이 위로 로드된 상태로
      고정되어, 채팅방 스크롤해도 그 위치를 고정하길 바람.」

   `100dvh` 는 **자판이 올라온 것을 모른다.** 자판이 화면 절반을 덮어도
   앱은 여전히 전체 높이라고 믿어서, 위쪽(첫 대화)이 화면 밖으로 밀리고
   입력칸은 자판 뒤로 들어간다.
   재 보면 이랬다 — 보이는 높이 640px 인데 입력칸 아래끝이 900px.

   그래서 **`visualViewport.height` 를 보고 `--보임` 에 담아 쓴다.**
   `visualViewport` 가 없는 곳(옛 브라우저·PC)에서는 `100dvh` 로 되돌아간다 */
/* ★★★ 260913 — **max-height 가 안전망이다.**
   회원님 신고 : 「pc 브라우저의 창을 줄이면, 아래 메뉴들이 모두 사라진다.」
   `--보임` 이 어떤 까닭으로 낡으면 이 판이 창보다 커지고,
   `html,body{overflow:hidden}` 이라 **넘친 아래가 잘린다.** 스크롤도 안 된다.
   `max-height` 를 두면 `--보임` 이 낡아도 **창을 넘지 못한다.** */
#앱{display:flex;flex-direction:column;height:var(--보임,100dvh);min-height:0;
  max-height:100dvh;
  max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#머리자리,#입력자리,#발{flex:0 0 auto}
#몸{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
#몸::-webkit-scrollbar{width:0}

/* 머리 */
.머리{
  height:var(--머리높이); flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 14px; background:var(--바탕); border-bottom:1px solid var(--선);
  position:sticky; top:0; z-index:20;
}
.머리 .제목{font-size:20px;font-weight:700;letter-spacing:-.3px}
.머리 .가운데{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.머리 .단추{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:18px}
.머리 .단추:active{background:var(--바탕3)}

/* 발 — 하단 네비 넷 */
#발{
  height:var(--발높이); flex:0 0 auto; display:flex; border-top:1px solid var(--선);
  background:var(--바탕); padding-bottom:env(safe-area-inset-bottom);
}
#발 button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--흐림); font-size:10px;
}
#발 button .꼭지{font-size:19px;line-height:1}
#발 button.켬{color:var(--글자)}

/* ── 홈(랭킹) ──────────────────────────────────────── */
.탭줄{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.탭줄::-webkit-scrollbar{height:0}
.탭{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--흐림2);
  background:var(--바탕2);white-space:nowrap}
.탭.켬{background:var(--글자);color:#111}
.탭줄.맨탭 .탭{background:none;padding:6px 4px;font-size:15px;font-weight:600}
.탭줄.맨탭 .탭.켬{background:none;color:var(--글자);border-bottom:2px solid var(--글자);border-radius:0}

.플롯줄{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--선)}
.플롯줄 .순위{width:22px;flex:0 0 auto;font-size:15px;font-weight:700;color:var(--흐림2);padding-top:2px}
.플롯줄 .그림{width:64px;height:64px;flex:0 0 auto;border-radius:10px;background:var(--바탕3);
  object-fit:cover}
.플롯줄 .속{flex:1;min-width:0}
.플롯줄 .이름{font-size:15px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .한줄{font-size:12px;color:var(--흐림2);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .태그{font-size:11px;color:var(--강조);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.플롯줄 .셈{font-size:11px;color:var(--흐림);margin-top:3px}

/* ── 대화 목록 ─────────────────────────────────────── */
.칸제목{padding:14px 14px 8px;font-size:15px;font-weight:700;display:flex;align-items:center;
  justify-content:space-between}
/* ★ 260910 회원님 : 「대화 목록 우상단의 더보기 기능이 없다면 취소선을 그어라.」
   있는 척하는 것보다 없다고 하는 편이 낫다 */
.칸제목 .더{font-size:12px;color:var(--흐림2);font-weight:400;
  text-decoration:line-through;opacity:.55}
.스크랩줄{display:flex;gap:12px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.스크랩줄::-webkit-scrollbar{height:0}
.스크랩{flex:0 0 auto;width:62px;text-align:center}
.스크랩 img{width:62px;height:78px;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.스크랩 .이름{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.방줄{display:flex;gap:12px;padding:11px 14px;align-items:center}
.방줄:active{background:var(--바탕2)}
.방줄 img{width:46px;height:46px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:var(--바탕3)}
.방줄 .속{flex:1;min-width:0}
.방줄 .이름{font-size:14px;font-weight:700;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.방줄 .끝말{font-size:12px;color:var(--흐림);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 방 안 ────────────────────────────────────────── */
#대화판{padding:14px 12px 8px;display:flex;flex-direction:column;gap:14px}

/* 유저 — 오른쪽 보라 */
.내말{align-self:flex-end;max-width:78%;background:var(--내말바탕);color:#fff;
  padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
/* ★ 260911 신고 — 「*로 묶어도 내 대화가 회색이탤릭처리가 안됨」

   제타는 **유저 말풍선도 같은 얼개로 가른다.** 짐작이 아니라 실측이다 —
   회원님이 제타에서 치신 유저 조각 1,730개 중 **809개(46.8%)에 별표가 들어 있고**,
   제타 화면을 긁은 글(06_방안.txt)에는 그 별표가 **하나도 안 남아 있다.**
     보낸 것 : `*문을 열러주며*` + 줄바꿈 + `결정했나?`
     화면 글 : `문을 열러주며` / `결정했나?`      ← 별표가 사라졌다 = 갈라서 그렸다

   ★ 대사는 **굵게 하지 않는다.** 인물 말풍선과 다른 자리다 —
     제타 갈무리에서 인물 대사는 굵고(가장 밝은 점 249), 유저 글은 보통 굵기다 */
.내말 .지문{color:var(--지문);font-style:italic;display:block}
.내말 .대사{color:#fff;display:block}
.내말 .지문+.대사,.내말 .대사+.지문{margin-top:5px}

/* 인물 — 왼쪽 회색. 이름줄이 위에 */
.남말{display:flex;gap:9px;max-width:88%}
.남말 .얼굴{width:30px;height:30px;flex:0 0 auto;border-radius:50%;object-fit:cover;
  background:var(--바탕3);margin-top:16px}
.남말 .묶음{flex:1;min-width:0}
.남말 .이름{font-size:12px;color:var(--지문);margin-bottom:4px}   /* 260911 실측 — 흰색 70% */
.방울{background:var(--바탕2);padding:10px 13px;border-radius:16px;position:relative;overflow:visible;
  font-size:14px;word-break:break-word}
.방울+.방울{margin-top:6px}
/* ★ 260911 회원님 — 「말풍선 끝마다 deta 뜰 필요는 없을 듯. 그저 **작은 직각이등변
   삼각형**을 둬서 어디가 경계인지 표시하는 정도면 충분할 듯. **두 변의 크기는 텍스트 ^ 정도** 크기로.」
   그래서 글자를 지우고 삼각형만 남긴다. 왼쪽 아래에 둔다 — 말풍선이 왼쪽에서 나오니까 */
.방울 .모델딱지{position:absolute;left:-6px;bottom:9px;width:0;height:0;font-size:0;overflow:visible;
  border-style:solid;border-width:0 0 7px 7px;
  border-color:transparent transparent var(--바탕2) transparent}
.내말 .모델딱지{left:auto;right:-5px;border-width:0 7px 7px 0;
  border-color:transparent var(--내말바탕) transparent transparent}
/* 지문과 대사가 **한 말풍선 안에서** 갈린다 — 제타 실물이 그렇다 */
/* ★ 260911 — 색을 `--흐림2`(이름줄 색) 에서 `--지문`(흰색 70%) 으로 바꿨다.
   제타 갈무리에서 재 보니 지문이 이름줄보다 밝았다. 위 `:root` 주석에 잰 값이 있다 */
.방울 .지문{color:var(--지문);font-style:italic;display:block}
.방울 .대사{color:var(--글자);font-weight:600;display:block}
.방울 .지문+.대사,.방울 .대사+.지문{margin-top:6px}

/* ── 대기 표시 (· · ·) ──────────────────────────────
   ★ 260911 신고 — 「출력대기중엔 ᆞ ᆞ ᆞ 표시가 움직이도록.」
   ★ 260911 신고 총평 — 「제타의 무빙ㆍ모션을 직접 체크하지 않고 만든듯」

   그래서 **짐작하지 않고 제타가 내려받는 CSS 를 그대로 읽었다.**
   (제타 홈을 브라우저로 열어 받아진 자산만 읽었다. API 는 부르지 않았다)

     @keyframes loading-dot-bubble{0%,to{opacity:.5}33.333%,66.667%{opacity:.2}}
     @keyframes loading-dot-plate {0%,to{opacity:.7}33.333%,66.667%{opacity:.3}}
     .animate-loading-dot-bubble{animation:1.5s linear infinite loading-dot-bubble}
     .animate-loading-dot-plate {animation:1.5s linear infinite loading-dot-plate}

   알아낸 것 셋 —
     ① **튀지 않는다.** 위아래로 움직이지 않고 **투명도만** 오르내린다
     ② 1.5초 · linear · 무한
     ③ 두 벌이다. 말풍선 안은 최대 .5, 판 위는 최대 .7 —
        위에서 잰 「흐린 글자」 값(말풍선 70% · 내레이션 60%)과 같은 얼개다

   ★ 어긋나는 시각(딜레이)은 **못 쟀다.** 방 안 화면은 로그인이 있어야 열린다.
     다만 마디가 0% · 33.3% · 66.7% 로 **정확히 셋으로 나뉜 것**은
     점 세 개에 1.5초÷3 = 0.5초씩 어긋나게 준 꼴이다. 그렇게 뒀다.
     ★ 이것만은 잰 값이 아니라 **읽어 낸 것**이다 */
@keyframes 대기점{0%,100%{opacity:.5}33.333%,66.667%{opacity:.2}}
.대기방울{display:inline-flex;align-items:center;gap:5px;min-height:21px}
.대기방울 .점{width:6px;height:6px;border-radius:50%;background:#fff;
  animation:대기점 1.5s linear infinite}
/* ★ 260912 회원님 : 「입력 후 출력 대기하는 점3개 **흐르는 방향을 반대로** 바꿔라.
   지금은 우에서 좌로 움직이는 느낌이니까, **좌에서 우로** 움직이는 느낌으로 바꿔.」

   제타 값은 `-.5s` · `-1s` 였고 그러면 **둘째 → 첫째 → 셋째** 로 어두워진다.
   둘을 맞바꾸면 **첫째 → 둘째 → 셋째**, 왼쪽에서 오른쪽으로 흐른다 */
.대기방울 .점:nth-child(2){animation-delay:-1s}
.대기방울 .점:nth-child(3){animation-delay:-.5s}
/* 움직임을 꺼 둔 분에게는 안 움직인다 — 점은 그대로 보인다 */
@media (prefers-reduced-motion:reduce){
  .대기방울 .점{animation:none;opacity:.4}
}

/* 내레이션 — 말풍선 없이 ≡ */
.나레{display:flex;gap:8px;color:var(--나레);font-style:italic;font-size:13px;   /* 260911 실측 — 흰색 60% */
  padding:0 4px;line-height:1.7}
.나레::before{content:"≡";flex:0 0 auto;color:var(--흐림);font-style:normal}

/* 입력 */
#입력칸{flex:0 0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--선);background:var(--바탕)}
#입력줄{display:flex;align-items:flex-end;gap:8px;background:var(--바탕2);
  border-radius:22px;padding:6px 6px 6px 12px}
/* ★ 260911 — **16px 밑이면 iOS 사파리가 화면을 확대한다.**
   글을 치려고 누를 때마다 판이 커졌다 줄었다 해서 쓰기가 나쁘다.
   입력할 수 있는 칸은 전부 16px 로 둔다 */
#입력{flex:1;resize:none;max-height:110px;font-size:16px;padding:6px 0;line-height:1.45}
#입력::placeholder{color:var(--흐림)}
#보내기{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--강조);
  display:grid;place-items:center;font-size:15px}
#보내기[disabled]{background:var(--바탕3);color:var(--흐림)}
#연장{display:flex;gap:14px;padding:6px 16px 2px;color:var(--흐림2);font-size:16px}
/* ── 그림 도막 ──────────────────────────────────────
   ★ 260913 회원님 : 「제타는 채팅방 안의 15 재화가 있는 그 버튼 위치에,
     우리 데타에서는 이미지 생성 버튼을 넣어서 **채팅방 중간에 출력**하게 해주고.」
   말풍선이 아니다 — 얼굴도 이름줄도 딱지도 없이 **판 가운데에 그림만** 놓는다 */
.그림도막{display:flex;flex-direction:column;align-items:center;gap:6px}
.그림도막 img{width:100%;max-width:320px;border-radius:14px;background:var(--바탕2);
  aspect-ratio:1/1;object-fit:cover;cursor:pointer}
.그림도막 .밑{font-size:11px;color:var(--흐림);text-align:center;max-width:320px;line-height:1.6;
  word-break:break-word}
.그림도막 .없음{width:100%;max-width:320px;aspect-ratio:1/1;border-radius:14px;
  background:var(--바탕2);display:grid;place-items:center;color:var(--흐림);font-size:12px}
/* 남은 장수 — 단추에 붙여 늘 보이게. 회원님 : 「제한을 두고 명시해주는게 좋겠다」 */
#연장 .그림수{font-size:11px;color:var(--흐림);align-self:center;margin-left:-9px}

/* ── 플롯 정보 ─────────────────────────────────────── */
.플롯그림{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--바탕3)}
/* ★ 260913 — 아래에 「대화 시작하기」와 바닥 메뉴가 **둘 다** 있으므로 여백을 늘린다 */
.플롯속{padding:16px 14px calc(90px + var(--발높이))}
.플롯속 h1{font-size:22px;font-weight:800;margin:0 0 6px}
.플롯속 .한줄{font-size:14px;color:#d5d6da;margin-bottom:8px}
.플롯속 .태그{font-size:13px;color:var(--강조);margin-bottom:10px}
.배지줄{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.배지{font-size:11px;color:var(--흐림2);background:var(--바탕2);padding:4px 9px;border-radius:999px}
.칸{margin-top:20px}
.칸 h2{font-size:15px;font-weight:700;margin:0 0 8px}
.칸 .글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7}
/* ★ 260913 — 바닥 메뉴가 플롯 화면에도 뜨므로 **그 위로** 올린다. 안 올리면 겹친다.
   `--발높이` 만큼 띄우고, 안전 영역(env)은 발이 이미 먹으므로 여기서는 뺀다 */
.아래고정{position:absolute;left:0;right:0;bottom:var(--발높이);display:flex;gap:10px;padding:10px 14px
  10px;background:var(--바탕);border-top:1px solid var(--선);
  max-width:520px;margin:0 auto}
.아래고정 .북{width:48px;flex:0 0 auto;border-radius:12px;background:var(--바탕2);
  display:grid;place-items:center;font-size:17px}
.아래고정 .큰단추{flex:1;height:48px;border-radius:12px;background:var(--강조);
  font-size:15px;font-weight:700;display:grid;place-items:center}

/* ── 만들기 ───────────────────────────────────────── */
.만들기판{padding:16px 14px}
.빈말{padding:40px 20px;text-align:center;color:var(--흐림);font-size:13px;line-height:1.9}

/* ── 바닥시트 · 덮개 ── */
#덮개{position:fixed;inset:0;background:#000a;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s}
#덮개.보임{opacity:1;pointer-events:auto}
/* ★ 260911 회원님 v1.2 메모 2번 — 「채팅방 메모장/수정창 손잡이 작음.
   키우고, 손잡이를 위에 두자.」

   전에는 `38×4px` 이고 **시트 안쪽 맨 위**에 있었다. 작아서 잡히지도 않았다.
   이제 **시트 바깥 위로 띄우고** 크기를 키웠다 — `64×7px`.
   ★ 미끄러져 내려갈 때 손잡이만 남아 떠 있으면 안 되므로
     감추는 거리를 `101%` 에서 `101% + 34px` 으로 늘렸다. 손잡이까지 같이 내려간다
   ★ 잡는 자리는 눈에 보이는 것보다 훨씬 넓다 — 위아래 22px · 좌우 30px 더 준다 */
#시트{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:520px;margin:0 auto;
  background:var(--바탕2);border-radius:18px 18px 0 0;
  transform:translateY(calc(101% + 34px));
  transition:transform .22s;display:flex;flex-direction:column;
  /* 자판이 올라오면 보이는 높이도 줄어든다. `dvh` 는 그것을 모른다 */
  max-height:calc(var(--보임,100dvh) * .82);
  /* 손잡이가 흐름에서 빠졌으니 맨 위 여백을 시트가 직접 준다 */
  padding-top:10px}
#시트.보임{transform:none}
#시트 .손잡이{position:absolute;top:-26px;left:50%;margin-left:-32px;
  width:64px;height:7px;border-radius:4px;background:rgba(255,255,255,.38);
  cursor:ns-resize;touch-action:none}
#시트 .손잡이:before{content:"";position:absolute;left:-30px;right:-30px;top:-22px;bottom:-22px}
#시트 .시트머리{padding:4px 18px 10px;font-size:15px;font-weight:700}
/* 속만 스크롤되고 아래 단추줄은 늘 보인다 */
#시트 .시트속{overflow-y:auto;flex:1 1 auto;min-height:0;
  padding:0 8px calc(14px + env(safe-area-inset-bottom))}
#시트 .시트단추{flex:0 0 auto}
.시트줄{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;
  font-size:14px;width:100%;text-align:left}
.시트줄:active{background:var(--바탕3)}
.시트줄 .꼭{width:22px;text-align:center;font-size:16px}
.시트줄 .밑{font-size:11px;color:var(--흐림);margin-top:2px}
.시트줄.빨강{color:var(--빨강)}
/* ★ 260912 — 이어하기 목록에서 그 대화의 메모·기억을 바로 연다 */
.곁줄{display:flex;gap:6px;padding:0 12px 10px 46px}
.곁단추{padding:5px 11px;border-radius:9px;background:var(--바탕3);color:var(--흐림);
  font-size:11px;border:0;cursor:pointer}
.곁단추:active{background:var(--바탕2)}
.시트줄.켬{background:var(--바탕3)}
#시트 textarea{width:100%;background:var(--바탕);border-radius:12px;padding:12px;
  font-size:14px;min-height:120px;resize:vertical;line-height:1.6}
#시트 .시트단추{display:flex;gap:8px;padding:10px 12px}
#시트 .시트단추 button{flex:1;height:44px;border-radius:12px;background:var(--바탕3);
  font-size:14px;font-weight:600}
#시트 .시트단추 button.강{background:var(--강조)}

/* 인물 정보 */
.인물머리{display:flex;gap:12px;padding:4px 12px 14px;align-items:center}
.인물머리 img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--바탕3)}
.인물머리 .이름{font-size:17px;font-weight:700}
.인물머리 .밑{font-size:12px;color:var(--흐림2)}
.인물글{font-size:13px;color:#c8c9ce;white-space:pre-wrap;line-height:1.7;padding:0 12px 8px}

/* 눌리는 것 */
.방울{cursor:pointer}
.남말 .얼굴{cursor:pointer}

/* 알림 */
#알림{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;
  background:#000c;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%}
#알림.보임{opacity:1}
</style>
</head>
<body>
<div id="앱">
  <div id="머리자리"></div>
  <div id="몸"></div>
  <div id="입력자리"></div>
  <div id="발"></div>
</div>
<!-- ★ 260910 회원님 : 「모든 창 좌상단에 < 로 뒤로가기 버튼 오버레이 해놔.」
     머리에 있던 ‹ 를 떼고 이 하나로 모았다. 어느 창이든 같은 자리에 있다 -->
<button id="뒤로떠" data-가="뒤로" aria-label="뒤로">‹</button>
<div id="덮개"></div>
<div id="시트"></div>
<style>
#뒤로떠{position:fixed;left:10px;top:10px;z-index:60;width:38px;height:38px;
  border-radius:50%;display:none;place-items:center;font-size:24px;line-height:1;
  padding-bottom:3px;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
#뒤로떠.보임{display:grid}
.방더{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:8px;color:var(--흐림);font-size:18px}
.방더:active{background:var(--바탕3)}
.플롯연필{position:absolute;right:10px;top:10px;z-index:30;width:38px;height:38px;
  border-radius:50%;display:grid;place-items:center;font-size:17px;
  background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14)}
</style>
<div id="알림"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════
   데타

   ★ 이 파일 하나가 앱 전부다. 옛 앱과 같은 얼개다.
   ★ 화면은 제타 실물을 찍어 놓고 보고 그렸다.
     그림 — 07. 제타에서 받은 것/4. 화면 그림/
   ══════════════════════════════════════════════════════ */

const S = {              /* 지금 상태 */
  화면: '대화',           /* 홈 · 대화 · 만들기 · 나 */
  방: null,              /* 열려 있는 방 */
  플롯: null,            /* 열려 있는 플롯 */
  보낸중: false
};
const D = {              /* 담아 둔 것 */
  플롯: [], 방: [], 도막: {}, 인기: []
};

/* 줄바꿈.
   ★ 260910 — 이것이 없어서 **중계로 요청이 아예 안 나갔다.**
     `말보내기` 안에서 NL 을 쓰는데 만드는 자리가 없었다. 회원님이 폰에서 치셨는데 무응답이었다.
   ★ 소스에 역빗금을 안 쓴다 — 스크립트로 이 파일을 고칠 때 한 겹 벗겨진다 (G6) */
const NL = String.fromCharCode(10);

const $ = s => document.querySelector(s);
const 몸 = () => $('#몸');
/* ★ 260911 — **얼마나 띄울지 고를 수 있게 했다.**
   회원님 : 「무료구글 **탈400 글자만 떴다 사라짐.** 내가 이거 목격 못했으면
             영문도 모르고 채팅 멈춘줄 알겠지. 게다가 그럼 뭘 어째야돼?」
   탈이나 끊김처럼 **무엇을 해야 하는지 알려야 하는 알림**은 오래 띄운다 */
const 알림 = (글, 얼마 = 1800) => {
  const e = $('#알림'); e.textContent = 글; e.classList.add('보임');
  clearTimeout(알림._t); 알림._t = setTimeout(() => e.classList.remove('보임'), 얼마);
};
const 넣기 = (자리, html) => { $(자리).innerHTML = html; };
const 안전 = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ── 도막 한 조각을 지문/대사로 가른다 ──
   제타 실물 : 지문 65% · 섞임 33% · 대사만 1.9%.
   한 조각 안에 *지문* 과 대사가 섞여 있다. 별표로 가른다 */
function 조각그리기(글){
  const t = String(글 || "");
  if (!t.trim()) return "";
  /* 별표로 자른다. 홀수 자리가 지문이다.
     ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 벗겨진다 (G6) */
  const 토막 = t.split("*");
  let 낸것 = "";
  토막.forEach((조각, i) => {
    const x = 조각.trim();
    if (!x) return;
    낸것 += (i % 2 === 1)
      ? '<span class="지문">' + 안전(x) + '</span>'
      : '<span class="대사">' + 안전(x) + '</span>';
  });
  return 낸것 || '<span class="대사">' + 안전(t) + '</span>';
}

/* ══════════════════════════════════════════════════════
   바닥시트 — 제타가 메뉴를 이렇게 띄운다
   ══════════════════════════════════════════════════════ */
/* ★ 260911 — **시트도 온 길을 쌓는다.**
   회원님 v1.2 메모 3번 : 「무조껀 상위가 아님. 내부에서 열린 경로에서는
   내부로 돌아가는 기능도 필요함.」

   시트는 한 자리를 돌려 쓴다(`#시트` 하나에 내용만 갈아 끼운다).
   그래서 방메뉴에서 「모델 고르기」를 열면 **방메뉴가 덮여 사라졌고**,
   뒤로 가면 시트가 통째로 닫혔다. 이제 **덮기 전 것을 쌓아 두고 그리로 돌아간다** */
let 지금시트 = null;          /* {제목, 속} — 지금 떠 있는 것 */
const 시트길 = [];             /* 그 밑에 깔린 것들 */

function 시트그리기(제목, 속){
  const 시 = $("#시트");
  시.innerHTML = '<div class="손잡이"></div>' +
    (제목 ? '<div class="시트머리">' + 안전(제목) + '</div>' : '') +
    '<div class="시트속">' + 속 + '</div>';
  $("#덮개").classList.add("보임");
  시.style.height = ""; 시.style.maxHeight = "";   /* 지난번 늘린 것을 되돌린다 */
  requestAnimationFrame(() => { 시.classList.add("보임"); 손잡이붙이기(); });
}
function 시트열기(제목, 속){
  if (지금시트) 시트길.push(지금시트);
  지금시트 = {제목: 제목, 속: 속};
  시트그리기(제목, 속);
  자리쌓기();
}
/* 시트에서 한 겹만 물러난다. 밑에 깔린 것이 있으면 그것을 도로 띄운다 */
function 시트뒤로(){
  const 앞 = 시트길.pop();
  if (!앞){ 시트닫기(); return; }
  지금시트 = 앞;
  시트그리기(앞.제목, 앞.속);
}
/* Esc · 뒤로 가기로도 닫는다 */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && 시트열렸나()) 시트닫기();
});

/* ★ 260910 회원님 : 「채팅창의 연필모양 눌러 띄우는 팝업창 위에 핸들이 있는데,
   이걸 통해 입력창을 늘릴 수도 있어야 한다.」

   손잡이를 위로 끌면 시트가 커지고 그 안의 입력칸도 함께 커진다 */
/* ★ 260911 — 창(window)에 거는 것은 **딱 한 번만** 건다.
   전에는 시트를 열 때마다 `mousemove`·`touchmove` 를 새로 걸었다.
   시트를 스무 번 열면 스무 벌이 쌓여 손잡이 한 번 끄는 데 스무 번 돈다.
   이번에 시트가 시트를 덮는 길이 생겨 더 자주 열리므로 여기서 잡는다 */
let 잡음 = null;
let 손잡이걸었나 = false;

function 손잡이붙이기(){
  const 시 = $("#시트");
  const 손 = 시 && 시.querySelector(".손잡이");
  if (!손) return;
  잡음 = null;
  const 시작 = e => {
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    잡음 = {y: y, 높이: 시.getBoundingClientRect().height};
    e.preventDefault();
  };
  손.addEventListener("mousedown", 시작);
  손.addEventListener("touchstart", 시작, {passive: false});
  if (손잡이걸었나) return;
  손잡이걸었나 = true;

  const 움직임 = e => {
    if (!잡음) return;
    const 시 = $("#시트");
    if (!시) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    /* ★ 자판이 올라오면 `innerHeight` 는 그대로다. 보이는 높이를 봐야 한다 */
    const 보임 = (window.visualViewport && window.visualViewport.height) || innerHeight;
    const 새높이 = Math.max(180, Math.min(보임 * 0.94, 잡음.높이 + (잡음.y - y)));

/* ── 맨 아래로 ────────────────────────────────────────
   ★ 260911 신고 — 「유저입력시 입력된 유저말풍선 모두 보이게 최하단으로 스크롤 이동.」

   전에는 `판.scrollTop = 판.scrollHeight` 한 줄이었다. **한 번으로는 모자라다** —
     ⑴ 그 순간엔 아직 줄바꿈이 안 끝나서 `scrollHeight` 가 실제보다 작다
     ⑵ 인물 얼굴 그림이 나중에 떠서 그만큼 아래로 밀린다
     ⑶ 자판이 올라오는 중이면 보이는 높이가 아직 안 줄었다
   그래서 **그린 뒤 · 한 틱 뒤 · 조금 더 뒤** 세 번 내린다. 값이 같으면 아무 일도 안 난다.

   ★ 바닥에 붙어 있을 때만 따라 내려간다 (`억지로` 가 아니면).
     위를 읽고 계신데 끌어내리면 안 된다 */
const 바닥여유 = 80;
function 바닥에붙었나(){
  const 판 = 몸();
  if (!판) return true;
  return (판.scrollHeight - 판.scrollTop - 판.clientHeight) <= 바닥여유;
}
function 맨아래로(억지로){
  const 판 = 몸();
  if (!판) return;
  if (!억지로 && !바닥에붙었나()) return;
  const 내리기 = () => { const p = 몸(); if (p) p.scrollTop = p.scrollHeight; };
  내리기();
  requestAnimationFrame(() => { 내리기(); requestAnimationFrame(내리기); });
  setTimeout(내리기, 120);
  setTimeout(내리기, 320);
}

/* 도막 하나를 그린다.

     RIGHT     유저     오른쪽 보라 말풍선
     NARRATOR  내레이션  말풍선 없이 ≡
   한 도막 안에 LEFT 와 NARRATOR 가 섞여 온다. 그래서 조각 단위로 돈다 */
/* 말풍선 오른쪽 아래에 붙는 작은 딱지.

   ★ 260911 회원님 v1.2 메모 4번 — 「채팅 말풍선 끝에 zeta 대신 deta라고 붙이길 바람.」

function 딱지이름(모델){
  const t = String(모델 || "").trim();
  if (!t || t === "zeta") return "deta";
  return t;
}

/* 별표를 벗긴다.
   ★ 정규식을 안 쓴다 — 스크립트로 이 파일을 고칠 때 역빗금이 한 겹 벗겨진다 (Ground rule G6) */
function 별표벗기기(글){
  return String(글 || '').split('*').join('').trim();
}

function 도막그리기(m, 몇){
  /* ★ 260913 — **그림 도막.** 글 조각이 없고 그림만 있는 도막이다. 둘이 온다 —
       `m.그림`    제타에서 받아 온 인트로 그림 (URL · 1111줄에서 만든다)
       `m.그림키`  데타가 venice 로 낸 그림. 실물은 `그림창고()` 에 따로 있다
     전에는 이 가지가 없어서 **아래 `if (!조각.length) return ""` 에서 통째로 사라졌다** */
  if (m.그림 || m.그림키){
    const 주소 = m.그림 || 그림꺼내기(m.그림키);
    const 밑 = m.그림말 ? '<div class="밑">' + 안전(m.그림말) + '</div>' : '';
    if (!주소)
      return '<div class="그림도막"><div class="없음">그림은 자리가 모자라 지웠습니다</div>' + 밑 + '</div>';
    return '<div class="그림도막">' +
      '<img src="' + 안전(주소) + '" loading=lazy data-그림="' + 몇 + '">' + 밑 + '</div>';
  }
  const 조각 = (m.contents || []).filter(c => c.type === "TEXT" && c.text);
  if (!조각.length) return "";
  const 낸것 = [];
  let 묶음 = null;              /* 이어지는 LEFT 조각을 한 묶음으로 */
  const 묶음닫기 = () => {
    if (!묶음) return;
    const 얼굴 = 얼굴찾기(묶음.이름);
    낸것.push(
      '<div class="남말">' +
        (얼굴 ? '<img class="얼굴" src="' + 안전(얼굴) + '" loading=lazy data-인물="' + 안전(묶음.이름) + '">'
            : '<div class="얼굴" data-인물="' + 안전(묶음.이름) + '"></div>') +
        '<div class="묶음">' +
          '<div class="이름">' + 안전(묶음.이름) + '</div>' +
          묶음.글.map(t => '<div class="방울" data-도막="' + 몇 + '">' + 조각그리기(t) +
            '<span class="모델딱지">' + 안전(딱지이름(S.방 && S.방.모델)) + '</span></div>').join("") +
        '</div>' +
      '</div>');
    묶음 = null;
  };

  for (const c of 조각){
    const 자리 = c.position || (((m.sender && m.sender.type) === "BOT") ? "LEFT" : "RIGHT");
    if (자리 === "RIGHT"){
      묶음닫기();
      /* ★ 260911 신고 — 「*로 묶어도 내 대화가 회색이탤릭처리가 안됨」
         인물 말풍선만 `조각그리기()` 를 거치고 유저 말풍선은 `안전()` 으로 그냥 넣고 있었다.
         그래서 별표가 글자 그대로 남았다. **같은 얼개를 태운다** */
      낸것.push('<div class="내말" data-도막="' + 몇 + '">' + 조각그리기(c.text) + '</div>');
    } else if (자리 === "NARRATOR"){
      묶음닫기();
      /* 내레이션은 별표를 벗기고 ≡ 로 놓는다 */
      낸것.push('<div class="나레">' + 안전(별표벗기기(c.text)) + '</div>');
    } else {
      const 이름 = c.speakerName || "";
      if (묶음 && 묶음.이름 === 이름) 묶음.글.push(c.text);
      else { 묶음닫기(); 묶음 = {이름, 글: [c.text]}; }
    }
  }
  묶음닫기();
  return 낸것.join("");
}
/* ── 기다리는 동안 (· · ·) ────────────────────────────
   ★ 260911 신고 — 「출력대기중엔 ᆞ ᆞ ᆞ 표시가 움직이도록.」

   제타처럼 **인물 자리에** 놓는다 — 얼굴 · 이름줄 · 말풍선 안에 점 셋.
   제타가 쓰는 클래스 이름이 `loading-dot-bubble`(말풍선 안)인 것도 그 뜻이다.
   모션 값은 제타 CSS 에서 그대로 가져왔다 (위 `@keyframes 대기점` 주석) */
function 기다림이름(){
  const 방 = S.방;
  if (!방) return "";
  const p = D.플롯.find(x => x.id === 방.플롯아이디);
  const c = p && (p.characters || [])[0];
  return (c && c.name) || 방.제목 || "";
}
function 대기점html(){

    (얼굴 ? '<img class="얼굴" src="' + 안전(얼굴) + '">' : '<div class="얼굴"></div>') +
    '<div class="묶음">' +
      '<div class="이름">' + 안전(이름) + '</div>' +
      '<div class="방울" aria-live="polite" aria-label="답을 쓰는 중입니다">' +
        '<span class="대기방울"><i class="점"></i><i class="점"></i><i class="점"></i></span>' +
      '</div>' +
    '</div></div>';
}
function 대기붙이기(){
  const 판 = $('#대화판');
  if (!판 || $('#대기')) return;
  const e = document.createElement('div');
  e.id = '대기';
  e.innerHTML = 대기점html();
  판.appendChild(e);
  흐름글 = ''; 흐름때 = 0;
  맨아래로(true);
}
function 대기떼기(){
  if (흐름예약){ clearTimeout(흐름예약); 흐름예약 = 0; }
  흐름글 = '';
  const e = $('#대기');
  if (e && e.parentNode) e.parentNode.removeChild(e);
}

/* ── 글자가 흐르는 동안 ───────────────────────────────
   ★ 260911 신고 — 「채팅 흐르는 느낌 있우면 좋을듯.」
                  「출력 시작할 때 자동으로 스크롤이 따라붙길 바람.」

   받는 대로 **점 셋이 있던 자리**를 글로 바꿔 나간다.
   그리는 얼개는 `도막그리기()` 그대로다 — 그래야 흐르는 동안 보이는 것과
   다 받은 뒤 보이는 것이 **같다.** 따로 그리면 마지막에 화면이 한 번 덜컥한다.

   ★ 매 조각마다 다시 그리면 폰이 버벅인다. 0.06초에 한 번으로 묶는다
   ★ **바닥에 붙어 계실 때만** 따라 내려간다. 위를 읽고 계시면 가만둔다 */
let 흐름글 = '';
let 흐름예약 = 0;
let 흐름때 = 0;

/* ★ 260911 회원님 — 「**출력이 흐르는듯이 되지 않음.** 내가 생각한건
   **줄 단위 출력이 아니라 글자 단위 출력**이었음.」

   까닭 — 받은 덩이를 **그때그때 통째로** 그렸다. 중계·모델이 한 번에 수십 자씩
   보내므로 화면에서는 뭉텅이로 튀어나온다. 흐르는 느낌이 안 난다.

   그래서 **받는 것과 보이는 것을 떼어 놓았다.**
     흐름글     여태 **받은** 전부
     보인만큼   여태 **보여 준** 글자 수
   40ms 마다 조금씩 따라붙는다. 뒤처질수록 빨라지되 한 번에 너무 많이는 안 뱉는다.
   다 받았으면(흐름끝났나) 남은 것을 조금 더 빠르게 흘려 마무리한다 */
let 보인만큼 = 0, 흐름끝났나 = false;
/* ★★★ 260912 — **제타 실측에 맞춘 흐름 속도.** 아래 흐름그리기() 주석 참고.
   제타 방에서 0.4초마다 화면에 그려진 글자를 세니 **15.7자/초**였고,
   73칸 동안 한 번도 안 멎었다(흔들림÷평균 0.41). 그 결을 그대로 낸다. */
const 흐름초당자 = 16;      /* 초당 낼 글자 수 */
const 흐름간격 = 60;        /* 몇 밀리초마다 그리나 — 한 번에 한 자쯤.
                               ★ 120ms(두 자씩)로 재니 흔들림÷평균 0.61 이었다(제타 0.41).
                                 촘촘히 하면 고르게 된다 */
const 흐름한칸 = Math.ceil(흐름초당자 * 흐름간격 / 1000);
let 흐름잰때 = 0;
function 흐름그리기(){
  흐름예약 = 0;
  const e = $('#대기');
  if (!e || !S.방) return;

  /* ★★★ 260912 — **글자가 아니라 말풍선 단위로 낸다.**

     회원님 : 「**흐르는듯한 채팅은 실제 제타 스타일과 좀 차이가 있다?**
       다시 제대로 확인해줄래? or(오픈라우터) 3.1은 잘 되더라.」
       「**gg(구글키) 3.1은 갑자기 확 다 나와버린다.** 왜 한번에 출력되듯 하는거지?」

     앱에서 재 보니 버그가 아니었다 —
       gg 3.1 실측 : 첫 조각이 **4,352ms** 에 오고 답은 4,442ms 에 끝났다.
       프롬프트가 커서(system 4,248자 + 본보기 22쌍) 첫 토큰이 늦고,
       그다음은 한꺼번에 쏟아진다. **글자를 흘릴 틈이 없다.**
     SSE 조각 수도 업체마다 딴판이다 — gg 9개 · or 3.1 10개 · deepseek 88개.
     글자 단위로 흘리면 **모델마다 흐름이 딴판**이 된다.

     ★ 그리고 제타는 애초에 글자를 흘리지 않는다. **말풍선이 하나씩 툭툭 나타난다.**

     그래서 **빈 줄로 닫힌 데까지만** 보인다. 말풍선 하나가 완성되면 그것만 붙는다.

     ★★★ 260912 — **그것으로는 안 됐다. 실측으로 밝혀졌다.**

       회원님 : 「제타 출력을 실시간으로 체크하면 되는 문제 아니냐 … 사실 내 생각엔
         **이미 텍스트는 뭉텅이로 전달받은 다음에, css가 순차출력을 해주는 거라고 생각이 되거든,
         제타에서는.**」

       제타 방에서 0.4초마다 **화면에 그려진 글자 수**를 직접 셌다 —

         제타   흔들림÷평균 **0.41** · 73칸 중 멎은 칸 **0개** · **15.7자/초**
         우리   흔들림÷평균 **1.51** · 21칸 중 멎은 칸 **16개** · **148~242자/초**

       같은 턴의 두 줄기를 나란히 놓으면 까닭이 보인다 —
         받은 것 : 18 11 23 10 11 8 0 3 3 6 0 4 4 3 0 4 3 7 9 45 27   ← 꾸준히 도착한다
         그린 것 : 14  0 39  0  0 0 0 0 0 27 0 0 0 0 0 0 0 0 0 89 41   ← 다섯 번만 움직인다

       `묶음크기()` 가 99 라서 답이 **말풍선 하나**로 나온다. 그러면 기다리는 `\n\n` 이
       아예 안 오고, 끝난 뒤 `보인만큼 = 통` 으로 **남은 전부를 한 번에 쏟는다.**
       말풍선 단위라는 생각은 맞았지만 **그 단위가 답 안에 없었다.**

     ★ 그래서 **받은 것과 무관하게 고른 속도로** 낸다. 제타 실측이 15.7자/초다.
       조각이 크게 오든 잘게 오든 · 말풍선이 하나든 여럿이든 **같은 결**이 된다.
       다만 **받은 것보다 앞질러 갈 수는 없다.** */
  const 통 = 흐름글.length;
  if (보인만큼 < 통){
    if (흐름끝났나 && 통 - 보인만큼 <= 흐름한칸){
      보인만큼 = 통;                      /* 다 받았고 한 칸 안쪽이면 마저 보인다 */
    } else {
      /* 지난번에 그린 때로부터 흐른 만큼만 낸다 — 초당 흐름초당자 자 */
      const 흘렀 = Math.max(0, Date.now() - (흐름잰때 || Date.now()));
      const 낼만큼 = Math.max(1, Math.round(흐름초당자 * 흘렀 / 1000));
      보인만큼 = Math.min(통, 보인만큼 + 낼만큼);
    }
  }
  흐름잰때 = Date.now();

  const 붙었나 = 바닥에붙었나();      /* ★ 바꾸기 **전에** 재야 한다. 바꾸면 높이가 변한다 */
  const 글 = 흐름글.slice(0, 보인만큼);
  e.innerHTML = 글.trim()
    ? 도막그리기(답을도막으로(글, 유저이름(S.방), 묶음크기(지금플롯())), -1)
    : 대기점html();
  흐름때 = Date.now();
  if (붙었나) 맨아래로(true);

  /* 아직 못 따라잡았으면 또 돈다.
     ★ 260912 — **고른 간격으로** 돈다. 끝났다고 빨라지지 않는다 —
       빨라지면 마지막이 덜컥 쏟아져 제타 결과 달라진다 (실측 148~242자/초가 그것이었다) */
  if (보인만큼 < 흐름글.length) 흐름예약 = setTimeout(흐름그리기, 흐름간격);
}
function 흐름보이기(글){
  흐름글 = 글;
  if (흐름예약) return;
  if (!흐름잰때) 흐름잰때 = Date.now();
  흐름예약 = setTimeout(흐름그리기, 흐름간격);
}
/* 스트림이 끝났다 — 남은 것을 마저 흘려 보낸다 */
function 흐름마치기(){
  흐름끝났나 = true;
  /* ★ 260912 — 0 이 아니라 **같은 간격**으로 잇는다. 끝났다고 쏟지 않는다 */
  if (!흐름예약) 흐름예약 = setTimeout(흐름그리기, 흐름간격);
}
function 흐름되돌리기(){
  보인만큼 = 0; 흐름끝났나 = false; 흐름글 = '';
  흐름잰때 = 0;
  clearTimeout(흐름예약); 흐름예약 = 0;
}
/* ★★★ 260912 — **흐름이 다 흐를 때까지 기다린다.**

   이것이 없어서 고쳐도 안 먹었다. 실측 —
     0.4초마다 : 14 0 0 -9 0 19 7 **464**      ← 마지막에 통째로 튀었다
   까닭은 `흐름마치기()` **바로 뒤에 본문을 그려** 흐르던 것을 덮어썼기 때문이다.
   조각이 몇 초 안에 다 오면 흐를 틈이 없다 (gg 3.1 은 SSE 조각이 열 개뿐이다).

   제타는 410자를 **33초**에 걸쳐 흘린다. 우리도 다 흐른 뒤에 본문을 그린다.
   ★ 회원님이 읽고 계시는 동안 기다리는 것이지, 멎어 있는 것이 아니다. */
function 흐름끝나기다리기(){
  return new Promise(맞음 => {
    const 잰 = Date.now();
    (function 본다(){
      /* 다 보였거나 · 너무 오래 걸리면(60초) 넘어간다 */
      if (보인만큼 >= 흐름글.length || Date.now() - 잰 > 60000) return 맞음();
      setTimeout(본다, 흐름간격);
    })();
  });
}

/* 인물 이름으로 얼굴을 찾는다. 방의 플롯에 인물 그림이 들어 있다 */
function 얼굴찾기(이름){
  if (!S.방) return null;
  const p = D.플롯.find(x => x.id === S.방.플롯아이디);
  if (!p) return null;
  const c = (p.characters || []).find(c => c.name === 이름);
  return (c && c.imageUrl) || p.imageUrl || null;
}

/* ══ 플롯 정보 ══ */
function 플롯그리기(){
  const p = S.플롯;
  넣기('#몸',
    (p.imageUrl ? '<img class="플롯그림" src="' + 안전(p.imageUrl) + '">' : '<div class="플롯그림"></div>') +
    /* ★ 260910 회원님 : 「이미 완성된 플롯 우상단에 연필모양을 두어 플롯 수정을 가능케 해라.」 */
    '<button class="플롯연필" data-가=플롯편집 aria-label="플롯 고치기">✏</button>' +
    '<div class="플롯속">' +
      '<h1>' + 안전(p.name) + '</h1>' +
      /* ★ 260912 — **플롯 화면에서는 대표 캐릭터 이름으로** (회원님 지시) */

        '<div style="flex:1;font-size:13px;font-weight:600">' + 안전(p.creator) + '</div>' +
        '<button style="padding:6px 14px;border-radius:999px;background:var(--강조);' +
          'font-size:12px;font-weight:700">팔로우</button></div>' : '') +
      '<div class="배지줄">' +
        '<span class="배지">💬 ' + (p.interactionCount ? 만단위(p.interactionCount) : '—') + '</span>' +
        /* ★ 260913 — 무엇이 얼마나 실리는지 이 자리에서 바로 보이게 한다 */
        (() => {

          for (const b of (p.lorebooks || [])) 로어 += ((b.items || []).length);
          const 이은 = (p.설정집들 || []).map(설정집찾기).filter(Boolean);
          let 이은자 = 0;
          for (const b of 이은) 이은자 += 설정집자수(b);
          const 것 = [];
          if (로어) 것.push('<span class="배지">📖 제타 로어북 ' + 로어 + '항목</span>');
          if (이은.length) 것.push('<span class="배지">📕 설정집 ' + 이은.length + '권 · ' +
                                   쉼표수(이은자) + '자</span>');
          if (로어 || 이은.length)
            것.push('<span class="배지">한 턴 ' + 쉼표수(설정집한도()) + '자까지</span>');
          return 것.join('');
        })() +

      '</div>' +
      칸그리기('소개', 이름채우기(p.longDescription, p)) +
      칸그리기('캐릭터', 이름채우기((p.characters || [])
        .map(c => c.name + '\n' + (c.description || '')).join('\n\n'), p)) +
      칸그리기('인트로', 인트로글(p)) +
      /* ★ 260912 — 인물 특징. **여기서만 보인다** (회원님 지시 C) */
      특징칸(p) +
      /* ★ 260913 — 이은 설정집과 딸려 온 로어북을 여기서 보고 여기서 잇는다 */
      설정집칸(p) +

    '</div>' +
    '<div class="아래고정">' +
      '<button class="북" data-가=스크랩>' + (스크랩인가(p.id) ? "🔖" : "🏳") + '</button>' +
      /* ★ 260912 — 제타는 방이 있으면 「대화 이어하기」가 뜬다 */
      '<button class="큰단추" data-가=시작>' +
        (플롯의방(p.id) ? '대화 이어하기' : '대화 시작하기') + '</button>' +
    '</div>');
}
/* 플롯 화면의 특징 칸 — 없으면 뽑는 단추를 보인다

   ★ 260913 회원님 지시 — 「특징뽑기 **생성된 결과를 유저가 직접 편집할 수 있게** 해줘.
     그 결과도 **플롯에 반영되게 연동**해주고.」

   ★ **칸 이름을 여기에 박지 않는다.** 전에는 여덟 개를 박아 두었고,
     그래서 중계에 칸이 스물여섯 개로 늘었는데도 화면에는 여덟 개만 보였다.
     이제 중계가 준 칸목록을 따른다 */
function 특징칸(p){
  const 것 = 특징읽기(p.id);
  const 머리 = '<div class="칸"><h2>어떤 사람인가' +
    ' <span style="font-size:11px;color:var(--흐림);font-weight:400">' +
    '플롯에서 뽑았습니다 · 대화에는 안 보입니다</span></h2>';
  if (!것)
    return 머리 +
      '<div class="글" style="color:var(--흐림2);margin-bottom:8px">' +
        '아직 안 뽑았습니다. 뽑으면 이 인물이 다른 인물과 어떻게 다른지 보입니다.</div>' +
      '<button class="큰단추" data-가=특징뽑기 style="width:100%;height:42px;' +
        'border-radius:12px;background:var(--바탕2);font-size:14px;font-weight:600;' +
        'display:grid;place-items:center">✦ 특징 뽑기</button></div>';
  const 잰 = 특징자수(것);
  const 실린 = [], 속칸 = [];
  for (const c of 보일칸들(것)){
    const v = String(것[c.이름] || "").trim();
    if (!v || v === "—") continue;
    const 표 = 손질했나(것, c.이름) ? '<span style="color:var(--강조)">✎</span> ' : "";
    const 줄 = '<div style="margin-bottom:9px">' +
      '<span style="font-size:12px;font-weight:700;color:' +
        (c.실림 ? 'var(--강조)' : 'var(--흐림)') + '">' + 표 + 안전(c.이름) + '</span><br>' +
      '<span style="font-size:13px' + (c.실림 ? '' : ';color:var(--흐림2)') + '">' +
        안전(v) + '</span></div>';
    (c.실림 ? 실린 : 속칸).push(줄);
  }
  return 머리 +
    /* ★ 회원님 : 「제한을 두고 명시해주는게 좋겠다.」 — 얼마나 쓰는지 늘 보인다 */
    '<div class="글" style="margin-bottom:8px;font-size:11px;color:' +
      (잰.넘었나 ? 'var(--강조)' : 'var(--흐림)') + '">' +
      '매 턴 프롬프트에 ' + 잰.자 + '자 · 어림 ' + 잰.토큰 + '토큰 실립니다 ' +
      '(한도 ' + 특징글한도 + '자)' +
      (잰.넘었나 ? ' ★ 넘었습니다 — 고치기에서 긴 칸을 줄이십시오' : '') +
      (것._낡음 ? '<br>★ 플롯이 바뀌었습니다 — 다시 뽑아 보십시오' : '') +
    '</div>' +
    '<div class="글">' + (실린.join("") || '(실릴 칸이 없습니다)') + '</div>' +
    /* ★ 「부름」·「자리」·「어긋난자리」는 앱이 기계로 읽는 칸이다.
       전에는 화면에 아예 안 보였는데, **고쳐야 할 칸은 오히려 이쪽이다** */
    (속칸.length
      ? '<div class="글" style="margin-top:10px;padding-top:8px;' +
        'border-top:1px solid var(--바탕3)">' +
        '<div style="font-size:11px;color:var(--흐림);margin-bottom:6px">' +
        '앱이 쓰는 칸 — 프롬프트에 안 실립니다</div>' + 속칸.join("") + '</div>'
      : "") +
    '<div style="display:flex;gap:8px;margin-top:10px">' +
      '<button class="시트줄" data-가=특징고치기 style="flex:1;padding:10px 0;' +
        'font-size:13px;font-weight:600;background:var(--바탕2);border-radius:10px">' +
        '✎ 고치기</button>' +
      '<button class="시트줄" data-가=특징다시 style="flex:1;padding:10px 0;' +
        'font-size:13px;color:var(--흐림);background:var(--바탕2);border-radius:10px">' +
        '↻ 다시 뽑기</button>' +
    '</div></div>';
}

const 만단위 = n => n >= 10000 ? (n / 10000).toFixed(1) + '만' : String(n);
const 칸그리기 = (제목, 글) => !글 ? '' :
  '<div class="칸"><h2>' + 제목 + '</h2><div class="글">' + 안전(글) + '</div></div>';
/* **인트로 도막을 앱 꼴로 바꾼다.**

   ★ 260910 — 플롯 서른 개가 전부 인트로가 비어 보였다. 까닭은 **꼴이 다른 것**이었다 —
     대화 도막 : {contents: [{type:"TEXT", text, speakerName, position}]}
     인트로 도막: {type:"text", content:"…", senderType:"BOT", senderId}
   앱은 contents 만 찾아서 늘 빈 값을 냈고, 새 대화도 소개 한 줄로 시작했다.

   senderId 를 characters 와 맞춰 누가 말하는지 되살린다.
   맞는 인물이 없으면 내레이터로 둔다 (제타도 그렇게 그린다) */
function 인트로도막(플롯, 방){
  const 인 = ((플롯 && 플롯.intros) || [])[0];
  const 대화 = 인 && (인.conversation || {});
  const 목 = (대화 && (대화.messages || (Array.isArray(대화) ? 대화 : null))) || [];
  /* ★ 260911 — **인트로 인물이 통째로 내레이터로 떨어지고 있었다.**

     제타 플롯 서른 개를 다 재 보니 `characters` 에 **id 칸이 없다** (name·description·imageUrl 뿐).
     그런데 인트로 도막의 `senderId` 는 `_NARRATOR_` 아니면 UUID 다.
     그래서 이름표가 늘 비었고 — **인물 대사가 전부 내레이터로 깔렸다.**

     폰에서 실제로 눌러 보고 찾았다. 「소꿉친구가 나에게 이상한 선물을 줬다」 방을 새로 여니
     인트로 아홉 도막이 다 ≡ 로 떴고, 그 되먹임을 받아 **새 답도 이름줄 없이 나왔다.**

     ★ 고치는 법 — `_NARRATOR_` 만 내레이터로 본다.
       그 밖의 senderId 는 인물이다. **나온 차례대로** characters 에 맞춘다.
       인물이 하나인 플롯이 대부분이라 이것으로 맞는다.                          */
  const 이름표 = {};
  for (const c of ((플롯 && 플롯.characters) || [])) if (c && c.id) 이름표[c.id] = c.name;
  {
    const 캐 = ((플롯 && 플롯.characters) || []).filter(c => c && c.name);
    const 본것 = [];
    const 목2 = 목;
    for (const m of 목2){
      const sid = m && m.senderId;
      if (!sid || sid === "_NARRATOR_" || m.senderType === "USER") continue;
      if (이름표[sid]) continue;
      if (본것.indexOf(sid) < 0) 본것.push(sid);
    }
    본것.forEach((sid, i) => { if (캐[i] && 캐[i].name) 이름표[sid] = 캐[i].name; });
    /* 인물보다 senderId 가 많으면 나머지는 첫 인물로 — 내레이터로 뭉뚱그리는 것보다 낫다 */
    if (캐.length) for (const sid of 본것) if (!이름표[sid]) 이름표[sid] = 캐[0].name;
  }
  const 때 = new Date().toISOString();
  const 낸것 = [];
  for (const m of 목){
    /* 이미 앱 꼴이면 그대로 쓴다.

       ★ 260912 — **그대로 쓰면 안 되는 것이 둘 있었다.**
         자동생성 플롯이 이 길로 온다. 그래서 회원님이 보신 흠 둘이 여기서 났다 —
           「직접 우상단 통해 내 프로필을 확정했는데도 여전히 인트로는 **{{user}}라고
            변수명이 그대로** 출력된다」
           「인트로에 **서연우 이름이 두 번 반복**된다. 뭘까?」
         아래 날글 쪽은 고쳐 두었는데 **이 가지만 안 탔다.** */
    if (Array.isArray(m.contents)){
      const 조각 = m.contents.filter(c => c.type === "TEXT" && c.text).map(c => {
        let 글 = 이름채우기(String(c.text), 플롯, 방);
        const 이 = String(c.speakerName || "").trim();
        if (이 && 이 !== "내레이터"){
          const 줄 = 글.split(NL);
          while (줄.length > 1 && 줄[0].trim() === 이) 줄.shift();
          글 = 줄.join(NL).trim();
        }
        return {...c, text: 글};
      }).filter(c => c.text);
      if (조각.length) 낸것.push({sender: {type: "BOT"}, contents: 조각, messageTime: 때});
      continue;
    }
    if (m.type === "image" && m.url){
      낸것.push({sender: {type: "BOT"}, 그림: m.url, contents: [], messageTime: 때});
      continue;
    }
    /* ★ 260912 회원님 지적 — 「직접 우상단 통해 내 프로필을 확정했는데도
       **여전히 인트로는 {{user}}라고 변수명이 그대로 출력**된다」

       까닭이 여기였다 — 인트로 글만 `이름채우기()` 를 안 거치고 날글로 들어갔다.
       ★ 회원님이 이어서 물으신 것 — 「이거, **이름 받침에 따라 과/와 등의 조사가
         어색해질텐데**, 어떻게 하냐?」 → `자리채우기()` 가 조사를 맞춘다 */
    let 글 = 이름채우기(String(m.content || "").trim(), 플롯, 방);
    if (!글) continue;
    const 유저 = (m.senderType === "USER");
    const 이름 = 이름표[m.senderId] || "";

    /* ★ 260912 회원님 지적 — 「인트로에 **서연우 이름이 두 번 반복**된다. 뭘까?」
       자동생성 인트로는 글 첫 줄에 이름을 한 번 쓰고 오는데,
       앱이 `speakerName` 으로 **또** 얹어서 두 번이 됐다. 첫 줄이 그 이름이면 뗀다 */
    if (!유저 && 이름){
      const 줄 = 글.split(NL);
      while (줄.length > 1 && 줄[0].trim() === 이름) 줄.shift();
      글 = 줄.join(NL).trim();
      if (!글) continue;
    }
    낸것.push({sender: {type: 유저 ? "USER" : "BOT"},
      contents: [{type: "TEXT",
                  position: 유저 ? "RIGHT" : (이름 ? "LEFT" : "NARRATOR"),
                  speakerName: 유저 ? "" : (이름 || "내레이터"), text: 글}],
      messageTime: 때});
  }
  return 낸것;
}

function 인트로글(p, 방){
  return 인트로도막(p, 방).map(m => (m.contents || [])
    .filter(x => x.type === "TEXT")
    .map(x => (x.speakerName ? x.speakerName + NL : "") + x.text).join(NL))
    .filter(x => x.trim()).join(NL + NL);
}

/* ★★★★★ 260913 — **로어북을 항목째로 보낸다.**

   전에는 이렇게 보냈다 —
     설정집: (플롯.lorebooks || []).map(l => l.description).join(NL)
   `description` 은 **로어북 제목 밑의 제작자 메모**다. 정작 내용인 `items` 를 다 버렸다.
   제타 원본 체육관 플롯을 재 보니 항목이 **186개 · 22,933자**인데
   프롬프트에 간 것은 **258자**였고 그 내용이 「아마 이것 한 권으로 어떻게든 될 것이다」였다.

   그 186개에 이런 것들이 있다 — 반복 억제 · 시점 고정 · 2인칭에 대하여 ·
   메타 발언 금지 · 내면 외면 분리 · 거리감 제어 · 남발 금지 단어.
   **내가 프롬프트에서 며칠 걸려 고친 것들이 플롯에 이미 적혀 있었다.**

   ★ 통째로 보내면 프롬프트가 부푼다. **중계가 열쇠말로 걸러** 넣는다 —
     그래서 여기서는 **항목을 그대로** 넘기고 고르는 일은 중계에 맡긴다.  */
function 로어북글(플롯){
  const 책들 = (플롯 && 플롯.lorebooks) || [];
  if (!책들.length) return "";
  const 줄 = [];
  for (const b of 책들){
    for (const it of (b.items || [])){
      const 내용 = String(it.content || "").trim();
      if (!내용) continue;
      const 말 = (it.keywords || []).filter(Boolean).join(",");
      /* 중계가 가를 수 있게 한 줄 꼴로 — 「이름|열쇠말|내용」 */
      줄.push("◆" + String(it.name || "").trim() + "|" + 말 + "|" + 내용.split(NL).join(" "));
    }
  }
  return 줄.join(NL);
}

/* ══ 데타 설정집 ══

   ★ 260913 회원님 지시 —
     「현 데타에 **설정집 기능**을 구축하는게 더 가치있다고 본다.
      설정집 생성, 플롯 생성시 기존 설정집 연결, 플롯 사용시 기존 설정집 연결한 대화방 생성.
      설정집은 마찬가지로 **제타처럼 특정 키워드가 나왔을 때 같이 토큰을 발송하는 식**이 좋을 것
      같은데, 우리 모델은 수발신 토큰수가 높으면 안되니까 **제한을 두고 명시**해주는게 좋겠다.」

   ★ **얼개를 새로 만들지 않는다.** 제타 로어북과 같은 한 줄 꼴로 펴서 보내고,
     고르고 자르는 일은 이미 있는 중계 `로어북고르기()` 가 그대로 한다.
     다른 것은 하나다 — 「늘 넣는다」로 켠 항목은 이름 앞에 `*` 를 붙여 보낸다.  */
const 설정집한도기본 = 3500;
const 새설정집아이디 = () =>
  "설-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
/* 1,000 자리마다 쉼표 — 정규식을 안 쓴다 (G6) */
const 쉼표수 = n => {
  const s = String(n); let 낸것 = "";
  for (let i = 0; i < s.length; i++){
    if (i > 0 && (s.length - i) % 3 === 0) 낸것 += ",";
    낸것 += s.charAt(i);
  }
  return 낸것;
};

function 설정집한도(){
  const v = Number(설정("설정집한도") || 0);
  return (v >= 500 && v <= 8000) ? v : 설정집한도기본;
}
function 설정집들(){
  try { return JSON.parse(localStorage.getItem("설정집") || "[]"); } catch(_){ return []; }
}
function 설정집담기(목){
  try { localStorage.setItem("설정집", JSON.stringify(목)); }
  catch(_){ 알림("담기 실패 — 자리가 모자랍니다"); }
}
function 설정집찾기(id){ return 설정집들().find(x => x.id === id) || null; }
function 설정집자수(책){
  let n = 0;
  for (const it of ((책 && 책.항목) || [])) n += String(it.글 || "").length;
  return n;
}
/* 「늘 넣는다」로 켠 것 — **한도 밖으로 매 턴 실리는 양**이다. 화면에 이것을 꼭 보여 드린다 */
function 설정집늘셈(책){
  let 몇 = 0, 자 = 0;
  for (const it of ((책 && 책.항목) || [])) if (it.늘){ 몇++; 자 += String(it.글 || "").length; }
  return {몇: 몇, 자: 자};
}
function 설정집새로만들기(){
  const 목 = 설정집들();
  const id = 새설정집아이디();
  목.push({id: id, 제목: "새 설정집", 항목: [], 만든때: new Date().toISOString()});
  설정집담기(목);
  return id;
}
function 설정집제목담기(id){
  const 칸 = $("#편_책제목");
  if (!칸) return;
  const 목 = 설정집들();
  const 책 = 목.find(x => x.id === id);
  if (!책) return;
  책.제목 = String(칸.value || "").trim() || "새 설정집";
  설정집담기(목);
}

/* 이 방(없으면 이 플롯)이 이은 설정집을 **로어북과 같은 한 줄 꼴**로 펴서 낸다.
   ★ `방.설정집들` 이 칸째로 없으면 플롯 것을 따르고, **빈 배열이면 안 싣는다는 뜻**이다 */
function 설정집글(플롯, 방){
  const 목 = (방 && 방.설정집들) ? 방.설정집들 : ((플롯 && 플롯.설정집들) || []);
  if (!목.length) return "";
  const 줄 = [];
  for (const id of 목){
    const 책 = 설정집찾기(id);
    if (!책) continue;
    for (const it of (책.항목 || [])){
      const 내용 = String(it.글 || "").trim();
      if (!내용) continue;
      const 말 = (it.말 || []).filter(Boolean).join(",");
      /* ★ 늘 넣을 것은 이름 앞에 * — 중계가 그것을 보고 한도와 상관없이 싣는다 */
      줄.push("◆" + (it.늘 ? "*" : "") + String(it.이름 || "").trim() + "|" + 말 + "|" +
              내용.split(NL).join(" "));
    }
  }
  return 줄.join(NL);
}
/* 제타에서 딸려 온 로어북과 데타 설정집을 **함께** 싣는다. 꼴이 같으니 그냥 이어 붙인다 */
function 설정집합치기(플롯, 방){
  const 가 = 로어북글(플롯);
  const 나 = 설정집글(플롯, 방);
  return (가 && 나) ? (가 + NL + 나) : (가 || 나);
}
/* 이 방에 몇 권 · 몇 자가 이어져 있나 — 방메뉴 밑말에 쓴다 */
function 방설정집셈(방, 플롯){
  const 목 = (방 && 방.설정집들) ? 방.설정집들 : ((플롯 && 플롯.설정집들) || []);
  let 권 = 0, 자 = 0;
  for (const id of 목){ const b = 설정집찾기(id); if (!b) continue; 권++; 자 += 설정집자수(b); }
  return {권: 권, 자: 자};
}

/* 제타 로어북 한 권을 데타 설정집 한 권으로 — 들이기와 거두기가 같이 쓴다.
   ★ 항목 **이름을 그대로** 둔다. 중계의 `늘넣을것` 이름표가 그 이름으로 걸리기 때문이다 */
function 로어북을책으로(b, 플롯이름){
  const 항목 = [];
  for (const it of ((b && b.items) || [])){
    const 내용 = String(it.content || "").trim();
    if (!내용) continue;
    항목.push({이름: String(it.name || "").trim(),
               말: (it.keywords || []).filter(Boolean),
               글: 내용, 늘: false});
  }
  return {id: 새설정집아이디(),
          제목: String((b && b.title) || 플롯이름 || "설정집"),
          항목: 항목, 만든때: new Date().toISOString()};
}

/* ★ 딸려 온 로어북을 내 설정집으로 거둔다 — **손으로 고르실 때만** 한다.
   거두면 고칠 수 있게 되지만 `플롯고침` 에 사본이 남는다(체육관 플롯은 22,933자다).
   그래서 원본 `lorebooks` 는 비운다 — 두 벌이 되면 같은 글이 두 번 실린다 */
function 로어북거두기(플롯){
  if (!플롯) return;
  const 책들 = (플롯.lorebooks || []);
  if (!책들.length) return 알림("딸려 온 로어북이 없습니다");
  const 목 = 설정집들();
  const 새것 = [];
  for (const b of 책들){
    const 것 = 로어북을책으로(b, 플롯.name);
    if (!(것.항목 || []).length) continue;
    목.push(것); 새것.push(것.id);
  }
  if (!새것.length) return 알림("거둘 항목이 없습니다");
  설정집담기(목);
  const p = Object.assign({}, 플롯, {설정집들: (플롯.설정집들 || []).concat(새것),
                                     lorebooks: [], 로어북거둠: true});
  플롯고침담기(p);
  S.플롯 = p; 시트닫기(); 그리기();
  알림("설정집 " + 새것.length + "권으로 거뒀습니다");
}

/* ★ 불러오기 — 세 꼴을 다 받는다.
     ① 설정집만 낸 것 ② 전부 꾸러미 ③ 제타 플롯 JSON (그 안의 lorebooks) */
function 설정집꼴로(j){
  if (Array.isArray(j) && j.length && j[0] && j[0].항목) return j;
  if (j && Array.isArray(j.설정집)) return j.설정집;
  const 낸것 = [];
  for (const b of ((j && j.lorebooks) || [])){
    const 것 = 로어북을책으로(b, (j && j.name) || "");
    if ((것.항목 || []).length) 낸것.push(것);
  }
  return 낸것;
}
function 설정집들이기(){
  const 칸 = document.createElement("input");
  칸.type = "file"; 칸.accept = ".json,application/json";
  칸.style.display = "none";
  document.body.appendChild(칸);
  칸.addEventListener("change", async () => {
    try {
      const f = (칸.files || [])[0];
      if (!f) return;
      const 들어온 = 설정집꼴로(JSON.parse(await f.text()));
      if (!들어온.length){ 알림("설정집을 못 찾았습니다"); return; }
      const 목 = 설정집들();
      for (const b of 들어온){
        if (!b.id || 목.some(x => x.id === b.id)) b.id = 새설정집아이디();
        b.항목 = b.항목 || [];
        목.push(b);
      }
      설정집담기(목);
      시트닫기(); 그리기();
      알림("설정집 " + 들어온.length + "권을 들였습니다");
    } catch(_){ 알림("못 읽었습니다 — JSON 이 아닙니다"); }
    finally { 칸.remove(); }
  });
  칸.click();
}

/* ── 설정집 시트 ──
   ★ 시트가 시트를 덮는 길을 그대로 쓴다(`시트열기` 가 밑에 깔린 것을 쌓아 둔다).
     다만 **덮기 전에 치던 제목을 먼저 담는다** — 덮으면 `innerHTML` 이 갈려 사라진다 */
function 설정집열기(id){
  const 책 = 설정집찾기(id);

           String(it.글 || "").length + "자" + (it.늘 ? " · 늘 넣는다" : "")})).join("");
  시트열기("설정집",
    "<div style='padding:0 12px'>" +
      칸틀("책제목", "설정집 이름 — 예) 체육관 기본 규칙", 책.제목 || "", 0, 40) +
      "<div class='칸제목' style='padding-left:0;margin-top:16px'>항목 " +
        (책.항목 || []).length + "개" +
        " <span style='color:var(--흐림);font-weight:400'>모두 " + 쉼표수(설정집자수(책)) + "자" +
        (늘.몇 ? " · 늘 " + 늘.몇 + "개 " + 쉼표수(늘.자) + "자" : "") + "</span></div>" +
      "<div class='글' style='color:var(--흐림2);font-size:12px'>" +
        "열쇠말이 그 자리에 나온 항목만 실립니다. 한 턴에 " + 쉼표수(설정집한도()) + "자까지.<br>" +
        "★ 표가 붙은 항목은 한도와 상관없이 **늘** 실립니다.</div>" +
    "</div>" + 줄 +
    시트줄("＋", "항목 넣기", "항목열기", {값: 책.id + "@새"}) +
    시트줄("⤓", "이 설정집만 내보내기", "설정집내기", {값: 책.id, 밑: "JSON — 다른 기기로 옮길 때"}) +

    "<div class='시트단추'><button data-시트=닫기>그만</button>" +
    "<button class='강' data-시트=설정집저장 data-값='" + 안전(책.id) + "'>담기</button></div>");
}

/* ── 항목 시트 ──
   ★ 토큰 지킴이 — 내용은 **600자까지**만 받는다. 늘 넣는 것은 매 턴 값이 드니 따로 알린다 */

/* ── 네모칸 고르개 ── 플롯편집 · 플롯 화면 · 방메뉴 셋이 같이 쓴다 */
function 설정집고르기속(켠){
  const 목 = 설정집들();
  if (!목.length)
    return "<div class='글' style='color:var(--흐림);font-size:12px'>" +
           "아직 설정집이 없습니다. 만들기 화면에서 먼저 만드십시오.</div>";
  return 목.map(b => {
    const 늘 = 설정집늘셈(b);
    return "<label style='display:flex;align-items:flex-start;gap:9px;margin:9px 0;font-size:13px'>" +
      "<input type='checkbox' class='설집' data-책='" + 안전(b.id) + "'" +
        (((켠 || []).indexOf(b.id) >= 0) ? " checked" : "") + ">" +
      "<span>" + 안전(b.제목 || "(제목 없음)") +
        "<br><span style='color:var(--흐림);font-size:11px'>항목 " + (b.항목 || []).length +
        "개 · 모두 " + 쉼표수(설정집자수(b)) + "자" +
        (늘.몇 ? " · 늘 " + 늘.몇 + "개 " + 쉼표수(늘.자) + "자" : "") +
        "</span></span></label>";
  }).join("");
}
/* 시트 안에서 켠 것을 읽는다 — 플롯저장·방설정집저장·플롯설정집저장이 같이 쓴다 */
function 고른설정집들(){
  const 낸것 = [];
  const 것들 = document.querySelectorAll("#시트 input.설집");
  for (const el of 것들) if (el.checked) 낸것.push(el.dataset.책);
  return 낸것;
}

/* ── 플롯 화면의 설정집 칸 ── */
function 설정집칸(p){
  const 이은 = (p.설정집들 || []).map(설정집찾기).filter(Boolean);
  let 로어 = 0;
  for (const b of (p.lorebooks || [])) 로어 += ((b.items || []).length);
  let 속 = "";
  속 += 이은.length
    ? 이은.map(b => "· " + 안전(b.제목) + "  (항목 " + (b.항목 || []).length + "개 · " +
                    쉼표수(설정집자수(b)) + "자)").join("<br>") + "<br>"
    : "<span style='color:var(--흐림)'>이은 설정집이 없습니다.</span><br>";
  if (로어) 속 += "<span style='color:var(--흐림2)'>제타 로어북 " + 로어 +
                  "항목이 딸려 있습니다 — 그대로 함께 실립니다.</span><br>";
  return '<div class="칸"><h2>설정집' +
    ' <span style="font-size:11px;color:var(--흐림);font-weight:400">' +
    '한 턴 ' + 쉼표수(설정집한도()) + '자까지 · 열쇠말이 나온 것만</span></h2>' +
    '<div class="글" style="line-height:1.9">' + 속 + '</div>' +
    '<button class="시트줄" data-가=설정집잇기 style="padding:8px 0;font-size:12px">' +
      '＋ 설정집 잇기 · 끊기</button>' +
    (로어 ? '<button class="시트줄" data-가=로어북거두기 style="padding:8px 0;font-size:12px;' +
            'color:var(--흐림)">↧ 딸려 온 로어북을 내 설정집으로 거두기</button>' : "") +
    '</div>';
}


/* ══ 내보내기 ══

   ★ 260910 회원님 —
     「채팅의 설정에 내보내기를 만들어서, 채팅내용, 플롯내용, 유저프로필 등의 로그를 내보내라.」
     「마이페이지에 내보내기를 만들어서, 유저가 변경하거나 새로 쌓을 수 있는
      모든 분석가능한 로그를 내보내라.」

   ★ **분석할 수 있게** 낸다 — 사람이 읽는 글이 아니라 JSON 이다.
     열쇠와 초대 코드는 **빼고** 낸다 */
function 파일로내리기(이름, 글){
  try {
    const 덩이 = new Blob([글], {type: "application/json;charset=utf-8"});
    const 길 = URL.createObjectURL(덩이);
    const a = document.createElement("a");
    a.href = 길; a.download = 이름;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(길); a.remove(); }, 800);
    return true;
  } catch(_){ return false; }
}
const 때딱지 = () => {
  const d = new Date(); const z = n => (n < 10 ? "0" : "") + n;
  return String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) +
         "_" + z(d.getHours()) + z(d.getMinutes());
};

/* 이 방 하나 — 채팅 · 플롯 · 유저 프로필 */
function 방내보내기(){
  const 방 = S.방;
  const 플롯 = 지금플롯() || {};
  const 꾸러미 = {
    낸때: new Date().toISOString(),
    무엇: "방 하나",
    /* ★ 260911 — **모델을 함께 담는다.**
       회원님이 「이 방이 이상하다」 하셨을 때 어느 모델이었는지 알 수 없었다.
       정예원 방 신고를 받고 되짚어 보려는데 자료에 모델이 없어 확인이 막혔다 */
    방: {id: 방.id, 제목: 방.제목, 플롯아이디: 방.플롯아이디, 모델: 방.모델 || "",
         프로필아이디: 방.프로필아이디 || "", 이어하기수: (방.이어하기 || []).length},
    유저프로필: 방프로필(방, 플롯),
    플롯: 플롯,
    /* ★ 260913 — **특징을 함께 담는다.** 「이 방이 이상하다」 하실 때
       어느 특징으로 돌았는지, 어느 칸을 손으로 고쳤는지 알 수 있어야 한다 */
    특징: 특징읽기(방.플롯아이디) || null,
    기억: 기억읽기(방.id),
    메모: 메모읽기(방.id),
    도막: D.도막[방.id] || []
  };
  const 됨 = 파일로내리기("데타_" + String(방.제목).slice(0, 10) + "_" + 때딱지() + ".json",
                          JSON.stringify(꾸러미, null, 1));
  시트닫기();
  알림(됨 ? "내보냈습니다" : "내보내기에 실패했습니다");
}

/* 전부 — 회원님이 바꾸거나 쌓은 것 모두 */
function 다내보내기(){
  const 메모들 = {};
  const 기억들 = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("메모_") === 0) 메모들[k.slice(3)] = localStorage.getItem(k);
      if (k && k.indexOf("기억_") === 0){
        try { 기억들[k.slice(3)] = JSON.parse(localStorage.getItem(k)); } catch(_){}
      }
    }
  } catch(_){}
  let 시간 = [];
  try { 시간 = JSON.parse(localStorage.getItem("시간") || "[]"); } catch(_){}
  const 꾸러미 = {
    낸때: new Date().toISOString(),
    무엇: "전부",
    빌드: (typeof 빌드 !== "undefined" ? 빌드 : null),
    고른모델: 설정("모델설정") || 기본모델,
    프로필: 프로필들(),
    스크랩: 스크랩들(),
    지은플롯: 지은것읽기(),
    고친플롯: 플롯고침들(),
    새방: (() => { try { return JSON.parse(localStorage.getItem("새방") || "[]"); }
                   catch(_){ return []; } })(),
    새도막: (() => { try { return JSON.parse(localStorage.getItem("새도막") || "{}"); }
                     catch(_){ return {}; } })(),
    기억: 기억들,
    메모: 메모들,
    /* ★ 260913 — **특징이 통째로 빠져 있었다.** 회원님이 손으로 고친 것이 여기 들어 있다 */
    특징: 특징들(),
    특징칸목록: 칸목록읽기(),
    /* ★ 260913 — 설정집도 회원님이 손으로 쌓으신 것이다. 함께 낸다 */
    설정집: 설정집들(),
    설정집한도: 설정집한도(),

    걸린시간: 시간
  };
  const 됨 = 파일로내리기("데타_전부_" + 때딱지() + ".json",
                          JSON.stringify(꾸러미, null, 1));
  알림(됨 ? "내보냈습니다" : "내보내기에 실패했습니다");
}

/* ══ 인물 특징 ══

   ★ 260912 회원님 단상 —
     「최초앱은 호감/반감/긴장/경계가 있었지만 데타는 그게 없어서 모두 동일한 스탯을
      갖는 건 아닐까 … **플롯 정보에 따라 인물상이 달라지지 않는다는 것.**」

   플롯을 중계에 보내면 여덟 칸으로 갈라 돌려준다 —
     자아 · 의도 · 방향 · 상태 · 거절 · 무너짐 · 버릇 · **모르는것**

   ★ **대화 화면에는 안 보인다.** 플롯 화면에서만 확인한다 (회원님 지시 C).
     다만 프롬프트에는 매 턴 들어간다 — 그래야 인물상이 달라진다 */
function 특징들(){

}
function 특징읽기(플롯아이디){

}
function 특징담기(플롯아이디, 것){
  const 표 = 특징들();
  표[플롯아이디] = 것;
  try { localStorage.setItem("특징", JSON.stringify(표)); } catch(_){}
}

/* ══ 특징 고치기 — 뼈대 ══

   ★ 260913 회원님 지시 —
     「특징뽑기 **생성된 결과를 유저가 직접 편집할 수 있게** 해줘.
      그 결과도 **플롯에 반영되게 연동**해주고.」

   ★ **칸 이름을 앱에 박지 않는다.** 중계 `특징.js` 가 정한다 —
     260913 하루에 열 개에서 스물여섯 개(칸들 15 + 판칸 11)로 늘었다.
     박아 두면 칸이 늘 때마다 앱을 고쳐야 하고, 고치는 걸 잊으면
     새 칸이 **화면에 아예 안 보인다.** 그래서 `/trait` 답에 실려 오는
     칸목록을 담아 두고 그것으로 화면을 그린다.

   ★ 곁칸 넷을 얹는다. 이름이 `_` 로 시작하므로 중계 칸 이름과 안 부딪힌다
     (지금 스물여섯 칸 가운데 `_` 로 시작하는 것이 없음을 확인했다) —
       `_손질`  {칸이름: true}          사람이 고친 칸
       `_모델`  {칸이름: "원래 값"}      되돌리기용
       `_고친때` ISO 글자
       `_낡음`  true                    플롯 글이 바뀌었다는 딱지
     중계 `특징글`·`판글` 은 `칸들`·`판칸` 을 **이름으로만** 훑으므로 곁칸은 저절로 빠진다 */

/* ★ 회원님 : 「우리 모델은 수발신 토큰수가 높으면 안되니까 제한을 두고 명시해주는게 좋겠다.」
   한 칸 180자 · 프롬프트에 실리는 전부 1600자. 두 곳에 **늘 보여** 드린다 */
const 칸한도 = 180;
const 특징글한도 = 1600;
/* 칸목록이 아직 안 왔을 때 쓰는 자 — 중계 `특징글`·`판글` 이 건너뛰는 칸과 같은 벌 */
const 안실릴칸 = ["부름", "자리", "어긋난자리"];

function 칸목록읽기(){
  try {
    const 목 = JSON.parse(localStorage.getItem("특징칸목록") || "[]");
    return Array.isArray(목) ? 목 : [];
  } catch(_){ return []; }
}
function 칸목록담기(목){
  if (!Array.isArray(목) || !목.length) return;
  try { localStorage.setItem("특징칸목록", JSON.stringify(목)); } catch(_){}
}

/* 이 플롯에서 보일 칸 — 중계가 준 차례를 먼저 쓰고, 목록에 없는 칸은 뒤에 붙인다.
   ★ 칸목록이 아직 없으면(옛 기기) 담긴 특징의 열쇠 차례를 그대로 쓴다.
     그래야 중계를 안 올려도 고칠 수는 있다 */
function 보일칸들(것){
  const 본 = []; const 봤나 = {};
  for (const c of 칸목록읽기()){
    const 이 = String((c && c.이름) || "").trim();
    if (!이 || 봤나[이]) continue;
    봤나[이] = 1;
    본.push({이름: 이, 물음: String((c && c.물음) || ""),
             벌: (c && c.벌 === "판") ? "판" : "사람",
             실림: (c && c.실림 === false) ? false : true});
  }
  for (const k of Object.keys(것 || {})){
    if (k.charAt(0) === "_" || 봤나[k]) continue;
    봤나[k] = 1;
    본.push({이름: k, 물음: "", 벌: "사람", 실림: 안실릴칸.indexOf(k) < 0});
  }
  return 본;
}

const 손질했나 = (것, 칸) => !!(((것 || {})._손질) || {})[칸];

/* 프롬프트에 실릴 글자를 센다 — 중계 `특징글` 과 같은 셈이다
   (실리는 칸만 · 빈 칸과 「—」는 빼고 · 「이름 — 값」 한 줄씩) */
function 특징자수(것){
  if (!것) return {자: 0, 토큰: 0, 넘었나: false, 긴칸: []};
  let 자 = 0; const 긴칸 = [];
  for (const c of 보일칸들(것)){
    if (!c.실림) continue;
    const v = String(것[c.이름] || "").trim();
    if (!v || v === "—") continue;
    자 += c.이름.length + 3 + v.length + 1;   /* 「이름 — 값」 + 줄바꿈 */
    긴칸.push({이름: c.이름, 자: v.length});
  }
  긴칸.sort((a, b) => b.자 - a.자);
  /* ★ 한국어는 대체로 1토큰에 1.3자쯤이다. 넉넉히 잡아 보여 드린다 — 「어림」이라 적는다 */
  return {자: 자, 토큰: Math.ceil(자 / 1.3), 넘었나: 자 > 특징글한도,
          긴칸: 긴칸.slice(0, 3)};
}
const 특징한줄 = 것 => {
  if (!것) return "아직 안 뽑았습니다";
  const 잰 = 특징자수(것);
  const 손 = Object.keys(((것)._손질) || {}).length;
  return 잰.자 + "자 · 어림 " + 잰.토큰 + "토큰" + (손 ? " · 내가 고친 칸 " + 손 : "");
};

/* 이 칸을 사람 손으로 고친다. 모델이 뽑았던 값은 `_모델` 에 남겨 되돌릴 수 있게 둔다 */
function 특징칸고침담기(플롯아이디, 칸, 값){
  const 것 = Object.assign({}, 특징읽기(플롯아이디) || {});
  const 손 = Object.assign({}, 것._손질 || {});
  const 모 = Object.assign({}, 것._모델 || {});
  if (!(칸 in 모)) 모[칸] = String(것[칸] == null ? "" : 것[칸]);
  /* ★ 한 칸은 한 줄이다 — 중계 `특징가르기` 가 여러 줄을 한 줄로 붙여 담는다.
     줄바꿈을 그대로 두면 프롬프트의 칸 가름이 흐려진다 */
  것[칸] = String(값 == null ? "" : 값).replace(/\s+/g, " ").trim().slice(0, 칸한도);
  손[칸] = true;
  것._손질 = 손; 것._모델 = 모; 것._고친때 = new Date().toISOString();
  특징담기(플롯아이디, 것);
  return 것;
}
/* 이 칸을 모델이 뽑은 것으로 되돌린다 */
function 특징칸되돌리기(플롯아이디, 칸){
  const 것 = Object.assign({}, 특징읽기(플롯아이디) || {});
  const 손 = Object.assign({}, 것._손질 || {});
  const 모 = Object.assign({}, 것._모델 || {});
  if (칸 in 모) 것[칸] = 모[칸];
  delete 손[칸]; delete 모[칸];
  것._손질 = 손; 것._모델 = 모;
  특징담기(플롯아이디, 것);
  return 것;
}

/* ★★★ 다시 뽑을 때 — **사람이 고친 칸은 덮지 않는다** (회원님 지시)
   모델이 방금 낸 값은 버리지 않고 `_모델` 에 넣어 둔다.
   그래서 나중에 「⟲ 모델 것으로」를 누르면 그때 바꿔 끼울 수 있다 */
function 사람칸지키기(있던, 새것){
  const 손 = ((있던 || {})._손질) || {};
  const 것 = {}; const 모 = {};
  for (const k of Object.keys(새것 || {})){
    if (k.charAt(0) === "_") continue;
    것[k] = 새것[k]; 모[k] = 새것[k];
  }
  for (const k of Object.keys(손)){
    if (!손[k]) continue;
    const v = String((있던 || {})[k] == null ? "" : (있던)[k]).trim();
    if (v) 것[k] = v;                 /* 사람 것을 도로 놓는다 */
  }
  것._손질 = 손;
  것._모델 = 모;                       /* 모델이 방금 낸 것 */
  if ((있던 || {})._고친때) 것._고친때 = 있던._고친때;
  /* `_낡음` 은 안 옮긴다 — 다시 뽑았으므로 낡지 않았다 */
  return 것;
}

/* 플롯 글이 바뀌면 특징이 낡는다. **지우지 않는다** — 사람이 고친 칸이 들어 있다.
   딱지만 붙이고 화면에서 알린다 */
function 특징낡음표시(플롯아이디){
  const 것 = 특징읽기(플롯아이디);
  if (!것) return;
  특징담기(플롯아이디, Object.assign({}, 것, {_낡음: true}));
}

/* ── 칸 목록 시트 ──
   ★ 칸이 스물여섯이다. 한 시트에 입력칸 스물여섯을 놓으면 못 쓴다.
     **목록 한 겹 · 칸 하나 한 겹**으로 나눈다. `시트길` 얼개가 두 겹을 받아 준다
     (260911 에 방메뉴 → 모델 고르기로 실제로 쓰고 있는 길이다) */
function 특징고치기열기(){
  const p = S.플롯;
  if (!p) return;
  const 것 = 특징읽기(p.id) || {};
  const 잰 = 특징자수(것);
  const 줄들 = [];
  let 앞벌 = null;
  for (const c of 보일칸들(것)){
    const 벌 = !c.실림 ? "속" : (c.벌 === "판" ? "판" : "사람");
    if (벌 !== 앞벌){
      앞벌 = 벌;
      줄들.push('<div class="칸제목" style="padding-left:12px;margin-top:14px">' +
        (벌 === "사람" ? "어떤 사람인가"
         : 벌 === "판" ? "어떤 판인가"
         : "앱이 쓰는 칸 — 프롬프트에 안 실립니다") + '</div>');
    }
    const v = String(것[c.이름] || "").trim();
    const 있 = !!v && v !== "—";
    줄들.push(시트줄(손질했나(것, c.이름) ? "✎" : (있 ? "✦" : "＋"),
      c.이름, "특징칸",
      {값: c.이름,
       밑: (있 ? v.slice(0, 48) + (v.length > 48 ? "…" : "") + "   · " + v.length + "자"
               : "아직 없습니다"),
       빛: 손질했나(것, c.이름) ? "켬" : ""}));
  }
  시트열기("특징 고치기 — " + 안전(p.name),
    '<div class="글" style="padding:0 12px;font-size:12px;color:' +
      (잰.넘었나 ? 'var(--강조)' : 'var(--흐림2)') + '">' +
      '매 턴 프롬프트에 <b>' + 잰.자 + '자 · 어림 ' + 잰.토큰 + '토큰</b> 실립니다. ' +
      '한도는 전부 ' + 특징글한도 + '자, 한 칸 ' + 칸한도 + '자입니다.' +
      (잰.넘었나 ? '<br>★ 넘었습니다. 긴 칸 — ' +
        잰.긴칸.map(x => 안전(x.이름) + ' ' + x.자 + '자').join(" · ") : '') +
      (것._낡음 ? '<br>★ 플롯이 바뀌었습니다. 다시 뽑아도 <b>내가 고친 칸은 그대로 둡니다.</b>' : '') +
    '</div>' +
    줄들.join("") +
    '<div class="시트단추"><button data-시트=닫기>그만</button>' +
      '<button data-시트=특징다시뽑기>↻ 다시 뽑기</button>' +
      '<button data-시트=특징전부되돌>⟲ 전부 모델 것으로</button></div>');
}

/* ── 칸 하나 고치기 ── */
function 특징칸열기(칸){
  const p = S.플롯;
  if (!p || !칸) return;
  const 것 = 특징읽기(p.id) || {};
  const c = 보일칸들(것).find(x => x.이름 === 칸) ||
            {이름: 칸, 물음: "", 실림: 안실릴칸.indexOf(칸) < 0};
  const v = String(것[칸] || "").trim();
  const 모 = String((((것)._모델) || {})[칸] || "").trim();
  시트열기(칸 + " 고치기",
    '<div style="padding:0 12px">' +
      (c.물음 ? '<div class="글" style="font-size:12px;color:var(--흐림2);margin-bottom:8px">' +
        '<b>무엇을 묻는 칸인가</b><br>' + 안전(c.물음) + '</div>' : '') +
      /* ★ 이 둘은 앱이 기계로 읽는 칸이다. 값을 박지 않고 **무엇을 보는 칸인지**만 알린다
         (CLAUDE.md 5.4 — 제한·지정이 아니라 방향 제시) */
      (칸 === "부름"
        ? '<div class="글" style="font-size:12px;color:var(--흐림);margin-bottom:8px">' +
          '앱이 <b>플롯에 박힌 유저 이름을 지금 이름으로 갈아 끼우는 데</b> 쓰는 칸입니다. ' +
          '이름만 적습니다. 인물 이름을 적거나 열두 자를 넘기면 갈아 끼우기가 쉽니다. ' +
          '없으면 — 로 둡니다.</div>' : '') +
      (칸 === "자리"
        ? '<div class="글" style="font-size:12px;color:var(--흐림);margin-bottom:8px">' +
          '앱이 <b>한 턴을 얼마나 쪼갤지</b> 정하는 데 쓰는 칸입니다. ' +
          '「마주」 · 「움직임」 · 「섞임」 가운데 하나를 먼저 적고, 쉼표 뒤에 그렇게 본 까닭을 적습니다. ' +
          '셋 다 아니면 앱이 방 이름으로 굴립니다.</div>' : '') +
      '<textarea id="특징칸입력" maxlength="' + 칸한도 + '"' +
        ' placeholder="비우면 이 칸은 프롬프트에 안 실립니다"' +
        ' style="width:100%;min-height:110px">' + 안전(v) + '</textarea>' +
      '<div class="글" style="font-size:11px;color:var(--흐림);margin-top:6px">' +
        '한 칸 ' + 칸한도 + '자까지. 줄바꿈은 한 칸으로 붙습니다 — 한 줄로 적습니다.' +
        (c.실림 ? '' : ' 이 칸은 프롬프트에 안 실립니다.') + '</div>' +

/* 플롯 하나에서 뽑는다. 이미 있으면 다시 안 뽑는다 (다시뽑기 = true 면 뽑는다) */
async function 특징뽑기(플롯, 다시뽑기){
  if (!플롯) return null;
  if (!다시뽑기){
    const 있던 = 특징읽기(플롯.id);
    if (있던) return 있던;
  }
  const 중계 = 중계주소();
  const 어디 = 고른모델().업체;
  /* 구글 직접(gd)은 중계를 안 쓰므로 오픈라우터로 돌린다 */
  const 갈곳 = (어디 === "gd") ? "or" : 어디;
  const 초대 = 설정("초대");
  try {
    const r = await fetch(중계 + "/" + 갈곳 + "/trait", {
      method: "POST",
      headers: {"Content-Type": "application/json",
                ...(초대 ? {"X-Code": encodeURIComponent(초대)} : {})},
      body: JSON.stringify({
        제목: 플롯.name,
        한줄: 플롯.shortDescription,
        소개: 이름채우기(플롯.longDescription, 플롯),
        인물: (플롯.characters || [])[0] || {name: 플롯.name},
        유저이름: (방프로필(S.방, 플롯) || {}).이름 || "나",
        유저설명: (보낼프로필(S.방, 플롯) || {}).설명 || "",
        /* ★ 260913 — description(제작자 메모) 이 아니라 **항목째로** 보낸다. 고르는 일은 중계가 한다 */
        설정집: 이름채우기(설정집합치기(플롯, null), 플롯).slice(0, 30000),
        설정집한도: 설정집한도(),

        /* ★ 260912 — 인트로를 **원문 그대로** 보낸다.
           「부름」 칸이 플롯이 유저를 뭐라 부르는지 여기서도 본다 */
        인트로: 인트로글(플롯)
      })
    });
    const o = JSON.parse(await r.text());
    if (o.error) return null;
    /* ★ 260913 — **칸 목록을 함께 받아 담는다.** 칸은 중계가 정한다.
       한 번 뽑을 때 한 번만 실리므로 **턴 값에는 안 든다** */
    if (Array.isArray(o.칸목록) && o.칸목록.length) 칸목록담기(o.칸목록);
    const 낸것 = o.특징 || null;
    if (낸것 && Object.keys(낸것).length){
      /* ★★★ 사람이 고친 칸은 덮지 않는다 (회원님 260913 지시) */
      const 것 = 사람칸지키기(특징읽기(플롯.id), 낸것);
      특징담기(플롯.id, 것);
      return 것;
    }
  } catch(_){}
  return null;
}

     현 턴과 사용자 입력을 계속 이어갈 수 있도록 메모장처럼.」

   방마다 메모장이 하나다. 열면 **여태 적은 것이 그대로 이어져** 보이고,

/* ★ 260912 회원님 : 「신고용 메모 기능도 **각 대화(n개, 플롯 내부에 여러개 있는 그것)마다**
   저장되길 바란다는거.」

   방 하나 안에 대화가 여럿(이어하기 벌)이므로, **지금 보고 있는 대화**를 열쇠로 삼는다.
   방을 새로하기 하면 앞 대화는 「저장-…」 아이디를 받고 메모도 그쪽으로 따라간다 */
function 메모읽기(방아이디){
  try { return localStorage.getItem("메모_" + 방아이디) || ""; } catch(_){ return ""; }
}
function 메모담기(방아이디, 글){
  try { localStorage.setItem("메모_" + 방아이디, 글); } catch(_){}
}
/* 메모를 다른 아이디로 옮긴다 — 새로하기 · 이어열기 때 */
function 메모옮기기(옛, 새){
  try {
    const 글 = localStorage.getItem("메모_" + 옛);
    if (글){ localStorage.setItem("메모_" + 새, 글); localStorage.removeItem("메모_" + 옛); }
  } catch(_){}
}
/* ★ 260912 회원님 : 「신고내역 및 **기억도 방 별로** 적용 … 할 것」
   메모는 따라갔는데 기억은 안 따라갔다. 새로하기를 해도 앞 대화의 기억이 남아 있었다 */
function 기억옮기기(옛, 새){
  try {
    const 글 = localStorage.getItem("기억_" + 옛);
    if (!글) return;
    const j = JSON.parse(글); j.방 = 새;
    localStorage.setItem("기억_" + 새, JSON.stringify(j));
    localStorage.removeItem("기억_" + 옛);
  } catch(_){}
}
/* 그 대화에 적어 둔 것이 있나 — 이어하기 목록에서 보입니다 */
function 적은것있나(대화){
  const 메 = 메모읽기(대화).trim();
  const 기 = 기억글(기억읽기(대화)).trim();
  return {메모: !!메, 기억: !!기};
}

/* 지금 자리(마지막 봇 도막과 그 앞 내 말)를 글로 */
function 지금턴글(몇){

  const 앞 = 도막[i - 1];

  줄.push(도막글꺼내기(이));
  return 줄.join(NL);
}

/* **같은 플롯의 방을 하나로 합친다.**

   가장 최근 방을 남기고, 나머지는 그 방의 「이어하기」 벌로 넣는다.
   도막도 메모도 함께 따라간다. **한 번만 한다** — 합친 뒤엔 새 방이 안 생긴다 */
function 합치기(){
  const 묶음 = {};
  for (const r of D.방){
    const k = r.플롯아이디 || ("_" + r.id);
    (묶음[k] = 묶음[k] || []).push(r);
  }
  let 합친수 = 0;
  for (const k of Object.keys(묶음)){
    const 것 = 묶음[k];
    if (것.length < 2) continue;
    것.sort((a, b) => 방때(b) - 방때(a));
    const 남길 = 것[0];
    남길.이어하기 = 남길.이어하기 || [];
    for (const r of 것.slice(1)){
      const 도막 = D.도막[r.id] || [];
      if (도막.length){
        남길.이어하기.push({id: r.id,
                            savedAt: new Date(방때(r) || Date.now()).toISOString(),
                            만든때: r.만든때 || "",
                            도막수: 도막.length});
        /* 도막은 그대로 둔다 — 이어하기가 그 아이디로 찾는다 */
      } else {
        delete D.도막[r.id];
      }
      /* 남길 방의 이어하기도 물려받는다 */
      for (const e of (r.이어하기 || [])) 남길.이어하기.push(e);
      합친수++;
    }
    /* 최근 것부터 */
    남길.이어하기.sort((a, b) => Date.parse(b.savedAt || 0) - Date.parse(a.savedAt || 0));
    D.방 = D.방.filter(x => x === 남길 || 것.indexOf(x) < 0);
  }
  if (합친수){
    새것담기();
    setTimeout(() => 알림("같은 플롯의 대화 " + 합친수 + "개를 하나로 합쳤습니다"), 900);
  }
  return 합친수;
}

/* ══ 대화 프로필 ══

   ★ 260910 — **제타 화면을 직접 보고 그대로 만들었다.**
   회원님 : 「모든 플롯은 새 채팅을 시작하면 유저는 프로필을 입력할 수 있다.
            이름과 설명 2가지만 있는 수준이다. 제타 브라우저를 직접 확인하라.」

   제타의 「새 대화 프로필」 화면 —
     이름   (캐릭터가 날 이렇게 부를 거예요)
     설명   (선택) · 0/1000
     [ ] 기본 대화 프로필 — 새로운 대화 시작할 때 이 프로필 적용하기

   ★ 여기 적은 것이 **매 턴 프롬프트의 「나」로** 들어간다. 적어 두면 계속 먹는다 */
/* ══ 자리표 ══

   ★ 260912 회원님 : 「내 캐릭터 이름을 **확정해서 넣는 것이 아니라, {{user}}로 넣은 뒤**,
     매 상황에 맞게 출력하는게 옳다 … **고정값이 아니라 가변값**으로 설정하라는 거다.」

   ★ 조사까지 맞춘다. 안 맞추면 **축 A(자연스러움)를 가르치는 자리에서 어색한 한국어**가 된다 —
     「준가 무엇을 할지는」 → 준**이**  ·  「정예원는」 → 정예원**은**
     260911 에 프롬프트에서 한 번 데었다. 화면도 같다 */
const 받침있나 = 이름 => {
  const t = String(이름 || "").trim();
  if (!t) return false;
  const c = t.charCodeAt(t.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return false;   /* 한글이 아니면 모른다 — 안 바꾼다 */
  return (c - 0xAC00) % 28 !== 0;               /* 종성이 있으면 받침이다 */
};
/* 받침 없을 때 쓰는 것 : 받침 있을 때 쓰는 것 */
const 조사짝 = {"가": "이", "는": "은", "를": "을", "와": "과",
                "랑": "이랑", "야": "아", "로": "으로"};
function 자리채우기(글, 표, 이름){
  const 원 = String(글 == null ? "" : 글);
  if (!이름 ||원.indexOf(표) < 0) return 원;
  const 받 = 받침있나(이름);
  const 토막 = 원.split(표);
  let 낸것 = 토막[0];
  for (let i = 1; i < 토막.length; i++){
    const 뒤 = 토막[i], 첫 = 뒤.charAt(0);
    if (받 && 조사짝[첫]) 낸것 += 이름 + 조사짝[첫] + 뒤.slice(1);
    else 낸것 += 이름 + 뒤;
  }
  return 낸것;
}

/* ★ 260912 — **플롯에 박힌 유저 이름**을 찾는다.
   특징의 「부름」 칸이 그것이다. 모델이 플롯 글을 읽고 문맥으로 골라 준다.
   글자로 찾으면 「준비」의 「준」까지 걸린다 */
function 박힌이름(플롯){
  if (!플롯) return "";
  const 특 = 특징읽기(플롯.id);
  const 부 = String((특 || {}).부름 || "").trim();
  if (!부 || 부 === "—" || 부.length > 12) return "";
  if (부.indexOf("{{") >= 0) return "";
  /* 인물 이름과 같으면 잘못 뽑은 것이다 — 안 바꾼다 */
  for (const c of (플롯.characters || [])) if (c && c.name === 부) return "";
  return 부;
}

/* 이 자리에 맞는 이름으로. 방 안이면 그 방 프로필, 아니면 **대표 프로필**.

   ★ 260912 — 두 가지를 한다 —
     ① `{{user}}` · `{{char}}` 자리표를 채운다
     ② **박혀 있는 유저 이름**을 지금 이름으로 바꾼다 (회원님 지시 ⑨)
   ②를 안 하면 모델이 플롯에 박힌 옛 이름을 그대로 쓴다 */
function 이름채우기(글, 플롯, 방){
  const 원 = String(글 == null ? "" : 글);
  if (!원) return 원;
  const p = 플롯 || S.플롯 || null;
  const 나 = (방 ? (방프로필(방, p) || {}).이름
                : ((기본프로필() || {}).이름 || (방프로필(null, p) || {}).이름)) || "나";
  const 인물 = ((p && p.characters) || [])[0] || {};
  let 낸것 = 원;
  if (낸것.indexOf("{{") >= 0){
    낸것 = 자리채우기(낸것, "{{user}}", 나);
    낸것 = 자리채우기(낸것, "{{char}}", 인물.name || (p && p.name) || "");
  }
  /* ② 박힌 이름 → 지금 이름. 같으면 그대로 둔다 */
  const 박힌 = 박힌이름(p);
  if (박힌 && 박힌 !== 나) 낸것 = 이름바꾸기(낸것, 박힌, 나);
  return 낸것;
}

/* 옛 이름을 새 이름으로 — **조사까지 맞추고, 낱말 안은 안 건드린다.**

   ★ 「준」을 바꾸다가 「준**비**」 「기**준**」까지 바꾸면 글이 깨진다.
     앞뒤가 한글 낱자면 낱말 안이므로 건너뛴다.
     뒤에 조사가 붙은 것과 띄어쓰기로 끝난 것만 바꾼다 */
const 붙는조사 = ["은", "는", "이", "가", "을", "를", "와", "과", "의", "도", "만",
                  "에", "에게", "한테", "께", "으로", "로", "랑", "이랑", "아", "야",
                  "이라", "라", "이나", "나", "보다", "처럼", "같이", "밖에", "부터", "까지"];
function 이름바꾸기(글, 옛, 새){
  const 원 = String(글 == null ? "" : 글);
  if (!옛 || !새 || 원.indexOf(옛) < 0) return 원;
  const 한글 = c => { const n = String(c || "").charCodeAt(0);
                      return n >= 0xAC00 && n <= 0xD7A3; };
  let 낸것 = "", i = 0;
  while (i < 원.length){
    const j = 원.indexOf(옛, i);
    if (j < 0){ 낸것 += 원.slice(i); break; }
    const 앞 = j > 0 ? 원[j - 1] : "";
    const 뒤자리 = j + 옛.length;
    const 뒤 = 뒤자리 < 원.length ? 원[뒤자리] : "";
    /* 앞이 한글이면 낱말 안이다 — 안 건드린다 */
    let 바꾸나 = !한글(앞);
    /* 뒤가 한글이면 조사인지 본다. 조사가 아니면 낱말 안이다 */
    if (바꾸나 && 한글(뒤)){
      const 뒷말 = 원.slice(뒤자리, 뒤자리 + 3);
      바꾸나 = 붙는조사.some(x => 뒷말.indexOf(x) === 0);
    }
    if (!바꾸나){ 낸것 += 원.slice(i, 뒤자리); i = 뒤자리; continue; }
    /* 조사를 새 이름 받침에 맞춘다 */
    낸것 += 새;
    i = 뒤자리;
    if (한글(뒤)){
      const 짝 = {"은": "는", "는": "은", "이": "가", "가": "이",
                  "을": "를", "를": "을", "과": "와", "와": "과",
                  "으로": "로", "로": "으로", "아": "야", "야": "아",
                  "이랑": "랑", "랑": "이랑"};
      /* 두 글자 조사를 먼저 본다 */
      const 두 = 원.slice(뒤자리, 뒤자리 + 2);
      const 한 = 원.slice(뒤자리, 뒤자리 + 1);
      const 받 = 받침있나(새);
      let 쓴것 = "";
      if (짝[두] !== undefined) 쓴것 = 두;
      else if (짝[한] !== undefined) 쓴것 = 한;
      if (쓴것){
        /* 받침 있으면 은·이·을·과·으로·아·이랑, 없으면 는·가·를·와·로·야·랑 */
        const 받침용 = {"은": "은", "는": "은", "이": "이", "가": "이",
                        "을": "을", "를": "을", "과": "과", "와": "과",
                        "으로": "으로", "로": "으로", "아": "아", "야": "아",
                        "이랑": "이랑", "랑": "이랑"};
        const 민용 = {"은": "는", "는": "는", "이": "가", "가": "가",
                      "을": "를", "를": "를", "과": "와", "와": "와",
                      "으로": "로", "로": "로", "아": "야", "야": "야",
                      "이랑": "랑", "랑": "랑"};
        낸것 += 받 ? 받침용[쓴것] : 민용[쓴것];
        i = 뒤자리 + 쓴것.length;
      }
    }
  }
  return 낸것;
}

function 프로필들(){

/* ★ 260912 회원님 지적 — 「프로필 생성 후 '기본프로필로 적용합니다' **체크 안했는데도**,
   다음 생성 프로필에서는 '준'이라고 **내 프로필 이름이 노출**되네」

   까닭이 여기 있었다 — `목.find(x => x.기본) || 목[0]`.
   **체크를 안 해도 첫 번째 것이 기본 노릇을 하고 있었다.**
   체크한 것만 기본이다. 없으면 없는 것이다 — 그때는 방마다 고르게 둔다. */
function 기본프로필(){
  return 프로필들().find(x => x.기본) || null;
}
/* ★ 260912 — **제타에서 받아 온 방은 도막에 그때의 이름이 박혀 있다.**

   실측 — 정예원 방 도막이 「주노」였다. 회원님이 제타에서 그 이름으로 노신 방이다.
   화면에도 「주노」로 떠 있는데, 앱은 프로필이 없다고 「나」를 모델에 보내고 있었다.
   소개에는 또 「준」이 박혀 있어서 **이름이 셋으로 갈렸고**,
   모델이 그중 「준」을 골라 「준의 눈이 멍하니 떠지는 꼴을 보며」라고 썼다 */
function 방옛이름(방){
  if (!방) return "";
  const 도막 = D.도막[방.id] || [];
  for (const m of 도막){
    if (((m.sender && m.sender.type) === "BOT")) continue;
    for (const c of (m.contents || [])){
      const n = String(c.speakerName || "").trim();
      if (n && n.indexOf("{{") < 0 && n !== "내레이터" && n.length <= 12) return n;
    }
  }
  /* 유저 도막이 없으면 봇 도막의 RIGHT 조각에서 */
  for (const m of 도막)
    for (const c of (m.contents || [])){
      if (c.position !== "RIGHT") continue;
      const n = String(c.speakerName || "").trim();
      if (n && n.indexOf("{{") < 0 && n.length <= 12) return n;
    }
  return "";
}

/* 이 방이 쓰는 프로필.
   방에 매인 것 → 기본 → **방 도막에 박힌 이름** → 플롯이 준 것 → 「나」 */
function 방프로필(방, 플롯){
  const 목 = 프로필들();
  if (방 && 방.프로필아이디){
    const 것 = 목.find(x => x.id === 방.프로필아이디);
    if (것) return 것;
  }
  const 기 = 기본프로필();
  if (기) return 기;
  /* ★ 260912 — 받아 온 방이면 그 방에 박힌 이름을 쓴다.
     「나」로 보내면 이름이 아니라 대명사가 되어 더 나쁘다 */
  const 옛 = 방옛이름(방);
  if (옛) return {id: "", 이름: 옛, 설명: ""};
  /* ★ 260911 — 제타 플롯의 chatProfiles 이름이 「{{user}}」 인 것이 있다.
     그대로 쓰면 유저 이름이 「{{user}}」 가 되어 **치환이 안 된다.** 자리표는 건너뛴다 */
  const 플 = ((플롯 && 플롯.chatProfiles) || [])[0];
  const 자리표 = n => !n || (n.indexOf("{{") >= 0) || n === "user";
  if (플 && !자리표(플.name)) return {id: "", 이름: 플.name, 설명: 플.description || ""};
  /* ★ 260912 — **플롯에 박힌 이름**을 쓴다.
     정예원 플롯 소개에 「준」이 박혀 있다. 그것이 이 플롯이 정한 유저 이름이다.
     「나」로 보내면 이름이 아니라 대명사라 모델이 소개의 「준」을 따라간다.
     실측 — 「나」로 보냈더니 답이 「준을 노려본다」 「준의 가슴께를」 이었다 */
  const 박 = 박힌이름(플롯);

  return {id: "", 이름: "나", 설명: ""};
}


/* ★★★★★ 260913 — **프롬프트로 보낼 프로필.** 화면용 `방프로필()` 과 갈라 둔다.

   왜 갈랐나 — 실측으로 찾은 흠이다. 정예원 방에서 한 마디를 치고 중계로 가는 재료를

   `방프로필()` 은 먼저 걸린 것에서 멈춘다. 방에 프로필아이디가 있으면 그것을 내주고

   플롯에 적힌 상세한 유저 설명(chatProfiles)은 그 뒤 순서라서 닿지 않는다.

   ★ `방프로필()` 을 고치지 않는 까닭 — 그것은 「프로필 고치기」 화면도 쓴다.
     거기에 플롯 값을 섞으면 회원님이 저장하실 때 플롯 값이 회원님 프로필로 담겨 버린다.

   여기서는 **이름은 회원님이 고른 것**을 그대로 두고, **빈 칸만** 플롯 값으로 메운다.
   회원님이 적으신 것이 있으면 그것이 언제나 이긴다. */
function 보낼프로필(방, 플롯){
  const 것 = 방프로필(방, 플롯) || {};
  const 플 = ((플롯 && 플롯.chatProfiles) || [])[0] || {};
  const 낸것 = {id: 것.id, 이름: 것.이름, 설명: 것.설명 || "", 비밀: 것.비밀 || "", 관계: 것.관계 || ""};
  /* 설명이 비면 플롯의 유저 설명으로 메운다 */
  if (!String(낸것.설명).trim() && String(플.description || "").trim())

  /* 한 줄 소개도 비면 쓴다 — 플롯이 정한 「이 유저는 누구인가」다 */

  else if (String(플.summary || "").trim() && String(낸것.설명).indexOf(플.summary) < 0)
    낸것.설명 = "[" + 플.summary + "]" + String.fromCharCode(10) + 낸것.설명;
  return 낸것;
}

/* ★ 260912 — **플롯당 방 하나.** 제타가 그렇게 돈다.
   회원님 : 「플롯당 대화방은 하나만 만들어지는 제타 … 내가 원하는건 제타 방식이다.」

   이미 그 플롯의 방이 있으면 **새로 만들지 않고 그 방으로 들어간다.** */
function 플롯의방(플롯아이디){
  if (!플롯아이디) return null;
  const 것 = D.방.filter(r => r.플롯아이디 === 플롯아이디);
  if (!것.length) return null;
  /* 여럿이면 **가장 최근** 것 (회원님 지시) */
  것.sort((a, b) => 방때(b) - 방때(a));
  return 것[0];
}

/* 이 방이 마지막으로 움직인 때 */
function 방때(방){
  const 도막 = D.도막[방.id] || [];
  const 끝 = 도막[도막.length - 1];
  const t = 끝 && 끝.messageTime;
  if (t){ const n = Date.parse(t); if (!isNaN(n)) return n; }
  if (방.만든때){ const n = Date.parse(방.만든때); if (!isNaN(n)) return n; }
  return 0;
}

/* 이 방에 든 값 — 걸린 시간 기록에서 모은다 */
function 방값(방아이디){
  let 목 = [];
  try { 목 = JSON.parse(localStorage.getItem("시간") || "[]"); } catch(_){}
  let 값 = 0;
  for (const x of 목) if (x.방아이디 === 방아이디) 값 += Number(x.값 || 0);
  return 값;
}

/* 턴 수 — 유저가 친 도막의 수 */
function 턴수(도막){
  let n = 0;
  for (const m of (도막 || [])) if (((m.sender && m.sender.type) !== "BOT")) n++;
  return n;
}

function 새대화(플롯){

              설정집들: ((플롯.설정집들 || []).slice()),

  const 도막 = 인트로도막(플롯, 방).filter(m => (m.contents || []).length);

      messageTime: new Date().toISOString()});

  D.방.unshift(방);

  알림("새 대화를 시작했습니다");
}
